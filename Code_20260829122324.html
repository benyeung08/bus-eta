<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港公共交通實時 ETA 系統 | 巴士 · 小巴 · 港鐵 · 輕鐵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.tailwind = window.tailwind || { config:{} }; (function(){ try{ tailwind.config = { darkMode:'class' }; }catch(e){} })();</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        html.dark ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blink-warning { animation: blink 0.5s ease-in-out infinite; }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0.7); }
            50% { box-shadow: 0 0 14px 4px rgba(239,68,68,0.7); }
        }
        .pulse-glow { animation: pulseGlow 1s ease-in-out infinite; }

        .arrived-status { background: linear-gradient(135deg, #39FF14 0%, #00CC00 100%); box-shadow: 0 0 8px rgba(57,255,20,0.6); }
        .arrived-terminal-status { background: linear-gradient(135deg, #FF8C00 0%, #FF4500 100%); box-shadow: 0 0 8px rgba(255,69,0,0.6); }
        .arrived-loop-status { background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%); box-shadow: 0 0 8px rgba(138,43,226,0.6); }
        .terminal-badge { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }

        .error-row { background-color: #fef2f2; color: #dc2626; }
        .dark .error-row { background-color: rgba(220,38,38,0.1); color: #f87171; }

        /* 時間燈號 */
        .light-green  { background: #22c55e; color: #fff; }
        .light-amber  { background: #f59e0b; color: #fff; }
        .light-red    { background: #ef4444; color: #fff; }
        .light-blue   { background: #3b82f6; color: #fff; }
        .light-purple { background: #a855f7; color: #fff; }

        .stat-card { transition: transform .15s ease; }
        .stat-card:hover { transform: translateY(-2px); }

        body, section, div, button, select, input { transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }

        /* 路線行駛進度條 */
        .route-progress { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        html.dark .route-progress { background: #334155; }
        .route-progress > i { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#22d3ee); border-radius: 3px; transition: width .6s ease; }

        /* 附近車站：內嵌即時到站預覽 */
        .inline-preview { animation: slideDown .25s ease; }
        @keyframes slideDown { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
        .inline-preview-row { display:flex; align-items:center; gap:.5rem; padding:.35rem .5rem; border-radius:.5rem; font-size:11px; }
        .inline-preview-row + .inline-preview-row { border-top:1px dashed rgba(148,163,184,.35); }
        .kbd-hint kbd { font-family:ui-monospace,monospace; background:#e2e8f0; border:1px solid #cbd5e1; border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:10px; color:#475569; }
        html.dark .kbd-hint kbd { background:#334155; border-color:#475569; color:#cbd5e1; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col text-slate-800 dark:bg-slate-900 dark:text-slate-200">
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- ============ 左側篩選面板 ============ -->
        <section class="md:col-span-4 lg:col-span-3 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 h-fit dark:bg-slate-800 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2 dark:border-slate-700">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2 dark:text-slate-200">
                    <i class="fa-solid fa-sliders text-blue-500"></i> <span data-lang="filter">路線篩選</span>
                </h2>
                <div class="flex items-center gap-1.5">
                    <button type="button" id="theme-toggle" aria-label="Toggle theme" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
                        <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                    </button>
                    <select id="lang-select" aria-label="Language Select" class="text-xs font-mono bg-slate-100 border border-slate-200 rounded-md px-1.5 py-1 focus:ring-2 focus:ring-blue-500 outline-none dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <option value="zh-Hant">繁中</option>
                        <option value="zh-Hans">簡中</option>
                        <option value="en">EN</option>
                    </select>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="mode">交通模式</label>
                    <div class="grid grid-cols-2 gap-2" id="mode-container">
                        <button type="button" data-mode="bus" class="mode-btn py-2.5 px-2 text-xs font-bold rounded-xl transition flex flex-col items-center gap-1 bg-blue-600 text-white shadow-sm">
                            <i class="fa-solid fa-bus text-base"></i><span data-lang="m_bus">巴士</span>
                        </button>
                        <button type="button" data-mode="gmb" class="mode-btn py-2.5 px-2 text-xs font-bold rounded-xl transition flex flex-col items-center gap-1 bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                            <i class="fa-solid fa-shuttle-van text-base"></i><span data-lang="m_gmb">小巴</span>
                        </button>
                        <button type="button" data-mode="mtr" class="mode-btn py-2.5 px-2 text-xs font-bold rounded-xl transition flex flex-col items-center gap-1 bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                            <i class="fa-solid fa-train-subway text-base"></i><span data-lang="m_mtr">港鐵</span>
                        </button>
                        <button type="button" data-mode="lrt" class="mode-btn py-2.5 px-2 text-xs font-bold rounded-xl transition flex flex-col items-center gap-1 bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                            <i class="fa-solid fa-train-tram text-base"></i><span data-lang="m_lrt">輕鐵</span>
                        </button>
                    </div>
                </div>

                <div id="company-group">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="company">巴士公司</label>
                    <select id="company-select" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <option value="KMB">九巴 KMB</option>
                        <option value="CTB">城巴 CTB</option>
                        <option value="LWB">龍運 LWB</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="route">輸入路線</label>
                    <div class="relative">
                        <input type="text" id="route-input" value="1A" placeholder="e.g. 1A / 720 / 1 / 505" class="w-full p-2.5 pl-3 pr-10 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-bold tracking-wide transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <button type="button" id="search-btn" aria-label="Search Route" class="absolute right-2 top-2 w-8 h-8 rounded-lg bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center transition shadow-sm">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1 dark:text-slate-500" id="route-hint" data-lang="route_hint_bus">巴士：1A、720；小巴：1、2；港鐵：TWL、TUM；輕鐵：505、507</p>
                </div>

                <div id="direction-group">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="direction">行車方向</label>
                    <div class="grid grid-cols-1 gap-2" id="direction-container">
                        <button type="button" id="dir-outbound" data-dir="outbound" class="dir-btn py-2.5 px-3 bg-blue-600 text-white text-sm rounded-xl font-medium shadow-sm transition text-left flex justify-between items-center">
                            <span data-lang="outbound">去程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-70"></i>
                        </button>
                        <button type="button" id="dir-inbound" data-dir="inbound" class="dir-btn py-2.5 px-3 bg-slate-100 text-slate-600 text-sm rounded-xl font-medium hover:bg-slate-200 transition text-left flex justify-between items-center dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                            <span data-lang="inbound">回程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-30"></i>
                        </button>
                    </div>
                </div>

                <div class="text-center pt-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-[11px] font-medium border border-emerald-100 w-full justify-center shadow-inner dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-800">
                        <i class="fa-solid fa-bolt text-amber-500 animate-pulse text-[11px]"></i> <span data-lang="refresh">秒級即時倒數 · 全自動背景同步</span>
                    </span>
                </div>

                <div class="flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500 border-t border-slate-100 pt-3 dark:border-slate-700">
                    <span class="flex items-center gap-1"><span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span><span data-lang="auto_sync">自動更新</span></span>
                    <span class="font-mono" id="last-sync">--:--:--</span>
                    <span class="font-mono text-slate-300 dark:text-slate-600">|</span>
                    <span class="font-mono" id="live-clock">--:--:--</span>
                </div>
            </div>
        </section>

        <!-- ============ 右側數據顯示區域 ============ -->
        <section class="md:col-span-8 lg:col-span-9 flex flex-col gap-4">

            <div id="route-banner" class="bg-gradient-to-r from-red-600 to-red-700 text-white p-5 rounded-2xl shadow-sm flex justify-between items-center transition-all duration-300">
                <div class="min-w-0">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl font-black bg-white text-red-600 px-3 py-0.5 rounded-xl shadow-sm shrink-0" id="info-route">1A</span>
                        <h3 class="text-lg font-bold tracking-wide truncate" id="info-direction">Loading...</h3>
                    </div>
                    <p class="text-xs opacity-80 mt-2 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> <span id="source" data-lang="source">結合政府開放 API、港鐵時刻與常規班次時間表</span></p>
                </div>
                <span class="bg-white/20 text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-sm shadow-inner uppercase tracking-wider shrink-0" id="company-badge">九巴 KMB</span>
            </div>

            <!-- 服務狀態 / 當日公告條 -->
            <div id="service-alert" class="hidden rounded-2xl border p-3 text-xs flex items-start gap-2 dark:border-slate-700"></div>

            <!-- 路線切換提示（由附近車站的「即時到站」按鈕觸發時短暫顯示） -->
            <div id="route-switched-toast" class="hidden items-center gap-2 px-4 py-2 rounded-2xl bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 text-blue-800 dark:text-blue-200 text-xs font-medium transition-all duration-300">
                <i class="fa-solid fa-bolt text-blue-500 animate-pulse"></i>
                <span id="route-switched-text"></span>
            </div>

            <div class="flex bg-slate-200 p-1 rounded-xl dark:bg-slate-700 flex-wrap">
                <button type="button" id="tab-btn-nearby" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition flex justify-center items-center gap-2 bg-white text-emerald-600 shadow-sm dark:bg-slate-800 dark:text-emerald-400">
                    <i class="fa-solid fa-location-crosshairs"></i> <span data-lang="nearby_tab">附近車站</span>
                </button>
                <button type="button" id="tab-btn-timetable" class="flex-1 py-2.5 text-xs sm:text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2 dark:text-slate-400 dark:hover:text-white">
                    <i class="fa-solid fa-calendar-days"></i> <span data-lang="tt_tab">班次時間表</span>
                </button>
                <button type="button" id="tab-btn-alerts" class="flex-1 py-2.5 text-xs sm:text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2 dark:text-slate-400 dark:hover:text-white relative">
                    <i class="fa-solid fa-triangle-exclamation"></i> <span data-lang="alerts_tab">當日服務動態</span>
                    <span id="alerts-badge" class="hidden absolute top-1 right-2 w-4 h-4 rounded-full bg-red-500 text-white text-[8px] font-black flex items-center justify-center">0</span>
                </button>
            </div>

            <!-- 沿站即時到站（恆常顯示，不受頁簽切換影響；僅港鐵/輕鐵不顯示即時倒數） -->
            <div id="panel-eta" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow flex flex-col dark:bg-slate-800 dark:border-slate-700">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider grid grid-cols-12 dark:bg-slate-700/50 dark:text-slate-400 dark:border-slate-700">
                    <div class="col-span-1 text-center" data-lang="col_seq">#</div>
                    <div class="col-span-6" data-lang="col_stop">分站名稱</div>
                    <div class="col-span-5 text-right" data-lang="col_time">預計到站時間 / 燈號</div>
                </div>
                <div id="stops-container" class="divide-y divide-slate-100 dark:divide-slate-700">
                </div>
                <div class="px-4 py-2 border-t border-slate-100 dark:border-slate-700 flex items-center gap-3 text-[10px] text-slate-400">
                    <span id="eta-progress-label" class="whitespace-nowrap"><i class="fa-solid fa-route text-slate-300 mr-1"></i><span data-lang="progress">路線進度</span></span>
                    <div class="route-progress flex-grow"><i id="eta-progress-bar" style="width:0"></i></div>
                    <span class="kbd-hint hidden sm:inline"><kbd>/</kbd> <span data-lang="kb_search">搜尋</span></span>
                </div>
            </div>

            <!-- 附近車站功能頁面（獨立頁簽） -->
            <div id="panel-nearby" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow hidden flex flex-col dark:bg-slate-800 dark:border-slate-700">
                <div id="nearby-page" class="flex-grow flex flex-col">
                    <div class="px-4 py-3 flex items-center gap-2 border-b border-slate-100 dark:border-slate-700">
                        <i class="fa-solid fa-location-crosshairs text-emerald-500"></i>
                        <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400" data-lang="nearby_page_title">附近車站 · 途經路線</span>
                        <span id="nearby-center-name" class="ml-1 text-[11px] text-slate-400 truncate">--</span>
                        <div class="ml-auto flex items-center gap-1.5 shrink-0">
                            <button id="gps-locate-btn" type="button" class="group flex items-center gap-1 px-2 py-1 rounded-md bg-emerald-500 hover:bg-emerald-600 text-white text-[10px] font-bold shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed" title="使用 GPS 定位最近車站">
                                <i id="gps-icon" class="fa-solid fa-location-arrow text-[10px] group-active:animate-spin"></i>
                                <span id="gps-label" data-lang="gps_locate">定位最近站</span>
                            </button>
                            <label class="flex items-center gap-1 text-[10px] text-slate-500 dark:text-slate-400" title="搜尋半徑">
                                <i class="fa-solid fa-ruler"></i>
                                <select id="nearby-radius-page" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded px-1 py-0.5 text-[10px] focus:ring-1 focus:ring-emerald-500 outline-none">
                                    <option value="200">200m</option>
                                    <option value="350" selected>350m</option>
                                    <option value="500">500m</option>
                                    <option value="800">800m</option>
                                </select>
                            </label>
                            <button id="nearby-refresh-btn" class="w-6 h-6 rounded-md bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:text-emerald-600 flex items-center justify-center transition" title="重新整理">
                                <i class="fa-solid fa-rotate text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                    <!-- 本站即時 ETA -->
                    <div id="nearby-here" class="border-b border-slate-100 dark:border-slate-700"></div>
                    <!-- ★ 就地展開的「對應線路實時到站」面板（巴士/小巴：按下線路區按鈕後在此顯示） -->
                    <div id="inline-live-mount" class="hidden"></div>
                    <!-- 附近其他車站 -->
                    <div id="nearby-stations" class="p-4 space-y-3 overflow-y-auto"></div>
                </div>
            </div>

            <!-- 時間表頁簽 -->
            <div id="panel-timetable" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow hidden p-5 dark:bg-slate-800 dark:border-slate-700">
                <div id="timetable-container" class="space-y-6 max-h-[55vh] overflow-y-auto pr-1"></div>
            </div>

            <!-- 當日服務動態頁簽 -->
            <div id="panel-alerts" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow hidden p-4 dark:bg-slate-800 dark:border-slate-700">
                <div id="alerts-container" class="space-y-4 max-h-[55vh] overflow-y-auto pr-1"></div>
            </div>

        </section>
    </main>

    <!-- 附近路線彈出式 Modal -->
    <div id="stop-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4 transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-xl w-full max-h-[85vh] flex flex-col border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-700/50">
                <div class="min-w-0">
                    <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider block" data-lang="nearby_title">附近路線 ETA</span>
                    <h3 id="modal-stop-name" class="text-base font-black text-slate-800 dark:text-slate-100 mt-0.5 truncate">--</h3>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <label class="flex items-center gap-1 text-[10px] text-slate-500 dark:text-slate-400" title="搜尋半徑">
                        <i class="fa-solid fa-ruler"></i>
                        <select id="nearby-radius" class="bg-slate-100 dark:bg-slate-600 border border-slate-200 dark:border-slate-500 rounded px-1 py-0.5 text-[10px] focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="200">200m</option>
                            <option value="350" selected>350m</option>
                            <option value="500">500m</option>
                            <option value="800">800m</option>
                        </select>
                    </label>
                    <button type="button" id="modal-close-btn" aria-label="Close modal" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-500 flex items-center justify-center transition cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <!-- 內嵌「沿站即時到站」面板容器：由 openRouteLive 注入，獨立於下方列表，重繪時受保護 -->
            <div id="modal-inline-live-wrap" class="hidden"></div>
            <!-- 當前站即時 ETA（同站所有路線）-->
            <div id="modal-here-block" class="border-b border-slate-100 dark:border-slate-700"></div>
            <!-- 附近其他站 -->
            <div id="modal-nearby-block" class="p-4 overflow-y-auto space-y-3 flex-grow"></div>
        </div>
    </div>

    <script>
    /* ==================================================================
     *  香港公共交通實時 ETA 系統
     *  支援：巴士(KMB/CTB/LWB)、小巴(GMB)、港鐵(MTR)、輕鐵(LRT)
     *  - 全自動秒級倒數 + 背景 API 同步
     *  - 當日服務動態：取消 / 新增 / 臨時改道 / 修改 / 天氣影響 / 恢復
     *  - 起點 / 中途 / 終點 時間燈號（閃爍 + 狀態文字）
     * ================================================================== */
    const translations = {
        "zh-Hant": {
            filter:"路線篩選", mode:"交通模式", m_bus:"巴士", m_gmb:"小巴", m_mtr:"港鐵", m_lrt:"輕鐵",

function stopNameLang(item){

    function cacheSet(key, val){

    // 取中英雙語字串中的當前語言片段（"荃灣 Tsuen Wan" → 依 currentLang 取其一）
    function stripLang(text){
        if(!text)return '';
        if(currentLang==='en'){
            const m=String(text).match(/[\u0000-\u007F\s\(\)\-]+$/);
            return (m?m[0]:text).trim();
        }
        // 中文：取前半段非 ASCII 部分
        const m=String(text).match(/^([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef\w]+)/);
        return (m?m[1]:text).trim();
    }

    /* ==================== API：巴士 (KMB / CTB) ====================
       官方規範（2024 起生效）：
       · KMB/LWB：data.etabus.gov.hk/v1  (route-stop / stop / eta / stop-eta)
       · Citybus：2023-12-31 起 V1(rt.data.gov.hk/v1/.../citybus-nwfb/) 停用，
                   統一改用 V2：rt.data.gov.hk/v2/transport/citybus/
         - route-stop：/v2/transport/citybus/route-stop/{co}/{route}/{direction}
         - eta：      /v2/transport/citybus/eta/{co}/{stop}/{route}
         - stop：     /v2/transport/citybus/stop/{stop}
       參考：政府資料字典（KMB dir: "O"|"I"；Citybus dir: "I"=Inbound/"O"=Outbound）。
       向下相容：tryV2 失敗時自動 fallback 到 V1，避免舊環境斷資料。 */
    const FETCH_TIMEOUT = 8000;
    // 帶超時的 fetch：避免慢網路/API 卡死導致 UI 永遠轉圈
    async function fetchJSON(url, {timeout=FETCH_TIMEOUT}={}){
        const ctrl=new AbortController();
        const t=setTimeout(()=>ctrl.abort(),timeout);
        try{
            const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
            clearTimeout(t);
            if(!r.ok)return null;
            return await r.json();
        }catch{ clearTimeout(t); return null; }   // 網路錯誤 / 逾時 → 回傳 null（上層容錯）
    }

    // Citybus 端點：優先 V2，失敗 fallback V1
    function ctbEndpoint(pathV2, pathV1){
        const v2='https://rt.data.gov.hk/v2/transport/citybus'+pathV2;
        const v1='https://rt.data.gov.hk/v1/transport/citybus-nwfb'+pathV1;
        return {v2,v1};
    }

    async function fetchBusRouteStops(route, co){
        const enc=encodeURIComponent(route);
        try{
            let a,b;
            if(co==='KMB'||co==='LWB'){
                const j=await Promise.all([
                    fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${enc}/outbound/1`),
                    fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${enc}/inbound/1`)
                ]);
                a=j[0]; b=j[1];
                return { outbound:(a&&a.data||[]).map(x=>({stop:x.stop,seq:x.seq})), inbound:(b&&b.data||[]).map(x=>({stop:x.stop,seq:x.seq})) };
            } else {
                // Citybus：V2 為主，V1 fallback
                const ep=ctbEndpoint(`/route-stop/${co}/${enc}/outbound`,`/route-stop/${co}/${enc}/outbound`);
                const [av,bv]=await Promise.all([
                    fetchJSON(ep.v2).then(d=>d||fetchJSON(ep.v1)),
                    fetchJSON(ep.v2.replace('/outbound','/inbound')).then(d=>d||fetchJSON(ep.v1.replace('/outbound','/inbound')))
                ]);
                const norm=(d)=>(d&&d.data||[]).map(x=>({stop:x.stop||x.stop_id,seq:x.seq}));
                return { outbound:norm(av), inbound:norm(bv) };
            }
        }catch{ return {outbound:[],inbound:[]}; }
    }

    async function fetchBusStopName(stopId, co){
        if(!stopId)return getText('stop_load_error');
        const cacheKey=`${co}_${stopId}`;
        if(!stopDataCache.has(cacheKey)){
            let d=null;
            try{
                if(co==='KMB'||co==='LWB'){
                    d=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${encodeURIComponent(stopId)}`))?.data;
                } else {
                    // Citybus V2 / V1 fallback
                    const ep=ctbEndpoint(`/stop/${encodeURIComponent(stopId)}`,`/stop/${encodeURIComponent(stopId)}`);
                    d=(await fetchJSON(ep.v2))?.data || (await fetchJSON(ep.v1))?.data;
                }
                if(d)cacheSet(cacheKey,d);
            }catch{ return getText('stop_load_error'); }
        }
        const d=stopDataCache.get(cacheKey); if(!d)return getText('stop_load_error');
        if(currentLang==='zh-Hans')return d.name_sc||d.name_tc||getText('stop_load_error');
        if(currentLang==='en')return d.name_en||d.name_tc||getText('stop_load_error');
        return d.name_tc||getText('stop_load_error');
    }

    // 正規化方向為 "O"/"I"（相容 KMB/CTB 的 "O"/"I" 與可能的 "outbound"/"inbound" 字串）
    function normDir(dir){
        if(dir==null)return null;
        const s=String(dir).toUpperCase();
        if(s==='O'||s==='OUTBOUND')return 'O';
        if(s==='I'||s==='INBOUND')return 'I';
        return null;
    }

    async function fetchBusStopETA(stopId, route, co){
        const useCo = co==='LWB' ? 'KMB' : co;
        try{
            let list=[];
            if(useCo==='KMB'){
                // KMB 用「按路線查詢」端點 eta/{stop}/{route}/{serviceType}，較 stop-eta 精準
                const j=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}/1`))?.data;
                list=j||[];
                // service_type=1 查無時，嘗試 2/3（特班/特快走線）
                if(!list.length){
                    for(const st of [2,3]){
                        const j2=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}/${st}`))?.data;
                        if(j2&&j2.length){ list=j2; break; }
                    }
                }
            } else {
                // Citybus V2：eta/{co}/{stop}/{route}；失敗 fallback V1
                const ep=ctbEndpoint(`/eta/${co}/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}`,`/eta/${co}/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}`);
                const j=(await fetchJSON(ep.v2))?.data || (await fetchJSON(ep.v1))?.data;
                list=j||[];
            }
            // 過濾：本路線 + 本方向。wantDir 為 null（API 未提供方向）時不強過濾，避免全部被濾掉。
            const wantDir = currentDirection==='inbound' ? 'I' : 'O';
            return list
                .filter(i=>i&&i.eta&&String(i.route||i.route_no||'').toUpperCase()===String(route).toUpperCase())
                .filter(i=> { const nd=normDir(i.dir); return nd==null || nd===wantDir; })  // 未知方向→保留（容錯）
                .map(i=>({eta:i.eta,rmk:i.rmk_tc||i.rmk, dir:i.dir, dest:i.dest_tc||i.dest}));
        }catch{ return []; }
    }

    /* ==================== API：小巴 (GMB) —— 政府 API 無統一 ETA，用模擬即時 + 靜態時間表 ==================== */
    function gmbStopName(seq, dir, total){
        const ends = { outbound:{start:"起點站",end:"終點站"}, inbound:{start:"終點站",end:"起點站"} };
        if(seq===1) return ends[dir].start;
        if(seq===total) return ends[dir].end;
        return `中途站 ${seq}`;
    }
    function generateGmbETA(route, stopSeq, totalStops){
        // 模擬即時：依據班次間距產生動態 ETA（開發/離線可用）
        const now=Date.now();
        const baseCoef = (route.length*7+stopSeq*3)%5+1;
        const first = new Date(now + (baseCoef*35000) + (stopSeq-1)*90000);
        const second = new Date(first.getTime() + (baseCoef*60000)+180000);
        return [{eta:first.toISOString()},{eta:second.toISOString()}];
    }

    /* ==================== API：港鐵 / 輕鐵 ==================== */
    // MTR/LRT 使用靜態車站表 + 即時模擬倒數（港鐵無公開即時到站 API）
    //
    // 核心思路：港鐵/輕鐵是「高頻、定時距」系統，班次以「幾分鐘一班」表示。
    // 為呈現如官方時刻表般的「逐站遞進到達時刻」（例：21:18 → 21:14 → 21:10 …），
    // 我們以「最近一班將發車的列車」為基準，從起點依序累加站間行車時間，
    // 算出每一站的實時到達時刻。這些時刻會隨 Date.now() 每秒自動倒數，
    // 與巴士的即時 ETA 倒數體驗完全一致。
    //
    // 站間行車時間（秒）：港鐵市區線約 100-150s，荃灣綫/觀塘綫約 110s；輕鐵約 150-180s。
    // 班次間隔：由 staticTimetables 的 frequency 決定（MTR 預設 3 min，LRT 預設 12 min）。
    const RAIL_TRAVEL_SEC = { mtr:115, lrt:165 };
    const RAIL_INTERVAL_MIN = { mtr:3, lrt:12 };

    // 計算「基準列車」離開起點的時刻：對齊到當前時間往後取最近一個班次時刻
    function railReferenceDeparture(nowMs, intervalMin){
        const intervalMs = intervalMin*60000;
        // 以「今天 06:00 起每 intervalMin 一班」為時刻骨架，取 >= nowMs 的第一班
        const dayStart = new Date(nowMs);
        dayStart.setHours(6,0,0,0);
        let t = dayStart.getTime();
        while(t < nowMs){ t += intervalMs; }
        // 若已過服務時段末（00:00 後），回退到下一班骨架（避免顯示過大倒數）
        const serviceEnd = new Date(nowMs); serviceEnd.setHours(0,30,0,0);
        if(t > serviceEnd.getTime() + intervalMs){ t = nowMs + intervalMs; }
        return t;
    }

    // 回傳一條完整線路的時刻表：{ stopSeq -> [etaISO, etaISO(下一班)] }
    // 這是港鐵/輕鐵的「列車時刻表」——每站有遞進的實際到達時刻。
    function buildRailSchedule(line, totalStops){
        const mode = currentMode; // 'mtr' | 'lrt'
        const intervalMin = RAIL_INTERVAL_MIN[mode] || 3;
        const travelSec = RAIL_TRAVEL_SEC[mode] || 120;
        const nowMs = Date.now();
        const depMs = railReferenceDeparture(nowMs, intervalMin); // 基準列車起點發車時刻

        // 第 1 班：起點 depMs 出發，逐站累加行車時間
        const first = new Array(totalStops);
        first[0] = depMs;
        for(let i=1;i<totalStops;i++){ first[i] = first[i-1] + travelSec*1000; }
        // 第 2 班：一班間隔之後
        const second = first.map(t => t + intervalMin*60000);

        const schedule = {};
        for(let i=0;i<totalStops;i++){
            schedule[i+1] = [
                { eta: new Date(first[i]).toISOString() },
                { eta: new Date(second[i]).toISOString() }
            ];
        }
        return schedule;
    }

    // 供單一站點呼叫：返回該站在「基準列車」的到達時刻（含下一班）
    function generateRailETA(line, stopSeq, totalStops, isLoop){
        const schedule = buildRailSchedule(line, totalStops);
        return schedule[stopSeq] || [{eta:new Date(Date.now()+180000).toISOString()},{eta:new Date(Date.now()+360000).toISOString()}];
    }

    /* ==================== 統一資料載入 ==================== */
    async function loadRouteData(){
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        const route = currentRoute;
        const dir = currentDirection;
        let stops=[], etaMap={}, isLoop=false;

        if(currentMode==='bus'){
            const rs = await fetchBusRouteStops(route, co);
            // ★ 方向容錯：若本方向 API 回空（部分路線只有單方向資料），先退回另一方向，
            //   再退回 staticTimetables 靜態站序，確保「所有方向」都一定顯示站名 + 站數，
            //   而非整片空白。最終仍無資料才放棄。
            let list = (dir==='inbound'? rs.inbound : rs.outbound)||[];
            let usedDir = dir;
            if(!list.length){
                const fallback = (dir==='inbound'? rs.outbound : rs.inbound)||[];
                if(fallback.length){ list=fallback; usedDir = (dir==='inbound'?'outbound':'inbound'); }
            }
            if(!list.length){
                const stt = (staticTimetables[co]&&staticTimetables[co][route]) || (staticTimetables.GMB && staticTimetables.GMB[route]);
                if(stt && stt.stops){
                    const arr = (usedDir==='inbound'? stt.stops.slice().reverse(): stt.stops.slice());
                    list = arr.map((name,idx)=>({ stop:`static_${idx+1}`, seq:idx+1, _staticName:name }));
                }
            }
            if(!list.length){ activeRouteData=null; return buildEmpty(`No stops (${co} ${route} ${dir})`); }
            stops = list.map(s=>s.stop);
            // ★ 若來自靜態站序（方向 API 空時的 fallback），把 _staticName 包成 name 物件掛回 stops，
            //   讓下方「並行抓名」與 renderEtaList 能顯示真實站名（而非佔位）。
            list.forEach((s,idx)=>{
                if(s._staticName!=null && !(stops[idx] && stops[idx].name)){
                    const nm=String(s._staticName).trim();
                    stops[idx] = Object.assign({}, stops[idx], { name:{ name_tc:nm, name_en:nm, name_sc:nm }, _fallback:false });
                }
            });
            void staticNames;
            // 並行抓 ETA（限制並發）
            const results=await mapWithConcurrency(list,6,async(item)=>{
                const name=await fetchBusStopName(item.stop, co);
                const etas=await fetchBusStopETA(item.stop, route, co);
                // 把座標一併掛到 stop 物件，供 stopLatLon()/附近車站直接使用（cache 可能尚未就緒）
                const cached=stopDataCache.get(`${co}_${item.stop}`)||stopDataCache.get(item.stop)||{};
                const lat=parseFloat(cached.lat), lon=parseFloat(cached.long||cached.lon);
                return { stopId:item.stop, seq:item.seq, name, etas, lat:isNaN(lat)?null:lat, lon:isNaN(lon)?null:lon };
            });
            results.forEach(r=>{ etaMap[r.stopId]=r.etas; });
            activeRouteData={ stops:results, etaMap, co, route, dir };
        }
        else if(currentMode==='gmb'){
            const tt = staticTimetables.GMB[route] || { outbound:[{day:'daily',periods:[{t:'06:00-23:00',f:'10 min'}]}], inbound:[{day:'daily',periods:[{t:'06:00-23:00',f:'10 min'}]}] };
            const total = 10;
            const list=[]; for(let i=1;i<=total;i++)list.push(i);
            const results=await mapWithConcurrency(list,10,async(seq)=>{
                const name=gmbStopName(seq,dir,total);
                const etas=generateGmbETA(route,seq,total);
                return { stopId:`gmb_${route}_${seq}`, seq, name, etas };
            });
            activeRouteData={ stops:results, etaMap:{}, co, route, dir, gmb:true };
            isLoop=false;
        }
        else { // mtr / lrt
            const tt = staticTimetables[co]?.[route];
            if(!tt){ activeRouteData=null; return; }
            // 依方向取站序：outbound = 基準 stops；inbound = 反轉（終點→起點）。
            // 反轉後 index 0 仍為「本方向起點」，buildRailSchedule 的起點→終點遞進邏輯無需更動。
            let stationNames = tt.stops || [];
            const isInbound = (dir==='inbound');
            if(isInbound){ stationNames = stationNames.slice().reverse(); }
            const total=stationNames.length;
            const results=await mapWithConcurrency(stationNames, stationNames.length, async(name,idx)=>{
                const seq=idx+1; // seq 依顯示順序：1 = 本方向起點
                const etas=generateRailETA(route,seq,total);
                return { stopId:`${co}_${route}_${seq}`, seq, name, etas };
            });
            activeRouteData={ stops:results, etaMap:{}, co, route, dir, rail:true, total,
                              dest:destForDir(tt,dir), inbound:isInbound };
            isLoop = currentMode==='lrt'; // 輕鐵多為循環/雙向
        }
    }

    function buildEmpty(msg){ activeRouteData=null; }

    async function mapWithConcurrency(items, limit, fn){
        if(!items||items.length===0)return [];
        const results=new Array(items.length); let idx=0;
        const workers=Array.from({length:Math.min(limit,items.length)},async()=>{
            while(idx<items.length){ const ci=idx++; try{ results[ci]=await fn(items[ci],ci); }catch(e){ results[ci]={seq:ci+1,name:getText('stop_load_error'),etas:[],stopId:''}; } }
        });
        await Promise.all(workers); return results;
    }

    /* ==================== 時間燈號核心邏輯 ====================
       - 起點站：ETA ≤ 5 分鐘開始閃爍(amber)；≥ 2 分鐘顯示「即將開出」；≤ 1 分鐘顯示「開出中」，之後顯示下一班
       - 中途站：ETA ≤ 1 分鐘閃爍 + 「即將到站」；接著「離站中」，之後下一班
       - 終點站：ETA ≤ 1 分鐘閃爍 + 「已到達終點，請所有乘客落車」 */
    // 計算「剩餘分鐘數」。返回 -1 表示無資料；返回 0 表示「即將到達/剛離開」。
    // 關鍵修正：ms 在 [-60000, 0] 區間（上一班剛走 60 秒內）一律返回 0，
    // 避免港鐵/輕鐵動態班次在「剛過期」時跳回 -1，導致畫面只顯示時刻、不顯示「分鐘」。
    // 依方向取得終點站名稱（支援港鐵/輕鐵雙方向 dest：{outbound,inbound} 或舊式單一字串）
    function destForDir(tt, dir){
        if(!tt)return '';
        const d=tt.dest;
        if(d && typeof d==='object' && d[dir])return d[dir];
        if(d && typeof d==='string')return d;
        // 退化：依 stops 陣列推導
        const arr=(tt.stops||[]);
        if(arr.length){ return dir==='inbound'? arr[0] : arr[arr.length-1]; }
        return '';
    }

    function calcMins(iso){ if(!iso)return -1; const d=new Date(iso); if(isNaN(d.getTime()))return -1; const ms=d.getTime()-Date.now(); if(ms<=-90000)return -1; const m=Math.ceil(ms/60000); return m<0?0:m; }
    function fmtHM(iso){ if(!iso)return '--:--'; const d=new Date(iso); if(isNaN(d.getTime()))return '--:--'; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

    function timeLightHTML(stop, stopIndex, totalStops){
        const isStart = stopIndex===0;
        const isEnd = stopIndex===totalStops-1;
        const isMid = !isStart && !isEnd;
        // 關鍵修正：過濾掉已過期的班次（calcMins<0），確保 m1 永遠取到「下一班未來車」的分鐘數，
        // 讓所有車站（巴士/小巴/港鐵/輕鐵）都穩定顯示「XX 分鐘」。
        const etas = (stop.etas||[])
            .filter(e=>e&&e.eta)
            .map(e=>({eta:e.eta, mins:calcMins(e.eta)}))
            .filter(e=>e.mins>=0)
            .sort((a,b)=>a.mins-b.mins);
        const m1 = etas[0]? etas[0].mins : -1;
        const m2 = etas[1]? etas[1].mins : -1;
        const minUnit=getText('min');

        // 狀態判定
        let phase='normal', lightClass='light-blue', label='', sub='';
        let blink=false;

        if(isStart){
            if(m1>=0 && m1<=5){ // ≤5 分鐘：閃爍
                blink=true;
                if(m1<=1){ phase='departing'; lightClass='light-red pulse-glow'; label=getText('bus_departing'); sub=`<span class="text-[10px] text-slate-400">${getText('next_bus')}: ${m2>=0?m2+' '+minUnit:'-'}</span>`; }
                else if(m1>=2){ phase='departing'; lightClass='light-amber blink-warning'; label=`<i class="fa-solid fa-person-running"></i> ${getText('departs_in')} (${m1} ${minUnit})`; sub=`<span class="text-[10px] text-slate-400">${getText('boarding_now')}</span>`; }
            }
        } else if(isEnd){
            if(m1<=1 && m1>=0){ phase='terminal'; blink=true; lightClass='light-red pulse-glow'; label=`<i class="fa-solid fa-flag-checkered"></i> ${getText('arrive_terminal')}`; sub=`<span class="text-[10px] text-red-600 dark:text-red-400 font-bold">${getText('all_remaining')}</span>`; }
            else if(m1<=3){ phase='terminal-near'; blink=true; lightClass='light-amber blink-warning'; label=`<i class="fa-solid fa-clock-rotate-left"></i> ${getText('arr_terminal_shortly')}`; }
        } else { // 中途
            if(m1<=1 && m1>=0){ phase='arriving'; blink=true; lightClass='light-red pulse-glow'; label=`<i class="fa-solid fa-bus"></i> ${getText('mid_arr')}`; sub=`<span class="text-[10px] text-slate-400">${getText('next_bus')}: ${m2>=0?m2+' '+minUnit:'-'}</span>`; }
            else if(m1>1 && m1<=4){ phase='mid-soon'; blink=true; lightClass='light-amber blink-warning'; label=`<i class="fa-solid fa-person-walking"></i> ${getText('arr_shortly')} (${m1} ${minUnit})`; }
        }

        // 一律顯示「XX 分鐘」。即使 m1<0（無有效未來班次），也用原始 eta 估算分鐘數，
        // 徹底避免畫面只顯示「21:18」這類純時刻而遺失「分鐘」單位。
        let primaryTime='';
        if(m1>=0){
            primaryTime=`<span class="eta-val font-black ${m1<=1?'text-red-600 dark:text-red-400':(m1<=5?'text-amber-600 dark:text-amber-400':'text-slate-800 dark:text-slate-100')}">${m1}</span><span class="text-[10px] ${m1<=1?'text-red-500':'text-slate-400'}">${minUnit}</span> <span class="text-[10px] text-slate-400 font-mono">(${fmtHM(etas[0]&&etas[0].eta)})</span>`;
        } else {
            // 兜底：用原始第一班 eta 計算近似分鐘（可為負，表示已過期），確保一定有「分鐘」顯示
            const rawEta=(stop.etas&&stop.etas[0]&&stop.etas[0].eta)||(etas[0]&&etas[0].eta)||'';
            if(rawEta){ const rawMs=new Date(rawEta).getTime()-Date.now(); const rawM=Math.round(rawMs/60000); primaryTime=`<span class="eta-val font-black ${rawM<=1?'text-red-600 dark:text-red-400':'text-slate-500'}">${rawM}</span><span class="text-[10px] text-slate-400">${minUnit}</span> <span class="text-[10px] text-slate-400 font-mono">(${fmtHM(rawEta)})</span>`; }
        }

        const light = `<span class="w-3 h-3 rounded-full inline-block ${lightClass} ${blink?'blink-warning':''}" title="signal"></span>`;
        const badge = label? `<div class="flex flex-col items-end gap-0.5">${light}<span class="text-[10px] font-bold text-red-600 dark:text-red-400 leading-tight">${label}</span>${sub}</div>` : `<div class="flex flex-col items-end gap-0.5">${light}<span class="text-[10px] text-slate-400">${m1>5?m1+' '+minUnit:'—'}</span></div>`;

        return { html: badge, primaryTime, mins:m1 };
    }

    /* ==================== 渲染 ETA 列表 ==================== */
    function renderEtaList(){
        if(!activeRouteData || !activeRouteData.stops.length){ stopsContainer.innerHTML=`<div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-circle-exclamation text-2xl mb-2"></i><br>${getText('not_found')}</div>`; return; }
        const stops=activeRouteData.stops;
        const total=stops.length;
        const isRail=!!activeRouteData.rail;
        const isGmb=!!activeRouteData.gmb;
        const dirLabel = currentDirection==='outbound'? getText('outbound'):getText('inbound');

        // ★ 站名數量條（所有方向都顯示）：已解析真實站名 vs 佔位名，語言自適應
        const PLACEHOLDER=/^(中途站\s*\d+|起點站|終點站|小巴中途站|街市街市|邨口|港鐵站口|相鄰月台|轉車站|出口\s*A|公共運輸交匯處|站\s*\d+|Stop\s*\d+|\S+\s*站\s*\d+)$/;
        const namedCount = stops.filter(s=>{
            const nm=stopNameLang(s&&s.name); if(!nm)return false;
            const isFallback = (s&&s.name&&typeof s.name==='object'&&s.name._fallback);
            return !isFallback && !PLACEHOLDER.test(nm.trim());
        }).length;
        const cntLabel = (currentLang==='zh-Hans')
            ? `共 ${total} 站 · 已解析 ${namedCount} 個站名`
            : (currentLang==='en') ? `Total ${total} stops · ${namedCount} named` : `共 ${total} 個站 · 已解析 ${namedCount} 個站名`;
        const countBar = `<div class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 text-[10px] text-slate-500 dark:text-slate-300 flex items-center gap-2 border-b border-slate-200 dark:border-slate-600">
            <i class="fa-solid fa-list-ol"></i> <span>${cntLabel}</span>
            <span class="ml-auto text-emerald-600 dark:text-emerald-400 font-mono">${escapeHtml(currentRoute||'')} · ${dirLabel}</span>
        </div>`;

        let html=countBar;
        stops.forEach((stop, i)=>{
            const isStart=i===0, isEnd=i===total-1;
            const {html:badge, primaryTime} = timeLightHTML(stop, i, total);

            let roleBadge='';
            if(isStart) roleBadge=`<span class="terminal-badge text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold mr-1">${getText('terminal')}</span>`;
            else if(isEnd) roleBadge=`<span class="bg-orange-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold mr-1">${getText('end_terminal')}</span>`;

            const stopNameText = stopNameLang(stop.name);
            const sameStopBtn = (!isRail) ? `<button class="btn-nearby-center text-[10px] text-emerald-600 dark:text-emerald-400 hover:underline" data-stop-id="${escapeHtml(stop.stopId)}" data-stop-seq="${i}" data-stop-name="${escapeHtml(stopNameText)}"><i class="fa-solid fa-location-crosshairs"></i> ${getText('nearby_set_center')}</button>` : '';

            html+=`
            <div class="grid grid-cols-12 items-center px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/30 ${isStart?'bg-emerald-50/60 dark:bg-emerald-900/10':''} ${isEnd?'bg-orange-50/60 dark:bg-orange-900/10':''}" data-stop-seq="${i}">
                <div class="col-span-1 text-center text-slate-400 font-mono text-sm">${stop.seq||i+1}</div>
                <div class="col-span-7 min-w-0">
                    <div class="font-medium text-sm truncate flex items-center">${roleBadge}${escapeHtml(stopNameText)}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-2">${sameStopBtn}</div>
                </div>
                <div class="col-span-4 text-right flex flex-col items-end justify-center gap-0.5" data-eta-time="${stop.etas&&stop.etas[0]?stop.etas[0].eta:''}">
                    ${primaryTime?`<span class="text-sm">${primaryTime}</span>`:''}
                    ${badge}
                </div>
            </div>`;
        });
        stopsContainer.innerHTML=html;

        // 綁定「附近車站」按鈕：以該站為中心，展開內嵌的附近車站頁面
        stopsContainer.querySelectorAll('.btn-nearby-center').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const stopId=btn.dataset.stopId, seq=btn.dataset.stopSeq, name=btn.dataset.stopName;
                setNearbyCenter(stopId, seq, name);
            });
        });

        // 更新路線行駛進度條：以「已過期站」比例估算車輛所在位置
        updateProgress(stops);
    }

    // 依各站的即時到站時間估算路線行駛進度（0~100%）
    function updateProgress(stops){
        const bar=$('eta-progress-bar'), lbl=$('eta-progress-label');
        if(!bar||!stops||!stops.length){ if(bar)bar.style.width='0'; return; }
        let passed=0;
        stops.forEach(s=>{
            const iso=(s.etas&&s.etas[0]&&s.etas[0].eta)||'';
            if(iso && calcMins(iso)<0)passed++; // 該站班次已過期 → 車輛已駛過
        });
        const pct = Math.min(100, Math.round((passed/stops.length)*100));
        bar.style.width=pct+'%';
        const span=lbl && lbl.querySelector('span[data-lang="progress"]');
        if(span)span.textContent=(getText('progress')||'路線進度')+' '+pct+'%';
    }

    /* ==================== 附近路線抽屜 ==================== */
    // 快取全港 KMB 站點清單（一次拉取，供距離計算複用）。
    // 注意：失敗時不寫入快取（_allKmbStopsCache 保持 null），讓下次呼叫可重試，
    // 避免「一次網路抖動就永久回空陣列」的隱性故障。
    let _allKmbStopsCache = null;
    async function getAllKmbStops(){
        if(_allKmbStopsCache)return _allKmbStopsCache;      // 成功取得後才快取
        const j=await fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/stop');
        const list=Array.isArray(j)? j : Array.isArray(j&&j.data)? j.data : [];   // 容錯：API 可能回傳陣列或 {data:[...]}
        const cleaned=list.map(s=>({id:s.stop, lat:parseFloat(s.lat), lon:parseFloat(s.long), name_tc:s.name_tc, name_en:s.name_en, name_sc:s.name_sc})).filter(s=>s.lat&&s.lon);
        if(cleaned.length) _allKmbStopsCache=cleaned;        // 僅在成功且非空時快取
        return cleaned;
    }

    // Haversine 距離 (m) + 方位角 (degree, 0=北)
    function haversine(lat1,lon1,lat2,lon2){
        const R=6371000, toRad=d=>d*Math.PI/180;
        const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
        const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
        const dist=2*R*Math.asin(Math.sqrt(a));
        const x=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
        const y=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
        let brng=Math.atan2(x,y)*180/Math.PI; brng=(brng+360)%360;
        return {dist, brng};
    }
    function bearingLabel(brng){
        const dirs=currentLang==='en'
            ?['N','NE','E','SE','S','SW','W','NW']
            :['北','東北','東','東南','南','西南','西','西北'];
        return dirs[Math.round(brng/45)%8];
    }
    function companyOfStop(stopId){
        if(typeof stopId!=='string')return null;
        if(stopId.startsWith('gmb_'))return 'GMB';
        if(stopId.startsWith('MTR_'))return 'MTR';
        if(stopId.startsWith('LRT_'))return 'LRT';
        return null; // 巴士 stopId 為數字字串 -> 由 currentCompany 決定
    }

    // 取得「其他路線」在指定站的即時 ETA（本站所有路線）。
    // 巴士(KMB/CTB/LWB)：呼叫政府即時 API；小巴(GMB)：無統一即時 API，改為動態模擬 ETA，
    // 讓附近車站功能內的小巴路線也能顯示，並可被點擊進入「對應路線即時到站」。
    async function fetchAllRoutesETAAtStop(stopId, coOverride){
        const modeCo = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        const co = coOverride || modeCo;
        const hereCo = companyOfStop(stopId); // 覆寫：若為模擬站，視為當前公司
        const useCo = hereCo && hereCo!=='GMB' && hereCo!=='MTR' && hereCo!=='LRT' ? hereCo : co;
        if(hereCo==='MTR'||hereCo==='LRT')return []; // 港鐵/輕鐵無即時 API，回空
        if(hereCo==='GMB'||co==='GMB'){ // 小巴：動態模擬多班即時 ETA
            const routeList = guessGmbRoutesAtStop(stopId);
            const out=[];
            routeList.forEach(route=>{ generateGmbStopETA(route, stopId, 'GMB').forEach(e=>out.push({route, dest:e.dest, eta:e.eta})); });
            return out;
        }
        try{
            let list=[];
            if(useCo==='KMB'||useCo==='LWB'){
                const j=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${encodeURIComponent(stopId)}`))?.data;
                list=j||[];
            } else {
                // Citybus V2（含 V1 fallback），此處不分路線→取該站全部即時 ETA
                const ep=ctbEndpoint(`/eta/${useCo}/${encodeURIComponent(stopId)}`,`/eta/${useCo}/${encodeURIComponent(stopId)}`);
                const j=(await fetchJSON(ep.v2))?.data || (await fetchJSON(ep.v1))?.data;
                list=j||[];
            }
            const wantDir = currentDirection==='inbound' ? 'I' : 'O';
            return list
                .filter(i=>i&&i.eta&&i.route)
                .filter(i=>{ const nd=normDir(i.dir); return nd==null || nd===wantDir; })  // 未知方向→保留（容錯）
                .map(i=>({route:i.route, dest:(currentLang==='en'?i.dest_en:i.dest_tc)||i.dest||'', eta:i.eta, rmk:i.rmk}));
        }catch{ return []; }
    }

    // 為指定車站產生「路線清單」（路線編號 + 目的地），供附近車站卡片與定位中心站使用。
    // ★ 修復（定位場景）：改為「即時 API 優先」。定位到的真實車站（如碧海藍天、海麗邨）
    //   實際會被多家公司（KMB/CTB/LWB）的路線共站，若只從 staticTimetables[currentCompany]
    //   取靜態清單，會遺漏共站公司路線，導致「定位後中心站顯示的路線不正確/不完整」。
    //   因此：優先回傳 _liveRoutesCache（由 renderNearbyPage 透過 fetchAllRoutesETAAtStop
    //   填入的該站即時真實路線），靜態表作為兜底，並自動補足同站跨公司路線。
    function candidateRoutes(cand){
        const co = cand.co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        const dest = currentLang==='en' ? 'Town Centre' : (currentLang==='zh-Hans'?'市区':'市區');
        const out=[];
        const seen=new Set();
        const push=r=>{ const k=String(r.route); if(!k||seen.has(k))return; seen.add(k); out.push({route:k, dest:(r.dest||dest)}); };

        // 1) ★ 即時 API 結果優先（定位站 / 附近站的「該站真實經過路線」）
        const sid=String((cand&&(cand.stopId||cand.id))||'');
        if(_liveRoutesCache[sid] && _liveRoutesCache[sid].length){
            _liveRoutesCache[sid].forEach(r=>push({route:r.route, dest:r.dest}));
        }

        // 2) 靜態時間表：涵蓋「當前公司 + 同站其他公司」（KMB/CTB/LWB 共站）
        const cosToCheck = (currentMode==='bus') ? ['KMB','CTB','LWB'].filter(c=>staticTimetables[c]) : [co];
        cosToCheck.forEach(c=>{
            const tt=staticTimetables[c]||{};
            Object.keys(tt).forEach(route=>{
                const d=(tt[route]&&tt[route].dest)||dest;
                const destStr=typeof d==='string'? d : (currentLang==='en'?(d.outbound||''):(currentLang==='zh-Hans'?stripLang(d.outbound)||d.outbound:d.outbound||''));
                push({route, dest:destStr});
            });
        });

        // 3) 當前查詢路線一定出現
        if(currentRoute) push({route:currentRoute, dest:(typeof destForDir==='function' && staticTimetables[co]&&staticTimetables[co][currentRoute])? destForDir(staticTimetables[co][currentRoute], currentDirection) : dest});

        // 4) 終極兜底
        if(!out.length){
            if(co==='GMB'){ guessGmbRoutesAtStop(cand.stopId).forEach(r=>push({route:r, dest:dest})); }
            else { const list=co==='CTB'?['720','A12','S1']:['1A','2','6','11','104']; list.forEach(r=>push({route:r, dest:dest})); }
        }
        return out.slice(0,8);  // ★ 由 6 擴到 8，避免共站路線被截斷
    }

    // ★ 修復：該站「即時真實路線」快取（stopId -> [{route,dest}]）。
    //   由 renderNearbyPage / renderNearbyStopCard 在取得 fetchAllRoutesETAAtStop 結果後填入，
    //   candidateRoutes 優先讀取，確保「定位站顯示的是 API 回傳的真實路線」而非純靜態猜測。
    //   有界（最多 60 站），避免長期累積佔用記憶體。
    const _liveRoutesCache={};
    function cacheLiveRoutes(stopId, etaList){
        const sid=String(stopId||''); if(!sid||!Array.isArray(etaList))return;
        const seen=new Set(); const arr=[];
        etaList.forEach(e=>{ if(!e)return; const k=String(e.route); if(!k||seen.has(k))return; seen.add(k); arr.push({route:k, dest:e.dest||''}); });
        _liveRoutesCache[sid]=arr;
        const keys=Object.keys(_liveRoutesCache);
        while(keys.length>60){ delete _liveRoutesCache[keys.shift()]; }
    }

    async function buildNearbyCandidates(centerLat, centerLon, radiusM){
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        const candidates=[];
        if(currentMode==='bus'){
            // 1) 全港 KMB 站（涵蓋廣，最真實）
            const allKmb=await getAllKmbStops();
            allKmb.forEach(s=>{
                const {dist,brng}=haversine(centerLat,centerLon,s.lat,s.lon);
                if(dist<=radiusM){
                    // ★ 修復：此處同步以即時 API 填入該候選站的即時路線快取，
                    //   讓下方 renderNearbyStopCard 顯示的是「該站真實路線」而非靜態猜測。
                    fetchAllRoutesETAAtStop(s.id, co).then(live=>cacheLiveRoutes(s.id, live)).catch(()=>{});
                    candidates.push({stopId:s.id, lat:s.lat, lon:s.lon, name:s, dist, brng, co, routes:candidateRoutes({stopId:s.id,co})});
                }
            });
            // 2) 當前 Citybus 路線的站（跨公司互補）
            if(co==='CTB' && activeRouteData){
                activeRouteData.stops.forEach(st=>{
                    const c=stopDataCache.get(`${co}_${st.stopId}`);
                    if(c&&c.lat&&c.long){ const {dist,brng}=haversine(centerLat,centerLon,parseFloat(c.lat),parseFloat(c.long)); if(dist<=radiusM&&dist>5)candidates.push({stopId:st.stopId,lat:+c.lat,lon:+c.long,name:c,dist,brng,co, routes:candidateRoutes({stopId:st.stopId,co})}); }
                });
            }
        } else {
            // 小巴 / 港鐵 / 輕鐵：無公開座標 API → 以「當前路線其他站 + 相鄰路線模擬站」生成鄰近候選
            const total=activeRouteData?.stops.length||0;
            activeRouteData?.stops.forEach(st=>{
                if(!st.stopId)return;
                const c=stopDataCache.get(`${co}_${st.stopId}`);
                if(c&&c.lat&&c.long){
                    const {dist,brng}=haversine(centerLat,centerLon,parseFloat(c.lat),parseFloat(c.long));
                    if(dist<=radiusM&&dist>5)candidates.push({stopId:st.stopId,lat:+c.lat,lon:+c.long,name:c,dist,brng,co, routes:candidateRoutes({stopId:st.stopId,co})});
                }
            });
            // 模擬鄰近站（離線/無座標時的兜底，散布於本站周圍）
            if(!candidates.length){
                const fakeNames = currentMode==='gmb'
                    ? ['小巴中途站','街市街市','邨口','港鐵站口']
                    : ['相鄰月台','轉車站','出口 A','公共運輸交匯處'];
                fakeNames.forEach((nm,idx)=>{
                    const ang=idx*57, r=radiusM*0.55;
                    const dLat=r/111320, dLon=r/(111320*Math.cos(centerLat*Math.PI/180));
                    const lat=centerLat+dLat*Math.cos(ang*Math.PI/180), lon=centerLon+dLon*Math.sin(ang*Math.PI/180);
                    const {dist,brng}=haversine(centerLat,centerLon,lat,lon);
                    candidates.push({stopId:`near_${idx}`,lat,lon,dist,brng,name:{name_tc:nm,name_en:nm},co,fake:true, routes:candidateRoutes({stopId:`near_${idx}`,co})});
                });
            }
        }
        // 去重（同 stopId 保留最近）
        const map=new Map();
        candidates.forEach(c=>{ const k=c.stopId; if(!map.has(k)||map.get(k).dist>c.dist)map.set(k,c); });
        return [...map.values()].sort((a,b)=>a.dist-b.dist);
    }

    // 把一組路線清單渲染成「線路區」行。每行右側有「即時到站 ▸」按鈕：
    //   · 巴士 / 小巴：點擊按鈕 → 切換到對應路線的「沿站即時到站」功能（主 ETA 面板）。
    //   · 港鐵 / 輕鐵：就地展開該路線在此站的即時到站明細（沿用 toggleRouteDetail）。
    // 每個按鈕攜帶 data-route / data-co / data-stop-id，供點擊委派辨識。
    function renderRouteETARows(routes, stopId, co){
        if(!routes || !routes.length)return `<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_here_empty')}</div>`;
        const isRail=(currentMode==='mtr'||currentMode==='lrt');
        // 依路線編號排序（數值序），同一路線多方向時逐行列出
        const arr=routes.slice().sort((a,b)=>String(a.route).localeCompare(String(b.route),undefined,{numeric:true}));
        const useCo = co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        return arr.map(r=>{
            const rowData = `data-route-row data-route="${escapeHtml(r.route)}" data-co="${escapeHtml(useCo)}" data-stop-id="${escapeHtml(String(stopId||''))}"`;
            const routeBadge = `<span class="font-black text-xs bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 px-1.5 py-0.5 rounded mr-1 select-none">${escapeHtml(r.route)}</span>`;
            // 港鐵/輕鐵：小按鈕（就地展開此站即時明細）；巴士/小巴：主按鈕（跳轉到該路線沿站即時到站）
            const liveBtn = `<button type="button" class="route-live-btn shrink-0 inline-flex items-center gap-1 text-[10px] font-bold text-white px-2 py-1 rounded-md transition shadow-sm ${isRail?'bg-emerald-500 hover:bg-emerald-600':'bg-blue-500 hover:bg-blue-600'}" data-route="${escapeHtml(r.route)}" data-co="${escapeHtml(useCo)}" data-stop-id="${escapeHtml(String(stopId||''))}" title="${escapeHtml(getText('open_live')||'即時到站')}">
                    <i class="fa-solid ${isRail?'fa-chevron-down':'fa-bolt'} text-[9px]"></i><span>${getText('open_live')||'即時到站'}</span>
                </button>`;
            // 內嵌即時到站預覽：點擊整行展開/收合（按鈕因 stopPropagation 不觸發行點擊）
            const previewArrow = `<i class="fa-solid fa-chevron-right text-[9px] text-slate-300 group-hover:text-blue-400 transition preview-arrow" data-arrow></i>`;
            return `<div class="route-row group p-2 rounded-lg bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 flex items-center justify-between gap-2 hover:border-blue-300 dark:hover:border-blue-500 transition cursor-pointer" ${rowData}>
                <div class="min-w-0 flex items-center gap-1.5">${previewArrow}<span class="font-black text-xs bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 px-1.5 py-0.5 rounded select-none">${escapeHtml(r.route)}</span><span class="text-[11px] text-slate-600 dark:text-slate-300 truncate">${escapeHtml(r.dest||'')}</span></div>
                <div class="flex items-center gap-1.5 shrink-0">${liveBtn}</div>
            </div>`;
        }).join('');
    }

    // 為「小巴 (GMB) 站點」產生模擬即時 ETA，讓附近車站功能內的小巴路線
    // 也能顯示並可被點擊，進入該路線的完整即時到站（沿站）視圖。
    // 由於小巴無統一即時 API，這裡依站點/路線產生確定性、動態遞進的 ETA。
    function generateGmbStopETA(route, stopId, co){
        const seed = String(route||'').length*7 + (String(stopId).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%13);
        const now=Date.now();
        const first=new Date(now + (seed%6+1)*60000 + 30000);
        const second=new Date(first.getTime() + (seed%4+2)*60000 + 120000);
        const dest = currentLang==='en' ? 'Town Centre' : '市區';
        return [{route:route||'1', dest, eta:first.toISOString()},{route:route||'1', dest, eta:second.toISOString()}];
    }

    // 推測某小巴站可能經過的路線清單：優先查 staticTimetables.GMB 的既有路線，
    // 再依 stopId 雜湊產生 1~2 個穩定的模擬路線編號，確保附近車站內的小巴路線
    // 一定能被列出、且可被點擊進入即時到站視圖。
    function guessGmbRoutesAtStop(stopId){
        const known = Object.keys((typeof staticTimetables!=='undefined' && staticTimetables.GMB)||{});
        if(known.length){
            // 若有已知路線，依 stopId 穩定選取其中 1~2 條
            const idx = String(stopId).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
            const pick=[];
            pick.push(known[idx % known.length]);
            if(known.length>1) pick.push(known[(idx+3) % known.length]);
            return [...new Set(pick)];
        }
        // 無已知路線時，用 stopId 產生穩定的模擬路線編號（如 1、2A）
        const seed = String(stopId).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
        const list=['1','2A','3','4A','5','6','10','12'];
        return [ list[seed % list.length] ];
    }

    // 單一站點卡：僅列出「經過此站的路線清單（路線編號 + 目的地）」，不再顯示即時分鐘。
    // cand.routes 為 [{route, dest}]；若無則依模式產生穩定的候補路線清單。
    async function renderNearbyStopCard(cand){
        const nameLang = cand.name && (currentLang==='zh-Hans'?cand.name.name_sc||cand.name.name_tc : currentLang==='en'?cand.name.name_en||cand.name.name_tc : cand.name.name_tc) || '—';
        const distTxt = cand.dist<100 ? `${Math.round(cand.dist)}m` : `${(cand.dist/1000).toFixed(1)}km`;
        const dirTxt = bearingLabel(cand.brng);
        const coBadge = cand.co ? `<span class="text-[8px] px-1 py-0.5 rounded bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-400 font-mono mr-1">${escapeHtml(cand.co)}</span>` : '';
        // 路線清單：優先使用候選站自帶的 routes；否則依模式兜底
        let routes = (cand.routes && cand.routes.length) ? cand.routes : nearbyFallbackRoutes(cand);
        return `<div class="rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="px-3 py-1.5 bg-slate-50 dark:bg-slate-700/50 flex items-center gap-2 text-[11px] border-l-4 border-blue-400">
                <i class="fa-solid fa-location-dot text-blue-500"></i>
                <span class="font-medium truncate">${coBadge}${escapeHtml(nameLang)}</span>
                <span class="ml-auto inline-flex items-center gap-1 text-slate-500 dark:text-slate-400 font-mono">
                    <i class="fa-solid fa-arrow-up" style="transform:rotate(${Math.round(cand.brng)}deg)"></i>${dirTxt}
                    <span class="font-bold text-blue-600 dark:text-blue-400">${distTxt}</span>
                </span>
            </div>
            <div class="p-2 space-y-1 route-rows" data-stop-id="${escapeHtml(String(cand.stopId))}">${renderRouteETARows(routes, cand.stopId)||`<div class="text-[11px] text-slate-400 px-1 py-1">${getText('nearby_here_empty')}</div>`}</div>
        </div>`;
    }

    // 候補路線清單：無真實資料時，依模式產生穩定的路線編號+目的地（不呼叫即時 API）
    function nearbyFallbackRoutes(cand){
        const co = cand.co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        const dest = currentLang==='en' ? 'Town Centre' : (currentLang==='zh-Hans'?'市区':'市區');
        if(co==='GMB'){
            return guessGmbRoutesAtStop(cand.stopId).map(r=>({route:r, dest}));
        }
        // 巴士：以候選站 stopId 雜湊出 1~2 條穩定路線（僅展示用）
        const seed = String(cand.stopId).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
        const list = currentCompany==='CTB' ? ['720','A12','S1'] : ['1A','2','6','11','104'];
        const out=[{route:list[seed%list.length], dest}];
        if(list.length>1) out.push({route:list[(seed+2)%list.length], dest});
        return out;
    }

    // 取得「指定路線」在「指定站」的即時 ETA（點擊路線編號時使用）
    async function fetchRouteETAAtStop(route, stopId, co){
        if(!stopId || !route)return [];
        if(co==='GMB'||co==='MTR'||co==='LRT')return []; // 非即時 API
        const useCo = co==='LWB'? 'KMB' : co;
        try{
            let list=[];
            if(useCo==='KMB'){
                const j=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}/1`))?.data;
                list=j||[];
            } else {
                // Citybus V2 / V1 fallback
                const ep=ctbEndpoint(`/eta/${useCo}/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}`,`/eta/${useCo}/${encodeURIComponent(stopId)}/${encodeURIComponent(route)}`);
                const j=(await fetchJSON(ep.v2))?.data || (await fetchJSON(ep.v1))?.data;
                list=j||[];
            }
            const wantDir = currentDirection==='inbound' ? 'I' : 'O';
            return list
                .filter(i=>i&&i.eta&&String(i.route).toUpperCase()===String(route).toUpperCase())
                .filter(i=>{ const nd=normDir(i.dir); return nd==null || nd===wantDir; })
                .map(i=>({route:i.route, dest:(currentLang==='en'?i.dest_en:i.dest_tc)||i.dest||'', eta:i.eta, rmk:i.rmk}));
        }catch{ return []; }
    }

    // 渲染單路線在單站的即時到站明細（含時間燈號 / 狀態文字，語境視為中途站）
    function renderRouteDetailETAs(etasRaw, dest){
        const minUnit=getText('min');
        const items=etasRaw
            .map(i=>({eta:i.eta, mins:calcMins(i.eta)}))
            .filter(e=>e.mins>=-2)                     // 含剛離站的 1~2 班，讓燈號可完整呈現
            .sort((a,b)=>a.mins-b.mins)
            .slice(0,5);
        if(!items.length)return `<div class="text-[11px] text-slate-400 px-1 py-2">${getText('route_detail_no_eta')||'暫無即時到站資料'}</div>`;
        return items.map((e,idx)=>{
            const isFirst=idx===0;
            // 燈號邏輯：≤1 分到站閃爍紅燈（即將到站），>1 分藍燈
            let lightClass='bg-blue-500', blink='', status='';
            if(isFirst){
                if(e.mins<=1 && e.mins>=0){ lightClass='bg-red-500 pulse-glow'; blink='blink-warning'; status=`<span class="text-red-600 dark:text-red-400 font-bold">${getText('mid_arr')||'本班車即將到站'}</span>`; }
                else if(e.mins<0){ lightClass='bg-amber-500'; status=`<span class="text-amber-600 dark:text-amber-400">${getText('mid_departed')||'本班車已離站'}</span>`; }
                else { status=`<span class="text-slate-500 dark:text-slate-400">${getText('arriving_in')||'即將到站'} ${e.mins} ${minUnit}</span>`; }
            }
            const timeCls = e.mins<=1&&e.mins>=0 ? 'text-red-600 dark:text-red-400' : (e.mins<0?'text-amber-600 dark:text-amber-400':'text-slate-800 dark:text-slate-100');
            return `<div class="flex items-center gap-2 px-2 py-1.5 rounded-md ${isFirst?'bg-blue-50 dark:bg-blue-900/20':'hover:bg-slate-100 dark:hover:bg-slate-700/40'}">
                <span class="w-2.5 h-2.5 rounded-full ${lightClass} ${blink}"></span>
                <span class="text-xs font-mono ${timeCls} font-bold w-16">${fmtHM(e.eta)}</span>
                <span class="text-xs ${e.mins>=0?`text-slate-700 dark:text-slate-200`:`text-amber-600 dark:text-amber-400 line-through`} w-14">${e.mins>=0?e.mins+minUnit:'-'+Math.abs(e.mins)+minUnit}</span>
                ${isFirst?`<span class="ml-auto text-[11px]">${status}</span>`:`<span class="ml-auto text-[10px] text-slate-400">${idx===1?getText('next_bus')||'下一班':(idx===2?getText('next_next')||'再下一班':'')}</span>`}
            </div>`;
        }).join('');
    }

    // 切換（展開 / 收合）指定路線在指定站的即時到站明細面板
    async function toggleRouteDetail(btnEl){
        const rowEl=btnEl.closest('[data-route-row]');
        const rowsWrap=btnEl.closest('.route-rows');
        if(!rowEl||!rowsWrap)return;
        const route=btnEl.getAttribute('data-route');
        const stopId=btnEl.getAttribute('data-stop-id')||rowsWrap.getAttribute('data-stop-id');
        const co=btnEl.getAttribute('data-co')||rowsWrap.getAttribute('data-co')||'';

        // 若已展開則收合（切換行為）
        const exist=rowEl.querySelector('.route-detail-panel');
        if(exist){ exist.remove(); btnEl.classList.remove('ring-2','ring-blue-400'); return; }

        // 收合其他已展開的面板（同一站只保留一個展開）
        rowsWrap.querySelectorAll('.route-detail-panel').forEach(p=>p.remove());
        rowsWrap.querySelectorAll('.route-detail-btn').forEach(b=>b.classList.remove('ring-2','ring-blue-400'));

        const panel=document.createElement('div');
        panel.className='route-detail-panel mt-1.5 mx-0.5 p-2 rounded-lg bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-700 shadow-sm space-y-1';
        panel.innerHTML=`<div class="text-center py-2 text-slate-400 text-[11px]"><i class="fa-solid fa-spinner animate-spin text-blue-500 mr-1"></i> ${getText('loading_stop_eta')}</div>`;
        rowEl.appendChild(panel);
        btnEl.classList.add('ring-2','ring-blue-400');

        const etas=await fetchRouteETAAtStop(route, stopId, co);
        const dest = etas[0]&&etas[0].dest ? ` → ${escapeHtml(etas[0].dest)}` : '';
        panel.innerHTML=`
            <div class="flex items-center gap-1 px-1 pb-1 border-b border-slate-100 dark:border-slate-700">
                <span class="font-black text-xs bg-blue-600 text-white px-1.5 py-0.5 rounded">${escapeHtml(route)}</span>
                <span class="text-[11px] text-slate-600 dark:text-slate-300 truncate">${escapeHtml(dest.replace(/^ → /,''))}</span>
                <button type="button" class="route-detail-close ml-auto text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-chevron-up"></i> ${getText('collapse')||'收合'}</button>
            </div>
            <div class="route-detail-list pt-1">${renderRouteDetailETAs(etas)}</div>`;
        panel.querySelector('.route-detail-close').addEventListener('click', ()=>{ panel.remove(); btnEl.classList.remove('ring-2','ring-blue-400'); });
    }

    /* ==================== 附近車站 · 內嵌「沿站即時到站」面板 ====================
       在巴士/小巴的「附近車站」功能內按下線路區按鈕時，以內嵌面板（而非跳轉主畫面）
       顯示「對應路線的實時到站功能」：完整沿站列表 + 起點/中途/終點時間燈號，
       並支援秒級倒數與 20 秒背景 API 同步。同時僅展開一個面板。 */

    // 面板狀態（閉包層級，供秒級倒數計時器複用）
    let _inlineLivePanel = null;
    let _inlineTimer = null;
    let _inlineState = null; // {route, co, stopId, dir}

    // 快取：路線站序（fetchBusRouteStops 結果），避免每次開面板都重打 API
    const _routeStopsCache = new Map();
    async function fetchRouteStopsCached(route, co){
        const key=`${co}_${route}`;
        if(_routeStopsCache.has(key))return _routeStopsCache.get(key);
        const fresh = await fetchBusRouteStops(route, co);
        if(fresh && (fresh.outbound&&fresh.outbound.length || fresh.inbound&&fresh.inbound.length)){
            _routeStopsCache.set(key, fresh);
            // 有界快取（上限 200 條路線）
            if(_routeStopsCache.size>200){ const o=_routeStopsCache.keys().next().value; if(o!=null)_routeStopsCache.delete(o); }
            return fresh;
        }
        return fresh||{outbound:[],inbound:[]};
    }

    // 依 route/co 取得靜態站序（小巴與無即時 API 時兜底；保留擴充）
    function staticStopsForRoute(route, co){
        const coKey = (co==='CTB'?'CTB':co==='LWB'?'LWB':'KMB');
        const tt = staticTimetables[coKey] && staticTimetables[coKey][route];
        if(tt && tt.stops) return { stops:tt.stops, dest:destForDir(tt,'outbound') };
        const gtt = staticTimetables.GMB && staticTimetables.GMB[route];
        if(gtt) return { stops:Array.from({length:10},(_,i)=>`中途站 ${i+1}`), dest:'市區', gmb:true };
        return null;
    }

    // 為「內嵌面板」建構沿站 stops（含 etas），複用主程式的時間燈號語義。
    // ★ 關鍵：優先透過真實 API（fetchRouteStopsCached + fetchBusStopName）取得「路線站序 + 各站站名」，
    //   讓面板顯示真實巴士/小巴站名與正確的站名數量；只有 API 完全失敗（小巴/離線）才 fallback 佔位名。
    async function buildInlineRouteStops(route, co, dir){
        const isGmb = (co==='GMB');
        const coKey = isGmb? 'GMB' : (co==='CTB'?'CTB':co==='LWB'?'LWB':'KMB');

        // 1) 嘗試從真實 API 取得「該路線在該方向的完整站序」（[{stop,seq}, ...]）
        let apiSeq=[];
        if(!isGmb){
            try{
                const rs = await fetchRouteStopsCached(route, coKey);
                const want = (dir==='inbound')? 'inbound' : 'outbound';
                apiSeq = (rs[want]&&rs[want].length)? rs[want] : (rs.outbound&&rs.outbound.length? rs.outbound : rs.inbound||[]);
            }catch(e){ apiSeq=[]; }
        }

        // 2) 由站序 + 全港站表/stopDataCache 解析站名；缺名時留 null 待後續 fallback
        let nameSeq=[];
        if(apiSeq.length){
            // ★ 站名解析輔助：優先取當前語言欄位，空字串視為缺失（?? 而非 ||），
            //   確保 API 回傳 name_tc:"" 時不會顯示空白、也不會被錯誤 fallback 成假名。
            const pickName=(c)=>{
                if(!c)return null;
                const tc=String(c.name_tc||'').trim(), en=String(c.name_en||'').trim(), sc=String(c.name_sc||'').trim();
                const name_tc = tc || en || sc || en;
                const name_en = en || tc || sc;
                if(!name_tc && !name_en)return null;
                return { name_tc, name_en, _sid:null };
            };
            nameSeq = apiSeq.slice().sort((a,b)=>(+a.seq)-(+b.seq)).map(x=>{
                const sid=x.stop;
                const c = stopDataCache.get(`${coKey}_${sid}`) || stopDataCache.get(sid);
                const n = pickName(c); if(n){ n._sid=sid; return n; }
                return null; // 名稱暫缺，稍後補抓或 fallback
            });
            // 若大部分站名缺失（快取尚未預熱），嘗試補抓前幾站站名
            const missing = nameSeq.filter(n=>!n).length;
            if(missing>nameSeq.length/2){
                await Promise.all(apiSeq.slice(0,8).map(async x=>{
                    try{ await fetchBusStopName(x.stop, coKey); }catch(e){}
                }));
                nameSeq = apiSeq.slice().sort((a,b)=>(+a.seq)-(+b.seq)).map(x=>{
                    const sid=x.stop;
                    const c = stopDataCache.get(`${coKey}_${sid}`) || stopDataCache.get(sid);
                    const n = pickName(c); if(n){ n._sid=sid; return n; }
                    // 補抓仍失敗 → 明確標 _fallback，讓站名數量條不把它計入「已解析」
                    return { name_tc:`${coKey} 站 ${x.seq}`, name_en:`${coKey} Stop ${x.seq}`, _sid:sid, _fallback:true };
                });
            }
        }

        // 3) 無 API 資料（小巴 / 離線 / 未知路線）→ 靜態時間表，再 fallback 佔位名
        if(!nameSeq.length){
            const stt = staticTimetables[coKey] && staticTimetables[coKey][route];
            const total = isGmb? 10 : 12;
            if(stt && stt.stops){ nameSeq = (dir==='inbound'? stt.stops.slice().reverse(): stt.stops.slice()); }
            else { for(let i=1;i<=total;i++)nameSeq.push({name_tc:`中途站 ${i}`, name_en:`Stop ${i}`, _fallback:true}); }
        }

        // 4) 預熱全港站表（供 stopNameFromCache 等），不阻塞
        if(!isGmb && !_allKmbStopsCache){ getAllKmbStops().catch(()=>{}); }

        const results = await mapWithConcurrency(nameSeq, 6, async(item, idx)=>{
            const seq=idx+1;
            // item：{name_tc,name_en,_sid,_fallback} 或 null
            const realSid = (item && item._sid) || null;
            let etas=[];
            // ★ 前 4 站嘗試抓真實即時 ETA（若有真實 stopId），其餘 / 失敗 → 動態推算
            const ctxStopId = (_inlineState && !String(_inlineState.stopId||'').startsWith('inline_') && !String(_inlineState.stopId||'').startsWith('near_'))
                ? _inlineState.stopId : null;
            const useSid = realSid || ctxStopId;
            if(!isGmb && idx<4 && useSid){
                try{ etas = await fetchBusStopETAForInline(route, coKey, idx, useSid); }catch(e){ etas=[]; }
            }
            if(!etas.length){
                // 動態推算：首班隨機偏移，逐站累加行車時間（與主程式 generateGmbETA 同源思路）
                const gap = (isGmb?10:6)*60000;
                const baseSeed = String(route||'').length*7 + (String(co)||'').length*3 + idx*2;
                const now=Date.now();
                const t0=new Date(now + (baseSeed%5+2)*60000 + idx*gap);
                const t1=new Date(t0.getTime() + (isGmb?12:8)*60000);
                etas=[{eta:t0.toISOString()},{eta:t1.toISOString()}];
            }
            // 統一站名物件（字串相容 + null 兜底；空字串視為缺失，與 buildInlineRouteStops 一致）
            let nm;
            if(typeof item==='string'){ const t=String(item).trim(); nm={name_tc:t,name_en:t}; }
            else if(item && (item.name_tc||item.name_en)){ nm={name_tc:String(item.name_tc||'').trim()||String(item.name_en||'').trim(), name_en:String(item.name_en||'').trim()||String(item.name_tc||'').trim()}; }
            else nm={name_tc:`站 ${seq}`,name_en:`Stop ${seq}`, _fallback:true};
            // 空字串 → 標為佔位，讓站名數量條不計入「已解析」
            if(!nm.name_tc && !nm.name_en){ nm={name_tc:`站 ${seq}`,name_en:`Stop ${seq}`, _fallback:true}; }
            else { nm._fallback = !!item?._fallback; }
            return { seq, name:nm, etas, stopId: realSid? String(realSid):`inline_${route}_${seq}` };
        });
        return results;
    }

    // 內嵌場景的巴士 ETA：若 activeRouteData 恰為同路線，直接複用真實資料；
    // 否則嘗試呼叫真實即時 API（KMB stop-eta / Citybus），讓面板顯示真實到站，而不只是推算。
    // 注意：stopId 在內嵌場景是虛擬的（inline_route_seq），故僅對「有座標的真實站」才抓 API。
    async function fetchBusStopETAForInline(route, co, stopIndex, realStopId){
        if(activeRouteData && String(activeRouteData.route).toUpperCase()===String(route).toUpperCase()
           && activeRouteData.stops[stopIndex]){
            const st=activeRouteData.stops[stopIndex];
            if(st.etas && st.etas.length) return st.etas.slice(0,2);
        }
        // 嘗試真實 API：限 KMB/CTB/LWB，且需有真實 stopId
        const useCo = (co==='CTB'?'CTB':co==='LWB'?'KMB':'KMB');
        const sid = realStopId || _inlineState?.stopId;
        if(sid && !String(sid).startsWith('inline_') && !String(sid).startsWith('near_')){
            try{
                let list=[];
                if(useCo==='KMB'){
                    const j=(await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${encodeURIComponent(sid)}/${encodeURIComponent(route)}/1`))?.data;
                    list=j||[];
                } else {
                    const ep=ctbEndpoint(`/eta/${useCo}/${encodeURIComponent(sid)}/${encodeURIComponent(route)}`,`/eta/${useCo}/${encodeURIComponent(sid)}/${encodeURIComponent(route)}`);
                    const j=(await fetchJSON(ep.v2))?.data || (await fetchJSON(ep.v1))?.data;
                    list=j||[];
                }
                const wantDir = currentDirection==='inbound' ? 'I' : 'O';
                const filtered = (list||[])
                    .filter(i=>i&&i.eta && String(i.route).toUpperCase()===String(route).toUpperCase())
                    .filter(i=>{ const nd=normDir(i.dir); return nd==null || nd===wantDir; })
                    .slice(0,2);
                if(filtered.length) return filtered.map(i=>({eta:i.eta}));
            }catch(e){ /* 失敗則回退推算 */ }
        }
        return [];
    }

    // 渲染單一站列的「時間燈號」單元格（內嵌面板專用，語義與主 timeLightHTML 一致）
    function inlineTimeCell(stop, idx, total){
        const etas = (stop.etas||[]).filter(e=>e&&e.eta)
            .map(e=>({eta:e.eta, mins:calcMins(e.eta)})).filter(e=>e.mins>=0)
            .sort((a,b)=>a.mins-b.mins);
        const m1 = etas[0]? etas[0].mins : -1;
        const m2 = etas[1]? etas[1].mins : -1;
        const minUnit=getText('min');
        let lightClass='bg-blue-500', label='', sub='', blink=false;
        const isStart=idx===0, isEnd=idx===total-1;
        if(isStart){
            if(m1>=0 && m1<=5){ blink=true;
                if(m1<=1){ lightClass='bg-red-500 pulse-glow'; label=getText('bus_departing'); sub=`${getText('next_bus')}: ${m2>=0?m2+' '+minUnit:'-'}`; }
