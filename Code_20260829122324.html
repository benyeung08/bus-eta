                else { lightClass='bg-amber-500 blink-warning'; label=`<i class="fa-solid fa-person-running"></i> ${getText('departs_in')} (${m1} ${minUnit})`; sub=getText('boarding_now'); }
            }
        } else if(isEnd){
            if(m1<=1 && m1>=0){ blink=true; lightClass='bg-red-500 pulse-glow'; label=`<i class="fa-solid fa-flag-checkered"></i> ${getText('arrive_terminal')}`; sub=`<span class="text-red-600 dark:text-red-400 font-bold">${getText('all_remaining')}</span>`; }
            else if(m1<=3){ blink=true; lightClass='bg-amber-500 blink-warning'; label=getText('arr_terminal_shortly'); }
        } else {
            if(m1<=1 && m1>=0){ blink=true; lightClass='bg-red-500 pulse-glow'; label=getText('mid_arr'); sub=`${getText('next_bus')}: ${m2>=0?m2+' '+minUnit:'-'}`; }
            else if(m1>1 && m1<=4){ blink=true; lightClass='bg-amber-500 blink-warning'; label=`${getText('arr_shortly')} (${m1} ${minUnit})`; }
        }
        let primary='';
        if(m1>=0){
            // ★ 精確秒數：≤1 分時追加秒級倒數（.sec-count），由 startInlineLiveTimer 每秒更新
            const secLeft = etas[0]&&etas[0].eta ? Math.max(0,Math.round((new Date(etas[0].eta).getTime()-Date.now())/1000)) : 0;
            const secHint = m1<=1 ? ` <span class="sec-count text-[9px] text-red-500 font-mono">${secLeft}s</span>` : '';
            primary=`<span class="eta-val font-black ${m1<=1?'text-red-600 dark:text-red-400':(m1<=5?'text-amber-600 dark:text-amber-400':'text-slate-800 dark:text-slate-100')}">${m1}</span><span class="text-[10px] ${m1<=1?'text-red-500':'text-slate-400'}">${minUnit}</span>${secHint} <span class="text-[9px] text-slate-400 font-mono" title="${escapeHtml(secLeft+' 秒')}">(${fmtHM(etas[0]&&etas[0].eta)})</span>`;
        } else {
            primary=`<span class="text-[10px] text-slate-400">--:--</span>`;
        }
        const role = isStart? `<span class="text-white text-[8px] px-1 py-0.5 rounded-full font-bold mr-1" style="background:#8b5cf6;">${getText('terminal')}</span>`
                   : isEnd? `<span class="bg-orange-500 text-white text-[8px] px-1 py-0.5 rounded-full font-bold mr-1">${getText('end_terminal')}</span>` : '';
        const light = `<span class="w-2.5 h-2.5 rounded-full inline-block ${lightClass} ${blink?'blink-warning':''}"></span>`;
        const badge = label? `<div class="flex flex-col items-end gap-0"><span class="text-[9px] font-bold text-red-600 dark:text-red-400 leading-tight">${label}</span><span class="text-[9px] text-slate-400">${sub}</span></div>` : `<span class="text-[9px] text-slate-400">${m1>5?m1+' '+minUnit:'—'}</span>`;
        const nameLang = stop.name && (currentLang==='zh-Hans'?stop.name.name_sc||stop.name.name_tc:currentLang==='en'?stop.name.name_en||stop.name.name_tc:stop.name.name_tc) || '—';
        return `<div class="flex items-center gap-2 px-2 py-1.5 rounded-md ${isStart||isEnd?'bg-slate-50 dark:bg-slate-700/40':'hover:bg-slate-100 dark:hover:bg-slate-700/30'}" data-eta-row data-idx="${idx}">
            <span class="text-[10px] font-mono text-slate-400 w-5 text-right">${idx+1}</span>
            ${light}
            <span class="flex-grow truncate text-[11px] ${isStart||isEnd?'font-bold text-slate-800 dark:text-slate-100':'text-slate-600 dark:text-slate-300'}">${role}${escapeHtml(nameLang)}</span>
            <span class="shrink-0 tabular-nums">${primary}</span>
            <span class="shrink-0 w-20 text-right">${badge}</span>
        </div>`;
    }

    // 取得/建立內嵌面板 DOM。
    // mountId：指定掛載容器 id；預設掛在 modal-inline-live-wrap（modal 內），
    // 供「巴士/小巴按下線路區按鈕 → 就地顯示對應線路實時到站」時掛到主界面 (inline-live-mount)。
    // 切換掛載點時會把面板從舊容器移到新容器，避免重複建立、保留倒數狀態。
    function ensureInlineLivePanel(mountId){
        const wrap=$(mountId)||$('modal-inline-live-wrap'); if(!wrap)return null;
        wrap.classList.remove('hidden');
        let panel=$('inline-route-live-panel');
        if(panel && panel.parentElement!==wrap) wrap.appendChild(panel); // 跨容器移動
        if(panel)return panel;
        panel=document.createElement('div');
        panel.id='inline-route-live-panel';
        panel.className='rounded-2xl overflow-hidden border-2 border-blue-400 dark:border-blue-600 shadow-lg';
        wrap.appendChild(panel);
        _inlineLivePanel=panel;
        return panel;
    }

    // 渲染內嵌面板（首次載入 + 每次定時重繪）
    async function renderInlineRouteLive(route, co, stopId, dir){
        const mountId = _inlineMount==='main' ? 'inline-live-mount' : 'modal-inline-live-wrap';
        const panel=ensureInlineLivePanel(mountId); if(!panel)return;
        const coName=({KMB:'九巴',CTB:'城巴',LWB:'龍運',GMB:'小巴'})[co]||co||'';
        const dirLabel = dir==='inbound'? getText('inbound'):getText('outbound');
        // ★ 方向切換：往/返 按鈕組（巴士/小巴也支援雙方向沿站即時到站）
        const otherDir = dir==='inbound'?'outbound':'inbound';
        const dirBtns = `<div class="inline-flex bg-white/15 rounded-md p-0.5 text-[10px] font-bold" role="group" aria-label="方向">
            <button type="button" data-dir-swap="${dir}" class="px-2 py-0.5 rounded ${dir===currentDirection?'bg-white text-blue-700':'text-white/80 hover:text-white'}">${dir==='inbound'?getText('inbound'):getText('outbound')}</button>
            <button type="button" data-dir-swap="${otherDir}" class="px-2 py-0.5 rounded ${dir!==currentDirection?'bg-white text-blue-700':'text-white/80 hover:text-white'}">${dir==='inbound'?getText('outbound'):getText('inbound')}</button>
        </div>`;
        // ★ 面板內「切換路線」下拉：在即時到站面板內直接切換到其他路線，無需回到列表
        const swapSelect = `<select id="inline-swap-route" class="bg-white/15 text-white text-[10px] rounded px-1 py-0.5 outline-none hover:bg-white/25 cursor-pointer" title="切換路線">
            <option value="" disabled selected>${escapeHtml(route)} ↺</option>
        </select>`;
        panel.innerHTML=`
            <div class="px-3 py-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white flex items-center flex-wrap gap-2">
                <span class="font-black text-sm bg-white/20 px-2 py-0.5 rounded">${escapeHtml(route)}</span>
                <span class="text-[11px] opacity-90">${escapeHtml(coName)}</span>
                ${dirBtns}
                <span class="ml-auto flex items-center gap-1.5">
                    <span class="text-[9px] opacity-80"><i class="fa-solid fa-bolt"></i> ${getText('live_panel_sub')}</span>
                    ${swapSelect}
                    <button type="button" id="inline-live-close" class="text-white/80 hover:text-white text-[11px] ml-0.5" aria-label="${escapeHtml(getText('close_panel'))}"><i class="fa-solid fa-xmark"></i></button>
                </span>
            </div>
            <div class="p-2 bg-blue-50/60 dark:bg-slate-800/80 space-y-1" id="inline-live-list">
                <div class="text-center py-3 text-slate-400 text-[11px]"><i class="fa-solid fa-spinner animate-spin text-blue-500 mr-1"></i> ${getText('loading_route_eta').replace('{r}',route)}</div>
            </div>`;
        panel.querySelector('#inline-live-close').addEventListener('click',()=>closeInlineLivePanel());
        // 方向切換：更新 currentDirection 並重算沿站即時到站
        panel.querySelectorAll('[data-dir-swap]').forEach(b=>b.addEventListener('click',()=>{
            const newDir=b.getAttribute('data-dir-swap');
            currentDirection=newDir;
            refreshDirectionLabels();
            renderInlineRouteLive(_inlineState.route,_inlineState.co,_inlineState.stopId,newDir);
        }));
        // 切換路線下拉：聚焦時動態填入候選路線（本站其他路線），選取後重新載入面板
        const swapSel=panel.querySelector('#inline-swap-route');
        if(swapSel){
            swapSel.addEventListener('focus',()=>populateSwapRoutes(swapSel, route, co, stopId));
            swapSel.addEventListener('change',()=>{
                const v=swapSel.value; if(!v)return;
                const opt=swapSel.selectedOptions[0];
                const newCo=opt.getAttribute('data-co')||co;
                currentRoute=v; routeInput.value=v; currentCompany=newCo;
                renderInlineRouteLive(v, newCo, stopId, currentDirection);
                showRouteSwitchedToast(v, newCo);
            });
        }
        _inlineState={route,co,stopId,dir};

        const stops = await buildInlineRouteStops(route, co, dir);
        const listEl=panel.querySelector('#inline-live-list');
        if(!stops.length){
            listEl.innerHTML=`<div class="text-[11px] text-slate-400 px-2 py-2">${getText('no_route_data')}</div>`;
            return;
        }
        const total=stops.length;
        // ★ 顯示「路線站名數量」：巴士/小巴總站數 + 已解析真實站名數（語言自適應）
        // ★ 站名數量：以 _fallback 標記為準，並以「語言化站名是否為佔位」雙重校驗。
            // 佔位型態：'中途站 N' / '起點站' / '終點站' / '{CO} 站 N' / '站 N' / 'Stop N' / '小巴中途站' 等。
            // 正確辨識「所有方向」的站名（含小巴 gmbStopName 產生的 起點/終點/中途），
            // 避免把佔位名誤計為「已解析」，導致數量條虛高。
            const PLACEHOLDER = /^(中途站\s*\d+|起點站|終點站|小巴中途站|街市街市|邨口|港鐵站口|相鄰月台|轉車站|出口\s*A|公共運輸交匯處|站\s*\d+|Stop\s*\d+|\S+\s*站\s*\d+)$/;
            const isPlaceholder=(item)=>{
                if(!item)return true;
                if(item._fallback)return true;          // 明確標記的 fallback 名
                const tc=String(item.name_tc||'').trim(), en=String(item.name_en||'').trim();
                return PLACEHOLDER.test(tc) || PLACEHOLDER.test(en);
            };
            const namedCount = stops.filter(s=>s&&s.name&&!isPlaceholder(s.name)).length;
        const liveCount  = stops.filter(s=>s&&(s.etas&&s.etas.length)).length;
        const cntLabel = (currentLang==='zh-Hans')
            ? `共 ${total} 站 · 已解析 ${namedCount} 個站名${liveCount?` · ${liveCount} 站即時`:''}`
            : (currentLang==='en')
                ? `Total ${total} stops · ${namedCount} named${liveCount?` · ${liveCount} live`:''}`
                : `共 ${total} 個站 · 已解析 ${namedCount} 個站名${liveCount?` · ${liveCount} 站即時`:''}`;
        const countBar = `<div class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 text-[10px] text-slate-500 dark:text-slate-300 flex items-center gap-2 border-b border-slate-200 dark:border-slate-600">
            <i class="fa-solid fa-list-ol"></i> <span>${cntLabel}</span>
            <span class="ml-auto text-emerald-600 dark:text-emerald-400 font-mono">${route} · ${dir==='inbound'?getText('inbound'):getText('outbound')}</span>
        </div>`;
        listEl.insertAdjacentHTML('beforebegin', countBar);
        // 存回 data-eta-time，供秒級倒數就地更新
        const rows=stops.map((s,idx)=>{
            const cell=inlineTimeCell(s,idx,total);
            const iso=(s.etas&&s.etas[0]&&s.etas[0].eta)||'';
            return `<div data-eta-time="${escapeHtml(iso)}">${cell}</div>`;
        }).join('');
        listEl.innerHTML=rows;
        startInlineLiveTimer();
    }

    // 動態填入「切換路線」下拉：收集候選路線（本站其他路線 + 同公司靜態路線），去重
    function populateSwapRoutes(sel, currentRoute, co, stopId){
        if(sel.dataset.filled==='1')return;
        const candidates=new Set();
        // 1) 本站即時 ETA 中出現的其他路線
        const hereCo=co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        try{
            const hereRoutes=candidateRoutes({stopId, co:hereCo});
            hereRoutes.forEach(r=>candidates.add(String(r.route)));
        }catch(e){}
        // 2) 同公司靜態時間表路線
        const tt=staticTimetables && (staticTimetables[hereCo]||staticTimetables[co]);
        if(tt)Object.keys(tt).forEach(r=>candidates.add(String(r)));
        const list=[...candidates].sort((a,b)=>a.localeCompare(b,{numeric:true}));
        sel.innerHTML=`<option value="" disabled selected>${escapeHtml(currentRoute)} ↺</option>`+
            list.filter(r=>r!==String(currentRoute)).map(r=>`<option value="${escapeHtml(r)}" data-co="${escapeHtml(hereCo)}">${escapeHtml(r)}</option>`).join('');
        sel.dataset.filled='1';
    }

    // 秒級倒數：就地更新 eta-val 與 sec-count，過期則整列重繪
    let _inlineTimerVersion = 0;
    function startInlineLiveTimer(){
        stopInlineLiveTimer();
        _inlineTimerVersion++;
        const myVersion = _inlineTimerVersion;
        _inlineTimer=setInterval(()=>{
            if(myVersion!==_inlineTimerVersion)return;      // 版本過期（已重繪/關閉）→ 不執行
            if(!_inlineState)return;
            const panel=$('inline-route-live-panel'); if(!panel)return;
            let needs=false;
            panel.querySelectorAll('[data-eta-row]').forEach(row=>{
                const wrap=row.closest('[data-eta-time]');
                const iso=wrap? wrap.getAttribute('data-eta-time'):'';
                if(!iso)return;
                const m=calcMins(iso);
                if(m<0){ needs=true; return; }
                const valEl=row.querySelector('.eta-val');
                if(valEl && valEl.textContent!==String(m))valEl.textContent=m;
                // ★ 精確秒數：≤1 分時即時更新 .sec-count
                const secEl=row.querySelector('.sec-count');
                if(secEl){
                    const sec=Math.max(0,Math.round((new Date(iso).getTime()-Date.now())/1000));
                    secEl.textContent=sec+'s';
                }
            });
            if(needs && _inlineState){ renderInlineRouteLive(_inlineState.route,_inlineState.co,_inlineState.stopId,_inlineState.dir); }
        },1000);
    }
    function stopInlineLiveTimer(){ _inlineTimerVersion++; if(_inlineTimer){ clearInterval(_inlineTimer); _inlineTimer=null; } }

    function closeInlineLivePanel(){
        stopInlineLiveTimer();
        const panel=$('inline-route-live-panel'); if(panel)panel.remove();
        // 主界面就地模式：恢復附近車站列表顯示
        if(_inlineMount==='main')restoreNearbyList();
        const wrap=$('modal-inline-live-wrap'); if(wrap)wrap.classList.add('hidden');
        _inlineLivePanel=null; _inlineState=null;
    }

    // 巴士 / 小巴：把整個主畫面切換到「對應路線的沿站即時到站」。
    // 由附近車站功能內「線路區按鈕」呼叫——按下即顯示該線路的實時到站。
    //   · 更新 routeInput / currentRoute / currentCompany
    //   · 切到 ETA 頁簽、關閉 modal 與內嵌面板
    //   · 呼叫 loadBusData() 重新載入真實沿站即時到站（含時間燈號）
    //   · 顯示「已切換到路線 X 即時到站」提示
    async function switchRouteToLive(route, co){
        if(!route)return;
        const targetCo = co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        // 若切到的公司與目前不同（如 CTB 線路），同步切換公司下拉
        if(currentMode==='bus' && targetCo && targetCo!==currentCompany){
            currentCompany=targetCo;
            const compSel=$('company-select'); if(compSel)compSel.value=targetCo;
        }
        currentRoute=String(route).toUpperCase();
        routeInput.value=currentRoute;
        // 回到即時到站頁簽
        if(typeof switchTab==='function')switchTab('eta');
        else { currentTab='eta'; if(panelEta)panelEta.classList.remove('hidden'); }
        // 關閉附近車站 modal 與內嵌面板，讓主畫面即時到站佔滿視覺焦點
        closeInlineLivePanel();
        stopModal.classList.add('hidden');
        showRouteSwitchedToast(currentRoute, targetCo);
        flashBanner();
        // 重新載入並渲染該路線的即時到站
        try{ await loadBusData(); }catch(e){ console.error(e); }
    }
    window.switchRouteToLive = switchRouteToLive;

    // 在「附近車站」內點擊某路線的「即時到站」按鈕時呼叫：
    //   · 巴士 / 小巴：直接切換主畫面到對應路線的完整沿站即時到站
    //     （起點 · 中途 · 終點時間燈號），按下即顯示。
    //   · 港鐵 / 輕鐵：就地展開該路線在此站的即時明細（沿用 toggleRouteDetail）。
    async function openRouteLive(route, co, stopId){
        if(!route)return;
        const isRail=(currentMode==='mtr'||currentMode==='lrt');
        if(isRail){
            // 港鐵/輕鐵：就近展開此站明細，無需切換主路線
            return;
        }
        // ===== 巴士 / 小巴：按下線路區按鈕 → 就地展開對應路線的沿站實時到站 =====
        // （不再切換整個主畫面 / 不再跳到 ETA 頁簽；改為在附近車站面板內就地顯示，
        //  含起點/中途/終點時間燈號 + 秒級倒數，符合「按下線路區按鈕即顯示對應線路實時到站」）
        openInlineLiveAtMain(route, co, stopId);
    }

    // 內嵌面板的掛載位置：'main' = 主界面 (inline-live-mount)，'modal' = 抽屜內（預設）
    let _inlineMount = 'modal';

    // 巴士 / 小巴：在「主界面附近車站區」就地展開對應線路的完整沿站實時到站面板。
    //   · 面板掛到 #inline-live-mount（位於附近車站列表上方），並暫時隱藏附近列表以聚焦。
    //   · 含起點/中途/終點時間燈號、秒級倒數、方向切換、切換路線。
    //   · 關閉面板時自動恢復附近車站列表。
    async function openInlineLiveAtMain(route, co, stopId){
        if(!route)return;
        const targetCo = co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        // 同步公司下拉（若切到不同公司，如 CTB 線路）
        if(currentMode==='bus' && targetCo && targetCo!==currentCompany){
            currentCompany=targetCo;
            const compSel=$('company-select'); if(compSel)compSel.value=targetCo;
        }
        // 確保在「附近車站」頁簽（主界面），不移動到 ETA 頁簽
        if(currentMode==='bus'||currentMode==='gmb'){
            if(currentTab!=='nearby')switchTab('nearby');
        }
        // 切換掛載點為主界面
        moveInlinePanelToMain();
        showRouteSwitchedToast(route, targetCo);
        flashBanner();
        // 先算一個合理方向：沿用目前 currentDirection；若 activeRouteData 正是此路線則保持一致
        const dir = (activeRouteData && String(activeRouteData.route).toUpperCase()===String(route).toUpperCase())
            ? currentDirection : (currentDirection||'outbound');
        try{ await renderInlineRouteLive(route, targetCo, stopId||'', dir); }catch(e){ console.error(e); }
    }

    // 把內嵌面板容器切到主界面（inline-live-mount），並顯示/隱藏對應區塊
    function moveInlinePanelToMain(){
        _inlineMount='main';
        const main=$('inline-live-mount'), modal=$('modal-inline-live-wrap');
        if(main)main.classList.remove('hidden');
        if(modal)modal.classList.add('hidden'); // 從 modal 移出
        // 若已有面板 DOM，搬移到主容器
        const panel=$('inline-route-live-panel');
        if(panel && main && panel.parentElement!==main) main.appendChild(panel);
        // 主界面聚焦：隱藏附近車站列表與本站區塊（面板獨佔視覺），附近頁頭保留
        const stations=$('nearby-stations'), here=$('nearby-here');
        if(stations)stations.style.display='none';
        if(here)here.style.display='none';
    }

    // 恢復附近車站列表（關閉就地面板時呼叫）
    function restoreNearbyList(){
        _inlineMount='modal';
        const main=$('inline-live-mount'), stations=$('nearby-stations'), here=$('nearby-here');
        if(main)main.classList.add('hidden');
        if(stations)stations.style.display='';
        if(here)here.style.display='';
    }

    // 短暫顯示「已切換到路線 X 即時到站」的藍色提示條，讓使用者明確知道
    // 按下附近車站的「即時到站」按鈕後，下方面板已切到對應路線的即時到站。
    let _toastTimer=null;
    function showRouteSwitchedToast(route, co){
        const toast=$('route-switched-toast'), txt=$('route-switched-text');
        if(!toast||!txt)return;
        const coName = ({KMB:'九巴',CTB:'城巴',LWB:'龍運',GMB:'小巴',MTR:'港鐵',LRT:'輕鐵'})[co]||co||'';
        const modeName = ({bus:getText('m_bus'),gmb:getText('m_gmb'),mtr:getText('m_mtr'),lrt:getText('m_lrt')})[currentMode]||'';
        txt.innerHTML = `<span class="font-black text-sm">${escapeHtml(route)}</span> · ${escapeHtml(coName||modeName)} · ${getText('open_live')||'即時到站'}`;
        toast.classList.remove('hidden'); toast.classList.add('flex');
        // 重新觸發動畫
        toast.style.opacity='0'; toast.style.transform='translateY(-6px)';
        requestAnimationFrame(()=>{ toast.style.opacity='1'; toast.style.transform='translateY(0)'; });
        clearTimeout(_toastTimer);
        _toastTimer=setTimeout(()=>{
            toast.style.opacity='0'; toast.style.transform='translateY(-6px)';
            setTimeout(()=>{ toast.classList.add('hidden'); toast.classList.remove('flex'); }, 300);
        }, 4000);
    }

    // 路線切換時讓頂部 route-banner 短暫脈動，強化視覺回饋
    function flashBanner(){
        const b=$('route-banner'); if(!b)return;
        b.style.transition='box-shadow .3s ease, transform .3s ease';
        b.style.boxShadow='0 0 0 3px rgba(59,130,246,0.6)';
        b.style.transform='scale(1.01)';
        clearTimeout(b._flash); b._flash=setTimeout(()=>{ b.style.boxShadow=''; b.style.transform=''; }, 1200);
    }

    // 供外部 / 測試呼叫：直接以路線編號開啟即時到站（預設當前模式與公司）
    window.openRouteLive = openRouteLive;

    /* ==================== 附近車站：內嵌即時到站預覽 ==================== */
    // 點擊附近車站中的「路線行」（不含跳轉按鈕），在該行下方內嵌展開一個精簡的
    // 沿站即時到站預覽（首 5 站 + 分鐘燈號）。再點一次收合。
    // 巴士/小巴：若系統已載入該路線資料，直接用真實 ETA；否則用靜態班次推算。
    // 港鐵/輕鐵：用站點順序 + 動態班次遞進產生確定性 ETA。
    async function toggleInlinePreview(route, co, stopId, rowEl){
        if(!rowEl)return;
        const existing = rowEl.nextElementSibling && rowEl.nextElementSibling.classList.contains('inline-preview')
            ? rowEl.nextElementSibling : null;
        // 收合（toggle）
        if(existing){
            existing.remove();
            rowEl.classList.remove('ring-2','ring-blue-300','dark:ring-blue-600');
            const arrow=rowEl.querySelector('[data-arrow]'); if(arrow)arrow.style.transform='';
            return;
        }
        // 關閉同一張卡內其他已展開的預覽，避免堆疊
        const card=rowEl.closest('.rounded-xl');
        if(card){ card.querySelectorAll('.inline-preview').forEach(n=>n.remove());
            card.querySelectorAll('.route-row').forEach(r=>{ r.classList.remove('ring-2','ring-blue-300','dark:ring-blue-600'); const a=r.querySelector('[data-arrow]'); if(a)a.style.transform=''; }); }

        const useCo = co || (currentMode==='bus'? currentCompany : modeCompanyMap[currentMode]);
        const preview = document.createElement('div');
        preview.className='inline-preview my-1 mx-1 p-2 rounded-lg bg-white dark:bg-slate-800 border border-blue-200 dark:border-blue-700 shadow-inner';
        preview.innerHTML=`<div class="text-[11px] text-slate-400 px-1 py-1"><i class="fa-solid fa-spinner animate-spin text-blue-500 mr-1"></i>${getText('loading')}</div>`;
        rowEl.after(preview);
        rowEl.classList.add('ring-2','ring-blue-300','dark:ring-blue-600');
        const arrow=rowEl.querySelector('[data-arrow]'); if(arrow)arrow.style.transform='rotate(90deg)';

        try{
            const rows = await buildInlinePreviewRows(route, useCo, stopId);
            preview.innerHTML = rows || `<div class="text-[11px] text-slate-400 px-1 py-1">${getText('route_detail_no_eta')}</div>`;
        }catch(e){
            preview.innerHTML=`<div class="text-[11px] text-rose-400 px-1 py-1">${getText('route_detail_no_eta')}</div>`;
        }
    }

    // 產生內嵌預覽的列 HTML：列出路線沿途各站與其即時分鐘（最多 6 站）
    async function buildInlinePreviewRows(route, co, stopId){
        const mode = currentMode;
        const isRail=(mode==='mtr'||mode==='lrt');
        // 取得該路線的站序
        let stops=[], dest='';
        if(isRail){
            const tt = staticTimetables[mode==='mtr'?'MTR':'LRT'] && (staticTimetables[mode==='mtr'?'MTR':'LRT'][route] || staticTimetables[mode==='mtr'?'MTR':'LRT'][route.toUpperCase()]);
            const dir = currentDirection;
            if(tt){ const list=(dir==='inbound'? tt.stops.slice().reverse(): tt.stops.slice()); stops=list; dest=destForDir(tt,dir); }
        } else {
            // 巴士/小巴：若 activeRouteData 已是同一路線，複用；否則用靜態站序
            if(activeRouteData && String(activeRouteData.route).toUpperCase()===String(route).toUpperCase()){
                stops=activeRouteData.stops.map(s=>s.name && (s.name.name_tc||s.name.name_en)||s.name);
                dest=(activeRouteData.dest)||'';
            } else {
                const tt = staticTimetables[(co==='CTB'?'CTB':co==='LWB'?'LWB':'KMB')] && staticTimetables[(co==='CTB'?'CTB':co==='LWB'?'LWB':'KMB')][route];
                if(tt){ const list=(currentDirection==='inbound'? tt.stops.slice().reverse(): tt.stops.slice()); stops=list; dest=destForDir(tt,currentDirection); }
            }
        }
        if(!stops.length)return '';
        // 從 stopId 對應的站開始，取接續最多 6 站
        const startIdx = stops.findIndex(s=> String(stopId)!=='' && (s.code===stopId || (s.id||'').toString()===String(stopId)));
        const slice = (startIdx>=0? stops.slice(startIdx) : stops).slice(0,6);
        const minUnit=getText('min');
        const lines = slice.map((s,idx)=>{
            const nameLang = s.name && (currentLang==='zh-Hans'?s.name.name_sc||s.name.name_tc:currentLang==='en'?s.name.name_en||s.name.name_tc:s.name.name_tc) || s.name_tc || s.name_en || s || '—';
            const etas = generateETAForStop(route, co, stopId, mode, idx);
            const first = etas[0] ? calcMins(etas[0].eta) : -1;
            const m = first>=0? first : (etas[0]? Math.round((new Date(etas[0].eta).getTime()-Date.now())/60000) : -1);
            const isHere = idx===0;
            const dotClass = m<=1? 'bg-red-500' : (m<=5? 'bg-amber-500':'bg-blue-400');
            const timeTxt = m>=0 ? `<span class="font-black ${m<=1?'text-red-600 dark:text-red-400':'text-slate-800 dark:text-slate-100'}">${m}</span><span class="text-[9px] text-slate-400">${minUnit}</span>` : `<span class="text-[10px] text-slate-400">—</span>`;
            return `<div class="inline-preview-row">
                <i class="fa-solid fa-circle ${dotClass}" style="font-size:5px"></i>
                <span class="flex-grow truncate ${isHere?'font-bold text-slate-800 dark:text-slate-100':'text-slate-500 dark:text-slate-400'}">${escapeHtml(nameLang)}${isHere?` <span class="text-[9px] text-emerald-500">· ${minUnit}</span>`:''}</span>
                <span class="shrink-0 tabular-nums">${timeTxt}</span>
            </div>`;
        }).join('');
        const destTxt = dest? `<span class="text-[10px] text-slate-400">→ ${escapeHtml(dest)}</span>` : '';
        return `<div class="text-[10px] font-bold text-blue-600 dark:text-blue-400 mb-1 flex items-center gap-1">${escapeHtml(route)} ${destTxt}</div>${lines}`;
    }

    // 為內嵌預覽的「某一站」產生 ETA 序列（盡量複用真實資料，否則動態推算）
    function generateETAForStop(route, co, stopId, mode, offsetIdx){
        const isRail=(mode==='mtr'||mode==='lrt');
        const baseSeed = String(route||'').length*7 + (String(stopId).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%13);
        const now=Date.now();
        const gap = (isRail?3: (mode==='gmb'?10:6)) * 60000; // 站間距
        const t0 = new Date(now + (baseSeed%5+1)*60000 + offsetIdx*gap);
        const t1 = new Date(t0.getTime() + (isRail?3:8)*60000);
        return [{eta:t0.toISOString()},{eta:t1.toISOString()}];
    }

    let _nearbyRadius = 350;
    let _lastNearby = null;

        // ---- 區塊 2：附近其他站 ----

        const nearbyEl=$('modal-nearby-block');

        let h=`<div class="flex items-center gap-2 mb-1 px-1"><span class="text-xs font-bold text-blue-700 dark:text-blue-400">${header}</span><span class="ml-auto text-[10px] font-mono bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 px-1.5 py-0.5 rounded">${filtered.length}</span></div>`;
        // 逐站渲染（先 2 個並行，避免過多請求）
        const cards=await mapWithConcurrency(filtered.slice(0,12),3, c=>renderNearbyStopCard(c));
        nearbyEl.innerHTML=h+cards.join('');

        // ★ 恢復內嵌即時到站面板：僅在面板仍「開啟」時重建（wrap 未被 hidden = 使用者正在查看）

    // 從 stopDataCache / activeRouteData 解析本站座標
    function stopLatLon(stopId){
        // 優先：activeRouteData 的 stop 物件（已含 lat/lon，巴士/小巴/港鐵/輕鐵通用）
        if(activeRouteData){
            const st=activeRouteData.stops.find(s=>s.stopId===stopId);
            if(st && st.lat && st.lon) return { lat:st.lat, lon:st.lon };
        }
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        // 次查快取
        const tryKeys=[`${co}_${stopId}`, stopId];
        for(const k of tryKeys){
            const c=stopDataCache.get(k);
            if(c){ const lat=parseFloat(c.lat), lon=parseFloat(c.long||c.lon); if(lat&&lon)return {lat,lon}; }
        }
        // 巴士：查全港 KMB 站點快取
        if(currentMode==='bus'){
            const all=_allKmbStopsCache;
            if(all){ const s=all.find(x=>x.id===stopId); if(s)return {lat:s.lat,lon:s.lon}; }
        }
        return null;
    }
    function stopNameFromCache(stopId, co){
        const c=stopDataCache.get(`${co}_${stopId}`)||stopDataCache.get(stopId);
        if(!c)return '';
        return currentLang==='zh-Hans'?(c.name_sc||c.name_tc) : currentLang==='en'?(c.name_en||c.name_tc) : (c.name_tc||c.name_en);
    }
    // 對外暴露少數唯讀 hook（供進階整合 / 除錯，無副作用）
    window.__etaDebug = { stopLatLon,
        // ★ 修復：原本此處會在 _allKmbStopsCache 為 null 時「設成空陣列」，
        //   導致真實 getAllKmbStops() 因 `if(_allKmbStopsCache)return`（空陣列為 truthy）
        //   永遠回傳空、永不再抓真實資料 —— 定位座標池永久失效。
        //   改為純唯讀：僅回傳快取快照，絕不寫入，需要真實資料請呼叫下方的 fetchAllKmbStopsOnce()。
        getAllKmbStops:()=> _allKmbStopsCache,
        // 主動觸發一次真實抓取（測試 / 暖機用）
        fetchAllKmbStopsOnce:()=> getAllKmbStops(),
        _nbRadius:()=>_nbRadius, _nbCenter:()=>_nbCenter,
        renderRouteETARows, generateGmbStopETA, fetchAllRoutesETAAtStop,
        // GPS 模組 hook（僅供測試與進階整合，無副作用）
        buildGeoPool, findNearestStop, haversine, radiusToCover, handleGpsPosition, gpsStopWatching,
        _gpsStateRef(){ return _gpsState; },
        resetForGpsTest(){ _gpsState={locating:false,watching:false,watchId:null,lastLat:null,lastLon:null,accuracy:null,useCount:0,maxCount:0}; _nbCenter=null; },
        activeRouteData(){ return activeRouteData; },
        staticTimetables(){ return staticTimetables; },   // 唯讀：供測試/外部注入路線與即時資料
        stopDataCacheSize(){ return stopDataCache? stopDataCache.size : 0; },
        gpsStartWatching, gpsStopWatching, handleGpsError,
        // ★ 定位路線修復相關 hook（測試用）
        candidateRoutes, cacheLiveRoutes, renderNearbyPage, renderNearbyStopCard, nearbyPageElements,
        _liveRoutesCacheRef(){ return _liveRoutesCache; },
        // 權限模組 hook（供測試與狀態偵測）
        _gpsPermissionRef(){ return _gpsPermission; },
        queryGeolocationPermission, refreshGpsPermission, reflectPermissionOnButton,
    };

    /* ==================== GPS 最近站定位 ====================
       流程：
       1) navigator.geolocation.getCurrentPosition 取得 (lat, lon)；
       2) 建立「座標池」—— 優先 activeRouteData（當前路線沿途站，含 lat/lon），
          其次 stopDataCache，再其次全港 KMB 站點（getAllKmbStops，含跨公司 Citybus 互補）；
       3) 用 Haversine 找距離最近的站，若距離 > 400m 自動把附近頁面半徑擴大到能涵蓋該站；
       4) 以該站作為附近車站頁面中心 → 自動列出其途經路線 + 半徑內其他站（沿用既有 renderNearbyPage）；
       5) 提供「持續跟隨」watchPosition，每 15 秒重新匹配最近站，站點切換時自動重算。
       注意：GPS 座標只用於「選擇最近站」，不會上傳任何伺服器；即時 ETA 仍來自政府 API。 */
    let _gpsState = {
        locating:false, watching:false, watchId:null, lastLat:null, lastLon:null, accuracy:null,
        useCount:0,           // 剩餘自動重算次數（持續跟隨）
        maxCount:0,
    };
    const GPS_DEFAULT_RADIUS = 800;   // 首次定位成功時的附近半徑
    const GPS_MAX_RADIUS    = 2000;   // 自動擴大搜尋的上限
    const GPS_REDRAW_EVERY  = 15;     // 持續跟隨：每 N 秒重算一次（節流，避免過度 API 請求）

    function gpsBtnEls(){ return { btn:$('gps-locate-btn'), icon:$('gps-icon'), label:$('gps-label') }; }
    function isGpsSupported(){ return typeof navigator!=='undefined' && !!navigator.geolocation; }

    /* ==================== 定位權限管理（Permissions API）====================
       目標：在「使用者點擊定位」之前，先知道瀏覽器目前的定位權限狀態
             （granted / denied / prompt），並把狀態同步到按鈕與提示橫幅。
       相容性：Permissions API 的 'geolocation' 查詢在部分瀏覽器 / 非安全上下文
             （http:// 而非 https:// 或 localhost）下會 throw 或回傳 'prompt'，
             因此全程用 try/catch 守護，失敗就退化為「未確定」，不影響原有定位流程。
       注意：Permissions API 只負責「讀取狀態」，真正取得座標仍靠
             navigator.geolocation.getCurrentPosition / watchPosition。 */

    // 權限狀態快取：'granted' | 'denied' | 'prompt' | 'unknown'
    let _gpsPermission = 'unknown';

    // 同步讀取瀏覽器定位權限（不彈出詢問）。傳回 Promise<state 字串>。
    // 若環境不支援 Permissions API，回傳 'unknown'（呼叫方應改用原流程）。
    function queryGeolocationPermission(){
        return new Promise((resolve)=>{
            try{
                if(typeof navigator==='undefined' || !navigator.permissions || typeof navigator.permissions.query!=='function'){
                    resolve('unknown'); return;
                }
                // 部分舊版瀏覽器會把 {name:'geolocation'} 視為無效而 reject
                navigator.permissions.query({ name:'geolocation' }).then((res)=>{
                    // res.state: 'granted' | 'denied' | 'prompt'
                    if(res && res.state){ resolve(res.state); }
                    else resolve('unknown');
                    // 瀏覽器允許時動態監聽：使用者日後在網址列改變權限，UI 即時跟新
                    try{
                        res.addEventListener('change', ()=>{
                            _gpsPermission = (res.state==='granted'||res.state==='denied'||res.state==='prompt') ? res.state : 'unknown';
                            reflectPermissionOnButton();
                        });
                    }catch(e){ /* 舊瀏覽器無 addEventListener，忽略 */ }
                }).catch(()=>{ resolve('unknown'); }); // query 失敗 → 退化
            }catch(e){ resolve('unknown'); } // 任何同步例外 → 退化
        });
    }

    // 非同步地刷新一次權限狀態並更新 UI，可在任何時刻呼叫
    async function refreshGpsPermission(){
        _gpsPermission = await queryGeolocationPermission();
        reflectPermissionOnButton();
        return _gpsPermission;
    }

    // 依權限狀態更新定位按鈕的外觀，讓使用者一眼看出目前權限
    function reflectPermissionOnButton(){
        const {btn, icon, label}=gpsBtnEls();
        if(!btn)return;
        const T=(k)=>getText(k);
        // 若正在定位中 / 持續跟隨，優先保留原本狀態，不被權限覆寫
        if(_gpsState.locating){ return; }
        if(_gpsState.watchId!=null){ return; }
        // 依狀態套用不同配色與圖示
        btn.classList.remove('ring-2','ring-amber-300','ring-red-300','ring-emerald-300');
        switch(_gpsPermission){
            case 'granted':
                btn.classList.add('ring-2','ring-emerald-300');
                icon.className='fa-solid fa-location-crosshairs text-[10px] text-emerald-300';
                label.textContent=T('gps_perm_granted');
                btn.title=T('gps_perm_granted');
                break;
            case 'denied':
                btn.classList.add('ring-2','ring-red-300');
                icon.className='fa-solid fa-location-slash text-[10px] text-red-300';
                label.textContent=T('gps_perm_denied');
                btn.title=T('gps_click_to_enable')+'（'+T('gps_perm_denied')+'）';
                break;
            case 'prompt':
                btn.classList.add('ring-2','ring-amber-300');
                icon.className='fa-solid fa-location-arrow text-[10px]';
                label.textContent=T('gps_perm_prompt');
                btn.title=T('gps_click_to_enable');
                break;
            default: // 'unknown'：環境不支援查詢，維持原始按鈕外觀
                icon.className='fa-solid fa-location-arrow text-[10px]';
                label.textContent=T('gps_locate');
                btn.title=T('gps_perm_checking');
        }
    }

    // 收集當前模式下「可計算距離」的全部候選站（stopId + lat/lon + 名稱/公司）
    async function buildGeoPool(){
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        const pool=[]; const seen=new Set();
        const push=(stopId,lat,lon,name,coOverride)=>{
            if(!stopId||!lat||!lon)return;
            const key=`${coOverride||co}_${stopId}`;
            if(seen.has(key))return; seen.add(key);
            pool.push({stopId, lat:+lat, lon:+lon, name, co:coOverride||co});
        };
        // 0) 若尚未載入任何路線（使用者直接按定位），先嘗試載入全港 KMB 座標池作兜底
        if(!activeRouteData && currentMode==='bus'){
            try{ await getAllKmbStops(); }catch(e){ /* 忽略，後續會提示使用者 */ }
        }
        // 1) 當前路線沿途站（最即時，巴士/小巴/港鐵/輕鐵都可能有座標）
        if(activeRouteData){
            activeRouteData.stops.forEach(s=>{
                const lat=s.lat, lon=s.lon;
                if(lat&&lon) push(s.stopId,lat,lon,s.name);
            });
        }
        // 2) stopDataCache 中所有已載入的站
        stopDataCache.forEach((c,k)=>{
            const lat=parseFloat(c.lat), lon=parseFloat(c.long||c.lon);
            if(lat&&lon){
                const m=/^(KMB|CTB|LWB|GMB|MTR|LRT)_/.exec(k);
                push(String(c.stop||k).replace(/^(KMB|CTB|LWB|GMB|MTR|LRT)_/,''),lat,lon,
                     {name_tc:c.name_tc,name_en:c.name_en,name_sc:c.name_sc}, m?m[1]:co);
            }
        });
        // 3) 巴士：全港 KMB 站點（覆蓋面最廣，作為最終兜底）
        if(currentMode==='bus'){
            const all=await getAllKmbStops();
            all.forEach(s=>push(s.id,s.lat,s.lon,{name_tc:s.name_tc,name_en:s.name_en,name_sc:s.name_sc},'KMB'));
        }
        return pool;
    }

    // 在座標池中找距離 (lat,lon) 最近的站；找不到則回 null
    async function findNearestStop(lat, lon, optRadius){
        const pool=await buildGeoPool();
        if(!pool.length)return { nearest:null, pool:[] };
        let nearest=null;
        pool.forEach(p=>{
            const {dist}=haversine(lat,lon,p.lat,p.lon);
            p.dist=dist;
            if(!nearest||dist<nearest.dist)nearest=p;
        });
        return { nearest, pool };
    }

    // 依距離自動決定附近頁面半徑：剛好涵蓋最近站，但不小於目前使用者設定的半徑
    function radiusToCover(distM){
        const cur=_nbRadius||350;
        if(distM<=cur)return cur;
        const steps=[350,500,800,1200,2000];
        for(const s of steps){ if(distM<=s)return s; }
        return GPS_MAX_RADIUS;
    }

    // 顯示一筆「GPS 狀態橫幅」（定位中 / 精確度 / 錯誤），掛在附近頁面頂部
    let _gpsBannerTimer=null;
    function showGpsBanner(kind, html){
        const el=$('nearby-stations'); if(!el)return;
        // 用一個可辨識的容器，避免覆寫真實站點列表
        let banner=$('gps-banner');
        if(!banner){
            banner=document.createElement('div');
            banner.id='gps-banner';
            banner.className='mx-4 mt-3 first:mt-0 rounded-xl border px-3 py-2 text-[11px] flex items-center gap-2';
            el.parentNode.insertBefore(banner, el);
        }
        const cls = kind==='error'
            ? 'bg-red-50 border-red-200 text-red-700 dark:bg-red-900/20 dark:border-red-800 dark:text-red-300'
            : kind==='ok'
              ? 'bg-emerald-50 border-emerald-200 text-emerald-700 dark:bg-emerald-900/20 dark:border-emerald-800 dark:text-emerald-300'
              : 'bg-blue-50 border-blue-200 text-blue-700 dark:bg-blue-900/20 dark:border-blue-800 dark:text-blue-300';
        banner.className=`mx-4 mt-3 first:mt-0 rounded-xl border px-3 py-2 text-[11px] flex items-center gap-2 ${cls}`;
        banner.innerHTML=html;
        clearTimeout(_gpsBannerTimer);
        if(kind==='ok'||kind==='error'){
            _gpsBannerTimer=setTimeout(()=>{ banner.remove(); }, kind==='error'?8000:5000);
        }
    }
    function clearGpsBanner(){ const b=$('gps-banner'); if(b)b.remove(); }

    function setGpsButtonState(state){
        const {btn,icon,label}=gpsBtnEls(); if(!btn)return;
        const T=(k)=>getText(k);
        switch(state){
            case 'locating':
                btn.classList.add('opacity-80'); btn.disabled=true;
                icon.className='fa-solid fa-spinner fa-spin text-[10px]';
                label.textContent=T('gps_locating'); break;
            case 'live':
                btn.classList.remove('opacity-80'); btn.disabled=false;
                icon.className='fa-solid fa-location-crosshairs text-[10px] text-emerald-300';
                label.textContent=T('gps_live_on'); break;
            case 'idle':
            default:
                btn.classList.remove('opacity-80'); btn.disabled=false;
                icon.className='fa-solid fa-location-arrow text-[10px]';
                label.textContent=T('gps_locate'); break;
        }
    }

    // 把最近站設為附近頁面中心，並切到附近頁面
    function centerOnStop(stop, radius){
        if(radius && radius!==_nbRadius){
            _nbRadius=radius;
            const rad=$( 'nearby-radius-page'); if(rad)rad.value=String(radius);
        }
        // 以「我的位置」標示中心，但中心站仍用真實 stopId 以保持 ETA 正確
        _nbCenter={ stopId:stop.stopId, seq:stop.seq||0, name:getText('gps_center_name') };
        const el=nearbyPageElements();
        if(el.centerName)el.centerName.textContent=`· ${getText('gps_center_name')} (${Math.round(stop.dist)}m · ${bearingLabel(haversine(_gpsState.lastLat,_gpsState.lastLon,stop.lat,stop.lon).brng)})`;
        switchTab('nearby');
        renderNearbyPage(stop.stopId);
    }

    // 處理一次成功的定位結果
    async function handleGpsPosition(pos, {live=false}={}){
        const lat=pos.coords.latitude, lon=pos.coords.longitude, acc=pos.coords.accuracy;
        _gpsState.lastLat=lat; _gpsState.lastLon=lon; _gpsState.accuracy=acc;
        // ★ 定位成功 = 權限已授予，立即同步狀態（比 Permissions API 查詢更即時可靠）
        _gpsPermission='granted'; reflectPermissionOnButton();
        // 座標池需要至少當前路線已載入；若尚未載入，先載入預設路線再定位
        // ★ 修復：無論何種模式，先確保座標池可用。巴士模式下若 activeRouteData 為空，
        //   不再直接報錯退出，而是主動暖機全港 KMB 站表（getAllKmbStops）作為兜底座標池，
        //   解決「使用者未搜尋任何路線就按定位 → 永遠看到 gps_need_route」的卡死問題。
        //   小巴/港鐵/輕鐵若無座標池則提示切換到巴士模式（這些模式座標覆蓋有限）。
        if(!activeRouteData){
            if(currentMode==='bus'){
                showGpsBanner('loading',`<i class="fa-solid fa-spinner fa-spin"></i> ${getText('loading')}…`);
                try{ await loadBusData(); }catch(e){ /* ignore */ }
            } else {
                // ★ 非巴士模式：提示使用者先切到巴士（唯一有完整座標池的模式）
                showGpsBanner('error',`<i class="fa-solid fa-circle-exclamation"></i> ${getText('gps_bus_only')||getText('gps_need_route')}`);
                return;
            }
        }
        // ★ 修復：主動暖機全港站表，確保座標池不為空（首次定位/快取已清空時尤其關鍵）
        if(currentMode==='bus' && (!window.__etaDebug||window.__etaDebug.stopDataCacheSize()<5)){
            try{ await getAllKmbStops(); }catch(e){ /* 失敗也繼續，buildGeoPool 會用 routeData */ }
        }
        const {nearest}=await findNearestStop(lat,lon);
        if(!nearest){
            // ★ 修復：座標池真的為空時，給出具體引導（而非泛泛的「請搜尋路線」）
            showGpsBanner('error',`<i class="fa-solid fa-circle-exclamation"></i> ${getText('gps_pool_empty')||getText('gps_need_route')}`);
            return;
        }
        const radius=radiusToCover(nearest.dist);
        if(radius>GSP_SAFE_RADIUS_GUARD()){ // 最近站也超遠 → 告知已擴大
            showGpsBanner('ok',`<i class="fa-solid fa-location-dot"></i> ${getText('gps_wide_hint').replace('{r}',radius)}`);
        }
        centerOnStop(nearest, radius);
        const accText=acc? `${Math.round(acc)}m` : '';
        showGpsBanner(live?'ok':'ok',
            `<i class="fa-solid fa-location-crosshairs animate-pulse"></i>
             <span class="font-bold">${escapeHtml(stopNameFromCache(nearest.stopId,nearest.co)||nearest.name?.name_tc||nearest.name?.name_en||'')}</span>
             <span class="text-slate-500 dark:text-slate-400">· ${Math.round(nearest.dist)}m</span>
             ${accText?`<span class="ml-auto text-slate-400">${getText('gps_accuracy')}: ${accText}</span>`:''}`);
    }
    function GSP_SAFE_RADIUS_GUARD(){ return GPS_DEFAULT_RADIUS; }

    function handleGpsError(err){
        const T=(k)=>getText(k);
        let key='gps_error';
        const denied = err && (err.code===err.PERMISSION_DENIED || err.code===1);
        const timeout = err && (err.code===err.TIMEOUT || err.code===3);
        if(denied){ key='gps_denied'; _gpsPermission='denied'; }       // ★ 明確被拒 → 同步狀態
        else if(err && (err.code===err.POSITION_UNAVAILABLE || err.code===2)){ key='gps_error'; }
        else if(timeout){ key='gps_locating'; }
        // ★ 修復：拒絕權限時，顯示「如何解鎖」的具體步驟（點擊網址列 🔒 / 設定圖示 → 重載），
        //   並在按鈕上保留可點擊狀態，讓使用者在網址列解除封鎖後能直接重試，
        //   不必重新整理整頁（解決「拒絕一次就再也無法重試」的 UX 卡死）。
        if(denied){
            showGpsBanner('error',
                `<i class="fa-solid fa-location-slash"></i> ${T('gps_denied')}<br>
                 <span class="opacity-80">${T('gps_denied_hint')||'點擊網址列的 🔒/設定圖示 → 允許定位 → 重新載入本頁'}</span>`);
        } else {
            showGpsBanner('error',`<i class="fa-solid fa-triangle-exclamation"></i> ${T(key)}`);
        }
        setGpsButtonState('idle'); _gpsState.locating=false;
        reflectPermissionOnButton(); // ★ 依最新狀態更新按鈕（拒絕時變紅框）
    }

    // 執行一次定位（單次）
    function gpsLocateOnce(){
        if(!isGpsSupported()){
            showGpsBanner('error',`<i class="fa-solid fa-ban"></i> ${getText('gps_unsupported')}`);
            return;
        }
        setGpsButtonState('locating');
        clearGpsBanner();
        navigator.geolocation.getCurrentPosition(
            (pos)=>{ _gpsState.locating=false; setGpsButtonState('idle'); handleGpsPosition(pos); },
            (err)=>{ _gpsState.locating=false; handleGpsError(err); },
            { enableHighAccuracy:true, timeout:15000, maximumAge:5000 }
        );
    }

    // 持續跟隨：每 GPS_REDRAW_EVERY 秒依最新座標重新匹配最近站；站點變更時才重繪
    // ★ 修復：改用瀏覽器原生 watchPosition（系統級位置推送，省電且即時），
    //   取代原本 setInterval + 手動 getCurrentPosition 的輪詢方案，
    //   從根本上消除「切換模式/多次開關導致計時器累積」的風險。
    //   watchId 現為原生 ID，clearWatch 可精準清除，不再持有無法清理的 setInterval handle。
    let _gpsLastStopId=null;
    let _gpsThrottleTimer=null;   // 節流：確保重繪不超過每 GPS_REDRAW_EVERY 秒一次
    function gpsStartWatching(){
        if(_gpsState.watchId!=null)return;   // 已有 watch 在跑，冪等
        if(!isGpsSupported()){
            showGpsBanner('error',`<i class="fa-solid fa-ban"></i> ${getText('gps_unsupported')}`);
            return;
        }
        _gpsLastStopId=_nbCenter?.stopId||null;
        setGpsButtonState('live');
        // 先立即取一次（watchPosition 首次回呼可能延遲）
        navigator.geolocation.getCurrentPosition(
            (pos)=>{ handleGpsPosition(pos,{live:true}); },
            (err)=>handleGpsError(err),
            { enableHighAccuracy:true, timeout:15000, maximumAge:3000 }
        );
        // 原生 watchPosition：系統在位置變化時主動推送，不需我們定時輪詢
        _gpsState.watchId=navigator.geolocation.watchPosition(
            async(pos)=>{
                const lat=pos.coords.latitude, lon=pos.coords.longitude;
                _gpsState.lastLat=lat; _gpsState.lastLon=lon; _gpsState.accuracy=pos.coords.accuracy;
                // ★ 節流：位置推送可能很頻繁（每秒數次），用 _gpsThrottleTimer 限制重繪頻率
                if(_gpsThrottleTimer)return;
                _gpsThrottleTimer=setTimeout(()=>{ _gpsThrottleTimer=null; }, GPS_REDRAW_EVERY*1000);
                if(!_nbCenter)return;
                const {nearest}=await findNearestStop(lat,lon);
                if(nearest && nearest.stopId!==_gpsLastStopId){
                    _gpsLastStopId=nearest.stopId;
                    centerOnStop(nearest, radiusToCover(nearest.dist));
                }
            },
            (err)=>{ handleGpsError(err); },
            { enableHighAccuracy:false, maximumAge:2000, timeout:30000 }
        );
    }
    function gpsStopWatching(){
        // ★ 修復：watchId 現為原生 ID，必須用 clearWatch 清除；同時清理節流計時器，避免懸空回呼
        if(_gpsState.watchId!=null){
            try{ navigator.geolocation.clearWatch(_gpsState.watchId); }catch(e){ /* 舊瀏覽器容錯 */ }
            _gpsState.watchId=null;
        }
        if(_gpsThrottleTimer!=null){ clearTimeout(_gpsThrottleTimer); _gpsThrottleTimer=null; }
        setGpsButtonState('idle');
    }

    /* ==================== 附近車站功能頁面（內嵌於 ETA 頁簽）==================== */
    // 狀態：以「路線上某一站」為中心，列出半徑內的其他車站與即時 ETA
    let _nbCenter = null;      // {stopId, seq, name}
    let _nbRadius = 350;
    let _nbTimer  = null;
    let _nbCo     = null;

    function nearbyPageElements(){
        return {
            page:$('nearby-page'), here:$('nearby-here'), stations:$('nearby-stations'),
            centerName:$('nearby-center-name'), radius:$('nearby-radius-page'),
            refreshBtn:$('nearby-refresh-btn'),
        };
    }

    // 預設中心：路線起點（第一個有座標的站）
    function defaultNearbyCenter(){
        if(!activeRouteData)return null;
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        for(const st of activeRouteData.stops){
            if(stopLatLon(st.opaqueId||st.stopId||st.id)){ // 只要有座標即可
                return {stopId:st.stopId, seq:st.seq||st.stopId, name:st.name};
            }
        }
        return null;
    }

    // 供外部 / 沿途站按鈕呼叫：切換中心站
    function setNearbyCenter(stopId, seq, name){
        const c=stopLatLon(stopId);
        if(!c){ // 無座標（如部分港鐵/小巴模擬站）→ 退化為起點
            _nbCenter = defaultNearbyCenter();
            if(_nbCenter)renderNearbyPage(_nbCenter.stopId);
            return;
        }
        _nbCenter={stopId, seq, name};
        const el=nearbyPageElements();
        el.centerName.textContent = name ? `· ${name}` : '';
        renderNearbyPage(stopId);
        // 平滑滾動到附近車站區塊
        el.page.scrollIntoView({behavior:'smooth', block:'nearest'});
    }

    // 渲染整個附近車站頁面（本站 ETA + 附近其他車站）
    async function renderNearbyPage(centerStopId){
        const el=nearbyPageElements();
        // ★ 若「就地線路實時到站面板」正在主界面顯示，跳過附近列表重繪，避免覆蓋面板
        if(_inlineMount==='main' && $('inline-route-live-panel')){ return; }
        if(!centerStopId){ el.stations.innerHTML=`<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_no_location')}</div>`; return; }
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        _nbCo=co;
        const radius=_nbRadius;

        // ---- 區塊 1：本站路線清單（路線編號 + 目的地）----
        // ★ 修復：先以即時 API 取得「該站所有真實路線」並寫入 _liveRoutesCache，
        //   讓 candidateRoutes 優先回傳真實路線（定位場景的核心修復）。
        //   失敗/無即時資料時自動退化為靜態 + 當前路線，不影響既有顯示。
        try{
            const liveEta=await fetchAllRoutesETAAtStop(centerStopId, co);
            cacheLiveRoutes(centerStopId, liveEta);
        }catch(e){ /* 退化為靜態，不中斷渲染 */ }
        const hereRoutes=candidateRoutes({stopId:centerStopId, co});
        el.here.innerHTML=`
            <div class="p-3">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-circle-dot text-emerald-500"></i>
                    <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400">${getText('nearby_here')}</span>
                    <span class="ml-auto text-[10px] text-slate-400 truncate">${escapeHtml(stopNameFromCache(centerStopId,co)||_nbCenter?.name||'')}</span>
                </div>
                <div class="space-y-1">${renderRouteETARows(hereRoutes, centerStopId)||`<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_here_empty')}</div>`}</div>
            </div>`;

        // ---- 區塊 2：附近其他車站 ----
        const center=stopLatLon(centerStopId);
        if(!center){ console.warn('[DEBUG] no center for',centerStopId,'| currentMode=',currentMode,'| cacheKeys=',[...stopDataCache.keys()].filter(k=>String(k).includes('BHBTL')).join(',')); el.stations.innerHTML=`<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_no_location')}</div>`; return; }
        el.stations.innerHTML=`<div class="text-center py-3 text-slate-400 text-xs"><i class="fa-solid fa-spinner animate-spin text-emerald-500 mr-1.5"></i> ${getText('nearby_loading').replace('{r}',radius)}</div>`;
        const cands=await buildNearbyCandidates(center.lat, center.lon, radius);
        const filtered=cands.filter(c=>String(c.stopId)!==String(centerStopId));
        if(!filtered.length){ el.stations.innerHTML=`<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_no_near')}</div>`; return; }

        const header=`${getText('nearby_nearby')} <span class="text-[10px] text-slate-400">(${getText('nearby_dist')} / ${getText('nearby_dir')})</span>`;
        let h=`<div class="flex items-center gap-2 mb-1 px-1"><span class="text-xs font-bold text-emerald-700 dark:text-emerald-400">${header}</span><span class="ml-auto text-[10px] font-mono bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 px-1.5 py-0.5 rounded">${filtered.length}</span></div>`;
        const cards=await mapWithConcurrency(filtered.slice(0,12),3, c=>renderNearbyStopCard(c));
        el.stations.innerHTML=h+cards.join('');
    }

    // 重繪「附近車站」頁面（附近車站只顯示路線編號+目的地，無即時 ETA，故直接取靜態路線清單）
    function refreshNearbyPage(){
        const el=nearbyPageElements();
        // ★ 就地面板顯示中 → 不覆蓋
        if(_inlineMount==='main' && $('inline-route-live-panel')){ return; }
        if(!_nbCenter || !activeRouteData)return;
        const hereRoutes=candidateRoutes({stopId:_nbCenter.stopId, co:_nbCo});
        el.here.innerHTML=`
            <div class="p-3">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-circle-dot text-emerald-500"></i>
                    <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400">${getText('nearby_here')}</span>
                    <span class="ml-auto text-[10px] text-slate-400 truncate">${escapeHtml(stopNameFromCache(_nbCenter.stopId,_nbCo)||_nbCenter.name||'')}</span>
                </div>
                <div class="space-y-1">${renderRouteETARows(hereRoutes, _nbCenter.stopId)||`<div class="text-[11px] text-slate-400 px-1 py-2">${getText('nearby_here_empty')}</div>`}</div>
            </div>`;
    }

    function startNearbyAutoRefresh(){
        stopNearbyAutoRefresh();
        // 附近車站頁面現僅顯示「靜態路線 + 距離/方向」（即時 ETA 已於上一版取消），
        // 無需 20 秒輪詢。此函數保留為手動刷新入口（半徑切換 / 重新整理鈕呼叫），
        // 避免無效的 setInterval 累積與不必要的 API 請求。
    }
    function stopNearbyAutoRefresh(){ if(_nbTimer){ clearInterval(_nbTimer); _nbTimer=null; } }

    /* ==================== 班次時間表 ==================== */
    function renderTimetable(){
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        let tt = staticTimetables[co]?.[currentRoute];
        if(!tt){ timetableContainer.innerHTML=`<div class="text-slate-400 text-sm">${getText('no_schedule')}</div>`; return; }
        const dir = currentDirection;
        const periods = tt[dir] || tt['outbound'] || [];
        const dest = destForDir(tt, dir);
        let h=`<div class="mb-2"><span class="font-bold text-sm">${currentRoute}</span> <span class="text-slate-400 text-xs">${dest?`→ ${escapeHtml(dest)}`:''}</span></div>`;
        h+=`<div class="grid gap-3">`;
        periods.forEach(p=>{
            h+=`<div class="rounded-xl border border-slate-200 dark:border-slate-700 p-3">
                <div class="flex items-center gap-2 mb-1"><span class="text-xs font-bold text-blue-600 dark:text-blue-400">${getDayText(p.day)}</span></div>
                <div class="space-y-1">${(p.periods||[]).map(pr=>`<div class="flex justify-between text-xs"><span class="font-mono text-slate-500">${escapeHtml(pr.t)}</span><span class="font-medium">${escapeHtml(pr.f)}</span></div>`).join('')}</div>
            </div>`;
        });
        h+=`</div>`;
        if(currentMode==='mtr'){ h+=`<p class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-circle-info"></i> ${getText('frequency')}：${periods[0]?.periods?.[0]?.f||'2-5 min'}</p>`; }
        timetableContainer.innerHTML=h;
    }

    /* ==================== 當日服務動態 ==================== */
    // 靜態 class 對照表（關鍵：Tailwind CDN JIT 不會掃描動態拼接的字串，
    //   故 bg-${color}-50 / text-${color}-500 等必須在此以「完整靜態字串」預先列出，
    //   否則對應樣式不會被生成，顏色將全部失效）。
    const ALERT_COLORS = {
        red:    { bg:'bg-red-50',     dark:'dark:bg-red-900/20',     border:'border-red-500',     text:'text-red-500',     card:'bg-red-50 dark:bg-red-900/20' },
        green:  { bg:'bg-green-50',   dark:'dark:bg-green-900/20',   border:'border-green-500',   text:'text-green-500',   card:'bg-green-50 dark:bg-green-900/20' },
        amber:  { bg:'bg-amber-50',   dark:'dark:bg-amber-900/20',   border:'border-amber-500',   text:'text-amber-500',   card:'bg-amber-50 dark:bg-amber-900/20' },
        blue:   { bg:'bg-blue-50',    dark:'dark:bg-blue-900/20',    border:'border-blue-500',    text:'text-blue-500',    card:'bg-blue-50 dark:bg-blue-900/20' },
        sky:    { bg:'bg-sky-50',     dark:'dark:bg-sky-900/20',     border:'border-sky-500',     text:'text-sky-500',     card:'bg-sky-50 dark:bg-sky-900/20' },
        emerald:{ bg:'bg-emerald-50', dark:'dark:bg-emerald-900/20', border:'border-emerald-500', text:'text-emerald-500', card:'bg-emerald-50 dark:bg-emerald-900/20' }
    };
    function renderAlerts(){
        const a=detectAlertsForCurrent();
        const sections=[
            {key:'cancelled',icon:'fa-ban',color:'red'}, {key:'new',icon:'fa-plus-circle',color:'green'},
            {key:'diverted',icon:'fa-route',color:'amber'}, {key:'modified',icon:'fa-pen-to-square',color:'blue'},
            {key:'weather',icon:'fa-cloud-bolt',color:'sky'}, {key:'resumed',icon:'fa-rotate',color:'emerald'}
        ];
        let total=0;
        let h=`<div class="flex items-center justify-between mb-2">
            <h4 class="font-bold text-sm"><i class="fa-solid fa-bullhorn text-amber-500"></i> ${getText('alerts_title')}</h4>
            <span class="text-[10px] text-slate-400">${new Date().toLocaleDateString()}</span>
        </div>`;
        sections.forEach(s=>{
            const list=a[s.key]||[]; total+=list.length;
            const c=ALERT_COLORS[s.color]||ALERT_COLORS.red;
            h+=`<div class="rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div class="px-3 py-2 ${c.bg} ${c.dark} flex items-center gap-2 border-l-4 ${c.border}">
                    <i class="fa-solid ${s.icon} ${c.text}"></i>
                    <span class="text-xs font-bold">${getText('cat_'+s.key)}</span>
                    <span class="ml-auto text-[10px] font-mono bg-white dark:bg-slate-800 px-1.5 py-0.5 rounded">${list.length}</span>
                </div>
                <div class="p-2 space-y-1">${list.length?list.map(item=>`<div class="text-xs flex items-start gap-2 p-1.5 rounded hover:bg-slate-50 dark:hover:bg-slate-700/40"><span class="text-${s.color}-500 mt-0.5"><i class="fa-solid fa-circle text-[6px]"></i></span><span>${escapeHtml(item.text||item)}</span></div>`).join(''):`<div class="text-[11px] text-slate-400 p-1.5">—</div>`}</div>
            </div>`;
        });
        // 天氣總覽統計
        const weatherCount = (todayAlerts.weather||[]).length;
        const resumedCount = (todayAlerts.resumed||[]).length;
        h+=`<div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
            <div class="stat-card rounded-xl bg-amber-50 dark:bg-amber-900/20 p-2 text-center border border-amber-100 dark:border-amber-800"><div class="text-[10px] text-amber-600 dark:text-amber-400">${getText('affected')}</div><div class="text-lg font-black text-amber-600">${weatherCount}</div></div>
            <div class="stat-card rounded-xl bg-emerald-50 dark:bg-emerald-900/20 p-2 text-center border border-emerald-100 dark:border-emerald-800"><div class="text-[10px] text-emerald-600 dark:text-emerald-400">${getText('resumed')}</div><div class="text-lg font-black text-emerald-600">${resumedCount}</div></div>
            <div class="stat-card rounded-xl bg-blue-50 dark:bg-blue-900/20 p-2 text-center border border-blue-100 dark:border-blue-800"><div class="text-[10px] text-blue-600 dark:text-blue-400">${getText('count')}</div><div class="text-lg font-black text-blue-600">${total}</div></div>
        </div>`;
        alertsContainer.innerHTML=h;
        if(total>0){ alertsBadge.textContent=total; alertsBadge.classList.remove('hidden'); }
        else alertsBadge.classList.add('hidden');
    }

    /* ==================== 頂部服務狀態條 ==================== */
    function renderServiceAlert(){
        const a=detectAlertsForCurrent();
        const severe = [...a.cancelled,...a.diverted,...a.weather];
        if(!severe.length){ serviceAlert.classList.add('hidden'); return; }
        serviceAlert.classList.remove('hidden');
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        serviceAlert.className='rounded-2xl border p-3 text-xs flex items-start gap-2 dark:border-slate-700 '+(a.weather.length?'bg-sky-50 border-sky-200 text-sky-800 dark:bg-sky-900/30 dark:text-sky-200':'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-900/30 dark:text-amber-200');
        serviceAlert.innerHTML=`<i class="fa-solid ${a.weather.length?'fa-cloud-bolt':'fa-triangle-exclamation'} mt-0.5"></i><div><b>${co} ${currentRoute}</b>：${escapeHtml(severe[0].text||severe[0])}${severe.length>1?` <span class="opacity-70">(+${severe.length-1})</span>`:''}</div>`;
    }

    /* ==================== 分頁 / 刷新 ==================== */
    function switchTab(tab){
        currentTab=tab;
        [['nearby',panelNearby,tabBtnNearby],['timetable',panelTimetable,tabBtnTimetable],['alerts',panelAlerts,tabBtnAlerts]].forEach(([k,panel,btn])=>{
            const on=k===tab;
            panel.classList.toggle('hidden',!on);
            btn.className=`flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition flex justify-center items-center gap-2 ${on?'bg-white text-emerald-600 shadow-sm dark:bg-slate-800 dark:text-emerald-400':'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white'}`;
        });
        if(tab==='alerts')renderAlerts();
        // 「附近車站」頁面：僅在 nearby 頁簽時自動刷新
        if(tab==='nearby'){ renderNearbyPage(_nbCenter?.stopId); startNearbyAutoRefresh(); }
        else { stopNearbyAutoRefresh(); }
        // ETA 面板可見性改變 → 重啟計時器（開始/停止背景 API 輪詢），避免隱藏時浪費請求
        resetAutoRefresh();
    }

    function renderAll(){
        const co = currentMode==='bus'? currentCompany : modeCompanyMap[currentMode];
        infoRoute.textContent = currentRoute;
        refreshDirectionLabels();
        // 方向文字：重鐵/輕鐵顯示「往 [終點站]」，其他顯示去程/回程
        let dirText;
        if(currentMode==='mtr'||currentMode==='lrt'){
            const tt = staticTimetables[co]?.[currentRoute];
            const d = destForDir(tt, currentDirection);
            dirText = `${getText('towards')} ${stripLang(d)||(currentDirection==='outbound'?getText('outbound'):getText('inbound'))}`;
        } else {
            dirText = currentDirection==='outbound'? getText('outbound'):getText('inbound');
        }
        const modeText = {bus:getText('m_bus'),gmb:getText('m_gmb'),mtr:getText('m_mtr'),lrt:getText('m_lrt')}[currentMode];
        infoDirection.textContent = `${modeText} · ${dirText}`;
        updateBannerStyle();
        renderServiceAlert();
        // ===== 主內容區：依模式與頁簽渲染 =====
        if(currentMode==='bus'||currentMode==='gmb'){
            // ★ 巴士 / 小巴：主功能改為「附近車站」（取代沿站即時到站列表）。
            //   以目前路線的起點站為中心，列出本站途經路線 + 半徑內附近其他車站；
            //   每條路線行右側有「即時到站」按鈕，按下即顯示該路線的沿站實時到站。
            // 顯式同步頁簽面板顯隱（panel-nearby / panel-eta 初始帶 hidden，須由 switchTab 開啟）。
            switchTab(currentTab==='eta' ? 'eta' : 'nearby');
            if(currentTab==='nearby'){
                if(activeRouteData){
                    if(!_nbCenter){ _nbCenter = defaultNearbyCenter(); }
                    if(_nbCenter){
                        const el=nearbyPageElements();
                        if(el.centerName && _nbCenter.name)el.centerName.textContent=`· ${_nbCenter.name}`;
                        if(el.radius && !el.radius.value)el.radius.value=String(_nbRadius);
                        renderNearbyPage(_nbCenter.stopId);
                    }
                }
            }
            else if(currentTab==='timetable')renderTimetable();
            else if(currentTab==='alerts')renderAlerts();
            // 「附近車站」為預設主視覺；但當使用者按下某路線「即時到站」按鈕
            // （switchRouteToLive → switchTab('eta')）時，需改為顯示該路線的沿站 ETA。
            if(currentTab==='eta' && activeRouteData){
                panelEta.style.display='flex';
                renderEtaList();
            } else {
                panelEta.style.display='none';
            }
        } else {
            // ★ 港鐵 / 輕鐵：保留「沿站即時到站」ETA 面板。
            if(currentTab==='timetable')renderTimetable();
            else if(currentTab==='alerts')renderAlerts();
            panelEta.style.display='flex';
            if(activeRouteData)renderEtaList();
        }
        lastSync.textContent = new Date().toLocaleTimeString();
        syncDot.className='w-2 h-2 rounded-full bg-emerald-500';
    }

    async function loadBusData(){
        if(isFetching)return;
        isFetching=true; syncDot.className='w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        stopsContainer.innerHTML=`<div class="p-8 text-center text-slate-400 text-sm"><i class="fa-solid fa-spinner animate-spin text-blue-500 mr-1.5"></i> ${getText('loading')}</div>`;
        _nbCenter=null; // 路線切換 → 附近車站頁面重對準新路線起點
        try{ await loadRouteData(); }catch(e){ console.error(e); }
        isFetching=false; renderAll();
    }

    /* ==================== 全自動更新：秒級倒數 + 背景 API 同步 ==================== */
    // 判斷 ETA 面板是否真正可見（不被頁簽/模式隱藏），避免在背景持續打 API 浪費配額
    function isEtaVisible(){
        return panelEta && panelEta.style.display!=='none' && !panelEta.classList.contains('hidden');
    }
    // ★ 計時器防洩漏：每次 startAutoRefresh 遞增版本號，進行中的 async 回呼若版本不符即中止，
    //   避免「切換模式 / 重啟 timer」時，舊的 await loadRouteData()（慢 API / 離線）形成永不釋放的閉包鏈。
    let _syncVersion = 0, _syncInFlight = false;
    function startAutoRefresh(){
        stopAutoRefresh();
        _syncVersion++;                                    // 令所有舊回呼失效
        const myVersion = _syncVersion;
        // 每秒：本地倒數（重繪燈號/文字）—— 僅 ETA 面板可見時才執行，節省 CPU
        localClockTimer = setInterval(()=>{
            if(myVersion!==_syncVersion)return;            // 版本過期 → 不執行
            if(!activeRouteData || !isEtaVisible())return;
            updateLiveCountdowns();
        }, 1000);
        // 每 20 秒：背景重新拉取 API 同步。僅在 ETA 面板可見時才發請求，
        // 避免巴士/小巴在「附近車站」頁簽下仍持續打 API。
        const needsSync = ()=>currentMode==='mtr'||currentMode==='lrt'||(isEtaVisible()&&(currentMode==='bus'||currentMode==='gmb'));
        if(needsSync()){
            apiSyncTimer = setInterval(async()=>{
                if(myVersion!==_syncVersion)return;         // 版本過期 → 丟棄此次排程
                if(!activeRouteData || !isEtaVisible())return;
                if(_syncInFlight)return;                   // 互斥鎖：上次同步未完成則跳過，不堆疊
                _syncInFlight=true;
                try{ await loadRouteData(); }catch(e){}
                // 重繪前再檢查一次版本（await 期間可能已切換模式）
                if(myVersion===_syncVersion && activeRouteData && isEtaVisible()){ try{ renderEtaList(); }catch(e){} }
                _syncInFlight=false;
            }, 20000);
        }
        // 即時時鐘（頂部），單一 timer 由 clockTimer 管理，確保 reset 時不會累積多個 interval
        clockTimer = setInterval(()=>{ if(myVersion!==_syncVersion)return; updateClock(); }, 1000);
    }
    function stopAutoRefresh(){ _syncVersion++; clearInterval(localClockTimer); clearInterval(apiSyncTimer); clearInterval(clockTimer); localClockTimer=null; apiSyncTimer=null; clockTimer=null; }
    // 切換模式/頁簽後呼叫，確保計時器與目前可見狀態一致（解決「切換模式計時器堆積/殘留」問題）
    function resetAutoRefresh(){ startAutoRefresh(); }

    function updateLiveCountdowns(){
        // 僅在「沿站即時到站」面板可見時倒數（巴士/小巴、港鐵、輕鐵均適用）
        if(panelEta.style.display==='none')return;
        // 就地更新每列的 eta-val，避免整頁重繪閃爍。
        // 關鍵修正：當該列的原始 eta 已過期（m<0），整列重新渲染以切換到下一班車，
        // 避免畫面卡在舊的時刻（如 21:18）而遺失「XX 分鐘」顯示。
        let needsRerender=false;
        document.querySelectorAll('#stops-container [data-eta-time]').forEach(el=>{
            const iso=el.getAttribute('data-eta-time'); const m=calcMins(iso);
            if(m<0){ needsRerender=true; return; }
            const valEl=el.querySelector('.eta-val');
            if(valEl && valEl.textContent!==String(m)){ valEl.textContent=m; }
        });
        if(needsRerender && activeRouteData) renderEtaList();
    }

    /* ==================== 初始化 ==================== */
    function init(){
        initTheme();
        updateClock();  // 時鐘由 startAutoRefresh() 統一管理（clockTimer），避免重複 setInterval 累積
        applyTranslations(); updateBannerStyle();
        // ★ 初始化時即查詢瀏覽器定位權限狀態，讓按鈕即時反映 granted/denied/prompt
        //   （非阻塞：失敗/不支援時退化為 'unknown'，不影響後續定位流程）
        reflectPermissionOnButton();
        // ★ 修復：await 權限查詢完成，確保首次按鈕外觀（綠/紅/琥珀）在頁面載入時就正確，
        //   避免「granted 狀態下按鈕仍顯示 prompt」的 UI 不一致。
        //   同時監聽權限變化（使用者日後在網址列解除/授予），UI 即時同步。
        refreshGpsPermission().then((perm)=>{
            // ★ 修復：若已授權，預先暖機座標池（getAllKmbStops），
            //   讓首次定位不必再等待全港站表下載，秒出最近站。
            if(perm==='granted' && currentMode==='bus' && (!window.__etaDebug||!window.__etaDebug.stopDataCacheSize||window.__etaDebug.stopDataCacheSize()<10)){
                getAllKmbStops().then(()=>{ /* 暖機完成，不阻塞 */ }).catch(()=>{});
            }
        });
        // ★ 修復：監聽權限狀態變化（Permissions API change 事件已在 queryGeolocationPermission 內綁定，
        //   此處再加一層 visibilitychange —— 使用者在其他分頁/網址列改變權限後回到本頁時刷新，
        //   解決「回來時按鈕狀態沒更新」的邊界問題）
        document.addEventListener('visibilitychange', ()=>{
            if(!document.hidden) refreshGpsPermission();
        });
        setMode('bus');

        themeToggle.addEventListener('click',toggleTheme);
        langSelect.addEventListener('change',e=>{ currentLang=e.target.value; applyTranslations(); renderAll(); });

        companySelect.addEventListener('change',e=>{ currentCompany=e.target.value; routeInput.value=currentCompany==='KMB'?'1A':(currentCompany==='CTB'?'720':'E33'); loadBusData(); });

        document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{ setMode(b.dataset.mode); loadBusData(); }));

        searchBtn.addEventListener('click',()=>{ currentRoute=routeInput.value.trim().toUpperCase(); loadBusData(); });
        routeInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); searchBtn.click();} });

        document.querySelectorAll('.dir-btn').forEach(b=>b.addEventListener('click',e=>{
            currentDirection=e.target.closest('.dir-btn').dataset.dir;
            document.querySelectorAll('.dir-btn').forEach(x=>{
                const on=x.dataset.dir===currentDirection;
                x.className=`dir-btn py-2.5 px-3 text-sm rounded-xl font-medium transition text-left flex justify-between items-center ${on?'bg-blue-600 text-white shadow-sm':'bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600'}`;
            });
            loadBusData();
        }));

        tabBtnNearby.addEventListener('click',()=>{ switchTab('nearby'); resetAutoRefresh(); });
        tabBtnTimetable.addEventListener('click',()=>{ switchTab('timetable'); });
        tabBtnAlerts.addEventListener('click',()=>{ switchTab('alerts'); renderAlerts(); });

        modalCloseBtn.addEventListener('click',()=>{ closeInlineLivePanel(); stopModal.classList.add('hidden'); });
        stopModal.addEventListener('click',e=>{
            // 點擊遮罩（非面板內容）→ 關閉 modal 並清理內嵌即時到站面板（停止倒數）
            if(e.target===stopModal){ closeInlineLivePanel(); stopModal.classList.add('hidden'); }
        });
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape'){
                // ★ ESC：優先關閉內嵌即時到站面板；面板不存在時才關閉整個 modal
                if(_inlineState){ closeInlineLivePanel(); return; }
                stopModal.classList.add('hidden'); return;
            }
            // 快捷鍵："/" 聚焦路線搜尋框（不在輸入狀態時）
            const tag=(e.target && e.target.tagName)||'';
            const inField = /INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable);
            if(!inField && (e.key==='/' || e.key==='?')){
                const ri=$('route-input'); if(ri){ e.preventDefault(); ri.focus(); ri.select(); }
            }
        });

        // 事件委派：附近車站功能內，點擊「線路區」按鈕的行為。
        //   · .route-live-btn（巴士/小巴）：跳轉到該路線的沿站即時到站功能。
        //   · .route-detail-btn / .route-live-btn（港鐵/輕鐵）：就地展開該路線在此站的即時明細。
        function onRouteButtonClick(btn){
            const route=btn.getAttribute('data-route')||'';
            if(!route)return;
            const co=btn.getAttribute('data-co')||'';
            const stopId=btn.getAttribute('data-stop-id')||'';
            const isRail=(currentMode==='mtr'||currentMode==='lrt');
            if(isRail){
                // 港鐵/輕鐵：就地展開此站即時明細
                toggleRouteDetail(btn);
            } else {
                // ★ 巴士/小巴：就地展開對應線路的沿站實時到站（在附近車站區顯示）
                openInlineLiveAtMain(route, co, stopId);
            }
        }
        // 判斷某個 route-row 所屬的模式（讀取行內 data-co，無則用 currentMode）
        function rowMode(row){
            const rco=row.getAttribute('data-co')||'';
            if(rco==='GMB')return 'gmb';
            if(rco==='MTR'||rco==='LRT')return rco.toLowerCase();
            return currentMode; // bus 沿用目前模式
        }
        // 點擊「線路區」的行為：
        //   · 巴士 / 小巴 → 就地展開「對應線路的沿站實時到站」（起點/中途/終點時間燈號 + 秒級倒數），
        //     不再切換整個主畫面，即在原位置顯示該線路的即時到站。
        //   · 港鐵 / 輕鐵 → 就地展開此站在該線路的即時明細（toggleRouteDetail）。
        // （點擊整行或行內「即時到站」按鈕，行為一致）
        function handleRouteRowClick(e, root){
            const btn=e.target.closest('.route-live-btn, .route-detail-btn');
            let target=btn;
            if(!target){
                const row=e.target.closest('.route-row');
                if(row && !e.target.closest('button'))target=row;
            }
            if(!target)return;
            e.preventDefault();
            const route=target.getAttribute('data-route')||'';
            const co=target.getAttribute('data-co')||'';
            const stopId=target.getAttribute('data-stop-id')||'';
            const mode=(target.classList.contains('route-row')?rowMode(target):(co==='MTR'||co==='LRT'?co.toLowerCase():(currentMode)));
            if(mode==='mtr'||mode==='lrt'){
                toggleRouteDetail(target);
            } else {
                // ★ 巴士 / 小巴：就地顯示對應線路的實時到站（不再 switchRouteToLive 跳走）
                openInlineLiveAtMain(route, co, stopId);
            }
        }
        stopModal.addEventListener('click',e=>{ handleRouteRowClick(e, stopModal); });
        // 內嵌「附近車站」頁面：同上
        $('nearby-page').addEventListener('click',e=>{ handleRouteRowClick(e, $('nearby-page')); });

        // 點擊路線行：內嵌展開/收合該路線的即時到站預覽
        function onRowPreview(row){
            const route=row.getAttribute('data-route')||'';
            const co=row.getAttribute('data-co')||'';
            const stopId=row.getAttribute('data-stop-id')||'';
            toggleInlinePreview(route, co, stopId, row);
        }

        // 切換搜尋半徑 → 即時重算附近站（抽屜）
        nearbyRadius.addEventListener('change',()=>{
            _nearbyRadius=parseInt(nearbyRadius.value,10)||350;
            if(_lastNearby){ loadNearbyData(_lastNearby.stopId, _lastNearby.seq); }
        });

        // 附近車站頁面：半徑切換 / 重新整理
        const nb=nearbyPageElements();
        if(nb.radius)nb.radius.addEventListener('change',()=>{
            // 每次從 DOM 重新讀取，避免元素被重建後閉包持有舊參照
            const fresh=$(nb.radius.id)||nb.radius;
            _nbRadius=parseInt(fresh.value,10)||350;
            if(_nbCenter){ renderNearbyPage(_nbCenter.stopId); }
        });
        if(nb.refreshBtn)nb.refreshBtn.addEventListener('click',()=>{
            if(_nbCenter){ renderNearbyPage(_nbCenter.stopId); }
        });

        // GPS 定位最近站：點擊在「單次定位」與「持續跟隨」之間切換
        const gpsBtn=$('gps-locate-btn');
        if(gpsBtn){
            gpsBtn.addEventListener('click',async()=>{
                // ★ 修復：防連點鎖。快速雙擊會導致多次 getCurrentPosition + watchPosition 疊加，
                //   造成「一個按鈕對應多個原生 watch」而無法正確清除的洩漏。
                //   這裡以 _gpsState.locating / watchId 為單一來源，確保同一時間只有一個定位流程。
                if(_gpsState.locating){ return; }
                if(_gpsState.watchId!=null){
                    gpsStopWatching();
                    showGpsBanner('ok',`<i class="fa-solid fa-circle-check"></i> ${getText('gps_live_off')}`);
                    return;
                }
                // 首次先做一次單次定位；若成功且使用者想持續跟隨，改由 watch 接管
                if(!isGpsSupported()){
                    showGpsBanner('error',`<i class="fa-solid fa-ban"></i> ${getText('gps_unsupported')}`);
                    return;
                }
                // ★ 權限前置檢查：先確認目前權限狀態，拒絕時給出清晰引導
                const perm = await refreshGpsPermission();
                if(perm==='denied'){
                    // ★ 修復：拒絕時不只顯示一行文字，而是附上「如何解鎖」的具體步驟
                    //   （點擊網址列 🔒 → 允許 → 重載），並保持按鈕可點擊，
                    //   讓使用者在解除封鎖後可直接重試，不必重開整頁。
                    showGpsBanner('error',
                        `<i class="fa-solid fa-location-slash"></i> ${getText('gps_perm_denied')}<br>
                         <span class="opacity-80">${getText('gps_denied_hint')}</span>`);
                    reflectPermissionOnButton();
                    setGpsButtonState('idle'); _gpsState.locating=false;  // ★ 解除 disabled，允許重試
                    return;
                }
                setGpsButtonState('locating');
                navigator.geolocation.getCurrentPosition(
                    (pos)=>{ _gpsState.locating=false; reflectPermissionOnButton(); handleGpsPosition(pos); gpsStartWatching(); },
                    (err)=>{ _gpsState.locating=false; handleGpsError(err); },
                    { enableHighAccuracy:true, timeout:15000, maximumAge:5000 }
                );
            });
        }

        loadBusData();
        startAutoRefresh();
    }

    function initTheme(){
        const saved=localStorage.getItem('theme');
        if(saved)applyTheme(saved);
        else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)applyTheme('dark');
        else applyTheme('light');
    }

    // 範例：外部可注入動態，例如 fetch('/api/today-alerts').then(r=>todayAlerts=r)
    window.setTodayAlerts = function(a){ todayAlerts=Object.assign({cancelled:[],new:[],diverted:[],modified:[],weather:[],resumed:[]},a); if(currentTab==='alerts')renderAlerts(); renderServiceAlert(); };

    document.addEventListener('DOMContentLoaded',init);
    </script>
