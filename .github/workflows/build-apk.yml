name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    # 【升级1】强制开启 Debug 模式 + 强制锁定 Node.js 版本
    env:
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true 

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 【升级2】安装 Java 和 Android SDK（Capacitor 打包 APK 必需）
      - name: Setup Java and Android SDK
        run: |
          # 安装 OpenJDK 17 (Capacitor 推荐版本)
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          
          # 设置 Java 环境变量
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/android-sdk/platform-tools" >> $GITHUB_ENV
          
          # 安装 Android SDK 命令行工具
          mkdir -p /usr/local/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d /usr/local/android-sdk/cmdline-tools/
          mv /usr/local/android-sdk/cmdline-tools/cmdline-tools /usr/local/android-sdk/cmdline-tools/latest
          
          # 接受许可协议并安装必要的 SDK 组件
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Install dependencies and sync
        run: |
          npm install
          npm install @capacitor/android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
