name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 1. 修复依赖冲突并安装
      - name: Install dependencies and sync
        run: |
          # 强制移除旧文件
          rm -rf package-lock.json node_modules
          
          # 使用 --legacy-peer-deps 解决 Capacitor 版本冲突
          npm install --legacy-peer-deps
          
          # 确保 Android 平台已添加
          npx cap add android
          npx cap sync android

      # 2. 设置最低 Android 版本 (Android 6.0)
      - name: Set minimum Android SDK version
        run: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          echo "--- 验证修改结果 ---"
          grep minSdkVersion android/app/build.gradle

      # 【新增关键步骤】修复 Gradle 报错：自动创建缺失的 settings.gradle
      - name: Fix Gradle rootProject error
        run: |
          echo "include ':app'" > android/settings.gradle
          echo "Root Project fixed."

      # 3. 打包 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 4. 上传生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
