name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 一键配置 Java + Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 清理可能卡住的锁
      - name: Fix potential lock issues
        run: |
          sudo rm -f /var/lib/dpkg/lock-frontend
          sudo rm -f /var/lib/dpkg/lock
          sudo dpkg --configure -a

      - name: Install dependencies and sync
        run: |
          npm install
          npm install @capacitor/android@^5.0.0
          npx cap add android
          npx cap sync android

      # 【核心】强制设置最低 Android 版本为 23 (Android 6.0)
      - name: Set minimum Android SDK version
        run: |
          # minSdkVersion 23 = Android 6.0 Marshmallow
          # 你可以改成 21 (Android 5.0) 或 24 等任意版本
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          echo "--- 验证修改结果 ---"
          grep minSdkVersion android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
