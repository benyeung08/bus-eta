name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设定 Java 17 环境 (Capacitor 5/6 推荐)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设定 Node.js 18 (稳定的 LTS 版本)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 4. 设定国内镜像源 (防止 Gradle 和 npm 下载超时)
      - name: Configure mirrors
        env:
          MAVEN_REPO: https://maven.aliyun.com/repository/google
        run: |
          echo "MAVEN_REPO=$MAVEN_REPO" >> $GITHUB_ENV
          npm config set registry https://registry.npmmirror.com

      # 5. 安装依赖与同步 Capacitor
      - name: Install dependencies and sync
        run: |
          npm install
          npx cap sync android

      # 6. 编译 APK (包含强制赋予 gradlew 权限 和 增加记忆体上限)
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

      # 7. 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
