name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（确保获取完整历史，避免子模块问题）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设定 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设定 Node.js 18
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 4. 设定国内镜像源（加速依赖下载）
      - name: Configure mirrors
        env:
          MAVEN_REPO: https://maven.aliyun.com/repository/google
        run: |
          echo "MAVEN_REPO=$MAVEN_REPO" >> $GITHUB_ENV
          npm config set registry https://registry.npmmirror.com
          npm config set ELECTRON_MIRROR https://npmmirror.com/mirrors/electron/
          npm config set CHROMEDRIVER_CDNURL https://npmmirror.com/mirrors/chromedriver/

      # 5. 清理可能存在的损坏依赖
      - name: Clean environment
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          echo "Cleaned old dependencies."

      # 6. 安装依赖（增加超时容忍度）
      - name: Install dependencies
        run: npm install --legacy-peer-deps --network-timeout 120000

      # 7. 自动打包 Web 代码到 www 文件夹（如无前端框架可删除此步）
      - name: Build web assets
        run: npm run build || true

      # 8. 同步 Capacitor 到 Android 项目
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. 编译 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

      # 10. 上传 APK 作为构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
