name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 1. 安装依赖（忽略版本冲突）
      - name: Install dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install --legacy-peer-deps

      # 2. 添加 Android 平台并同步（先清理旧文件夹，避免冲突）
      - name: Add Android platform and sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # 3. 设置最低 Android 版本 (Android 6.0)
      - name: Set minimum SDK version
        run: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          echo "--- 验证修改 ---"
          grep minSdkVersion android/app/build.gradle

      # 4. 强制修复 settings.gradle（防止 Gradle 初始化报错）
      - name: Force fix settings.gradle
        run: |
          echo "include ':app'" > android/settings.gradle
          echo "include ':capacitor-android'" >> android/settings.gradle
          echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> android/settings.gradle
          echo "--- 验证文件内容 ---"
          cat android/settings.gradle

      # 5. 打包 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
