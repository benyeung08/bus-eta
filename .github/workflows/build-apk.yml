name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 1. 安装依赖（忽略版本冲突）
      - name: Install dependencies
        run: |
          rm -rf package-lock.json node_modules
          npm install --legacy-peer-deps

      # 2. 添加 Android 平台并同步（强制覆盖）
      - name: Add Android platform and sync
        run: |
          npx cap add android --force
          npx cap sync android

      # 3. 设置最低 Android 版本 (Android 6.0)
      - name: Set minimum SDK version
        run: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          echo "--- 验证修改 ---"
          grep minSdkVersion android/app/build.gradle

      # 4. 修复 Gradle 配置（防止 settings.gradle 缺失）
      - name: Fix Gradle configuration
        run: |
          if [ ! -f android/settings.gradle ]; then
            echo "include ':app'" > android/settings.gradle
            echo "Settings.gradle created."
          else
            echo "Settings.gradle already exists."
          fi

      # 5. 打包 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
