name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设定 Java 17 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 设定 Node.js 18
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 4. 设定国内镜像源
      - name: Configure mirrors
        env:
          MAVEN_REPO: https://maven.aliyun.com/repository/google
        run: |
          echo "MAVEN_REPO=$MAVEN_REPO" >> $GITHUB_ENV
          npm config set registry https://registry.npmmirror.com

      # 5. 安装依赖
      - name: Install dependencies
        run: npm install

      # 6. 自动打包 Web 代码到 www 文件夹
      - name: Build web assets
        run: npm run build

      # 7. 同步 Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 8. 编译 APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

      # 9. 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
