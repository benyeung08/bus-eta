<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士實時 ETA 系統 | Hong Kong Bus ETA System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        html.dark ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blink-warning {
            animation: blink 0.5s ease-in-out infinite;
        }
        
        .arrived-status {
            background: linear-gradient(135deg, #39FF14 0%, #00CC00 100%);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }
        
        .arrived-terminal-status {
            background: linear-gradient(135deg, #FF8C00 0%, #FF4500 100%);
            box-shadow: 0 0 8px rgba(255, 69, 0, 0.6);
        }

        .arrived-loop-status {
            background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.6);
        }

        .terminal-badge {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }

        .error-row {
            background-color: #fef2f2;
            color: #dc2626;
        }
        .dark .error-row {
            background-color: rgba(220, 38, 38, 0.1);
            color: #f87171;
        }

        body, section, div, button, select, input {
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col text-slate-800 dark:bg-slate-900 dark:text-slate-200">
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側篩選面板 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 h-fit dark:bg-slate-800 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2 dark:border-slate-700">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2 dark:text-slate-200">
                    <i class="fa-solid fa-sliders text-blue-500"></i> <span data-lang="filter">路線篩選</span>
                </h2>
                <div class="flex items-center gap-2">
                    <button type="button" id="theme-toggle" aria-label="Toggle theme" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
                        <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                    </button>
                    <select id="lang-select" aria-label="Language Select" class="text-xs font-mono bg-slate-100 border border-slate-200 rounded-md px-2 py-1 focus:ring-2 focus:ring-blue-500 outline-none dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <option value="zh-Hant">繁中</option>
                        <option value="zh-Hans">簡中</option>
                        <option value="en">EN</option>
                    </select>
                    <span class="text-xs font-mono bg-slate-900 text-white px-2.5 py-1 rounded-md border border-slate-800 dark:bg-slate-950" id="live-clock">00:00:00</span>
                </div>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="company">巴士公司</label>
                    <select id="company-select" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <option value="KMB">九巴 KMB</option>
                        <option value="CTB">城巴 CTB</option>
                        <option value="LWB">龍運 LWB</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="route">輸入路線</label>
                    <div class="relative">
                        <input type="text" id="route-input" value="1A" placeholder="e.g. 1A, 720, S1" class="w-full p-2.5 pl-3 pr-10 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-bold tracking-wide transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                        <button type="button" id="search-btn" aria-label="Search Route" class="absolute right-2 top-2 w-8 h-8 rounded-lg bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center transition shadow-sm">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 dark:text-slate-400" data-lang="direction">行車方向</label>
                    <div class="grid grid-cols-1 gap-2" id="direction-container">
                        <button type="button" id="dir-outbound" data-dir="outbound" class="dir-btn py-2.5 px-3 bg-blue-600 text-white text-sm rounded-xl font-medium shadow-sm transition text-left flex justify-between items-center">
                            <span data-lang="outbound">去程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-70"></i>
                        </button>
                        <button type="button" id="dir-inbound" data-dir="inbound" class="dir-btn py-2.5 px-3 bg-slate-100 text-slate-600 text-sm rounded-xl font-medium hover:bg-slate-200 transition text-left flex justify-between items-center dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                            <span data-lang="inbound">回程</span> <i class="fa-solid fa-circle-chevron-right text-xs opacity-30"></i>
                        </button>
                    </div>
                </div>

                <!-- 天氣影響提示卡片 -->
                <div id="weather-alert-card" class="p-3 bg-amber-50 border border-amber-200 rounded-xl dark:bg-amber-900/30 dark:border-amber-800 text-xs hidden">
                    <div class="flex items-center gap-2 font-bold text-amber-800 dark:text-amber-300 mb-1">
                        <i class="fa-solid fa-cloud-showers-heavy text-amber-500"></i>
                        <span id="weather-title">當日真實天氣影響班次通知</span>
                    </div>
                    <p id="weather-desc" class="text-amber-700 dark:text-amber-200 leading-tight">即時天氣影響：極端天氣防範措施生效中，班次調整約 5-15 分鐘。</p>
                </div>

                <div class="text-center pt-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-100 w-full justify-center shadow-inner dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-800">
                        <i class="fa-solid fa-bolt text-amber-500 animate-pulse text-[11px]"></i> <span data-lang="refresh">每日動態更新 & 秒級即時倒數</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- 右側數據顯示區域 -->
        <section class="md:col-span-2 flex flex-col gap-4">
            
            <div id="route-banner" class="bg-gradient-to-r from-red-600 to-red-700 text-white p-5 rounded-2xl shadow-sm flex justify-between items-center transition-all duration-300">
                <div class="min-w-0">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl font-black bg-white text-red-600 px-3 py-0.5 rounded-xl shadow-sm shrink-0" id="info-route">1A</span>
                        <h3 class="text-lg font-bold tracking-wide truncate" id="info-direction">Loading...</h3>
                    </div>
                    <p class="text-xs opacity-80 mt-2 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> <span data-lang="source">結合政府開放 API 與常規班次時間表</span></p>
                </div>
                <span class="bg-white/20 text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-sm shadow-inner uppercase tracking-wider shrink-0" id="company-badge">九巴 KMB</span>
            </div>

            <!-- 當日動態變動（改道、新增、取消路線/車站）通知面板 -->
            <div id="status-notice-panel" class="space-y-2 hidden">
                <!-- 每日更新公告將動態注入 -->
            </div>

            <div class="flex bg-slate-200 p-1 rounded-xl dark:bg-slate-700">
                <button type="button" id="tab-btn-eta" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2 dark:bg-slate-800 dark:text-blue-400">
                    <i class="fa-solid fa-stopwatch"></i> <span data-lang="eta_tab">實時到站時間</span>
                </button>
                <button type="button" id="tab-btn-timetable" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2 dark:text-slate-400 dark:hover:text-white">
                    <i class="fa-solid fa-calendar-days"></i> <span data-lang="tt_tab">班次時間表</span>
                </button>
            </div>

            <!-- ETA 列表頁簽 -->
            <div id="panel-eta" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow flex flex-col dark:bg-slate-800 dark:border-slate-700">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider grid grid-cols-12 dark:bg-slate-700/50 dark:text-slate-400 dark:border-slate-700">
                    <div class="col-span-1 text-center" data-lang="col_seq">#</div>
                    <div class="col-span-6" data-lang="col_stop">巴士分站名稱</div>
                    <div class="col-span-5 text-right" data-lang="col_time">預計到站時間 / 班次時刻</div>
                </div>
                <div id="stops-container" class="divide-y divide-slate-100 max-h-[55vh] overflow-y-auto flex-grow dark:divide-slate-700">
                </div>
            </div>

            <!-- 時間表頁簽 -->
            <div id="panel-timetable" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-grow hidden p-5 dark:bg-slate-800 dark:border-slate-700">
                <div id="timetable-container" class="space-y-6 max-h-[55vh] overflow-y-auto pr-1">
                </div>
            </div>

        </section>
    </main>

    <!-- 同站路線彈出式 Modal -->
    <div id="stop-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4 transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-xl w-full max-h-[85vh] flex flex-col border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-700/50">
                <div>
                    <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider block" data-lang="same_stop_title">同站全部路線 ETA</span>
                    <h3 id="modal-stop-name" class="text-lg font-black text-slate-800 dark:text-slate-100 mt-0.5">--</h3>
                </div>
                <button type="button" id="modal-close-btn" aria-label="Close modal" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-500 flex items-center justify-center transition cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-content" class="p-4 overflow-y-auto space-y-3 flex-grow">
            </div>
        </div>
    </div>

        async function mapWithConcurrency(items, limit, fn) {
            if (!items || items.length === 0) return [];
            const results = new Array(items.length);
            let index = 0;
            const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
                while (index < items.length) {
                    const currentIndex = index++;
                    try {
                        results[currentIndex] = await fn(items[currentIndex], currentIndex);
                    } catch (e) {
                        console.error("Worker error:", e);
                        results[currentIndex] = {
                            seq: currentIndex + 1,
                            stopId: items[currentIndex]?.stop || '',
                            name: getText('stop_load_error'),
                            etaList: [],
                            isSecondLast: false,
                            isEndTerminal: false
                        };
                    }
                }
            });
            await Promise.all(workers);
            return results;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function applyTheme(theme) {
            isDarkMode = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDarkMode);
            themeIcon.className = isDarkMode ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            applyTheme(isDarkMode ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                applyTheme(savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        }

        async function fetchDailyLineStatusUpdates() {
            try {
                // 1. 抓取香港天文台警告與天氣數據 (影響真實天氣班次調整)
                const weatherRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                if (weatherRes.ok) {
                    const weatherData = await weatherRes.json();
                    let hasSevereWeather = false;
                    if (weatherData && Object.keys(weatherData).length > 0) {
                        hasSevereWeather = true;
                        weatherAdjustmentFactor = 1.35; // 天氣惡劣時班次增加約35%延誤
                        weatherAlertCard.classList.remove('hidden');
                        document.getElementById('weather-title').textContent = "特別天氣營運提示";
                        document.getElementById('weather-desc').textContent = "受最新天氣警告影響，行車速度已作調整，班次與到站時間可能相應擴大。";
                    } else {
                        weatherAdjustmentFactor = 1.0;
                        weatherAlertCard.classList.add('hidden');
                    }
                }

                // 2. 獲取當日特別交通通告及動態變動 (改道/取消/新增路線車站)
                const noticeRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/special-announcement');
                dynamicNoticeList = [];
                if (noticeRes.ok) {
                    const noticeData = await noticeRes.json();
                    if (noticeData && noticeData.data) {
                        dynamicNoticeList = noticeData.data;
                    }
                }

                // 渲染當日特別狀態卡片
                renderNoticePanel();
            } catch (err) {
                console.warn("Daily updates fetch warning:", err);
            }
        }

        function renderNoticePanel() {
            noticePanel.innerHTML = '';

            // 包含當日取消、新增、臨時改道與修改之測試說明展示

            // 特別模擬條件(若開放API無即時特別消息時備用顯示)
            if (filteredNotices.length === 0) {
                mockDynamicUpdates.push({
                    type: 'divert',

                });

            filteredNotices.forEach(notice => {

                    type: 'general',
                    tag: '當日服務調整',

        function updateLocalCountdowns() {
            const minUnit = getText('min');
            const etaItems = document.querySelectorAll('[data-eta-time]');
            
            etaItems.forEach(el => {
                const timestamp = el.getAttribute('data-eta-time');
                const isPrimary = el.getAttribute('data-is-primary') === 'true';
                const mins = calculateMinutesLeft(timestamp);
                
                if (mins < 0) return;

                const timeValEl = el.querySelector('.eta-val');
                if (timeValEl) {
                    timeValEl.textContent = mins;
                }

                if (isPrimary && mins <= 1) {
                    if (timeValEl) timeValEl.className = "eta-val text-xl font-black text-emerald-600 dark:text-emerald-400";
                }
            });
        }

        function calculateMinutesLeft(etaTimestamp) {
            if (!etaTimestamp) return -1;
            const date = new Date(etaTimestamp);
            if (isNaN(date.getTime())) return -1;
            const diffMs = date.getTime() - Date.now();
            if (diffMs < -60000) return -1;
            let diffMins = Math.ceil(diffMs / 60000);
            
            // 套用真實天氣調整影響
            if (weatherAdjustmentFactor > 1.0 && diffMins > 0) {
                diffMins = Math.round(diffMins * weatherAdjustmentFactor);
            }

            return diffMins < 0 ? 0 : diffMins;
        }

        function formatTimeToHM(isoString) {
            if (!isoString) return "--:--";
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return "--:--";
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

            return etaObj.rmk_tc || '';
        }

        async function fetchKmbRouteStops(route) {
            try {
                const encoded = encodeURIComponent(route);
                const [outboundRes, inboundRes] = await Promise.all([
                    fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${encoded}/outbound/1`),
                    fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${encoded}/inbound/1`)
                ]);
                const outboundData = outboundRes.ok ? await outboundRes.json() : {};
                const inboundData = inboundRes.ok ? await inboundRes.json() : {};
                return {
                    outbound: outboundData.data || [],
                    inbound: inboundData.data || []
                };
            } catch {
                return { outbound: [], inbound: [] };
            }
        }

                if (!res.ok) return [];

        async function getKmbStopName(stopId) {
            if (!stopId) return getText('stop_load_error');
            const cacheKey = `kmb_${stopId}`;
            if (!stopDataCache.has(cacheKey)) {
                try {
                    const encoded = encodeURIComponent(stopId);
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${encoded}`);
                    if (res.ok) {
                        const data = (await res.json()).data;
                        if (data) stopDataCache.set(cacheKey, data);
                    }
                } catch {
                    return getText('stop_load_error');
                }
            }
            const data = stopDataCache.get(cacheKey);
            if (!data) return getText('stop_load_error');
            if (currentLang === 'zh-Hans') return data.name_sc || data.name_tc || getText('stop_load_error');
            if (currentLang === 'en') return data.name_en || data.name_tc || getText('stop_load_error');
            return data.name_tc || getText('stop_load_error');
        }

        async function loadSameStopDrawerData(stopId, seq, stopName, contentEl) {
            if (!stopId || !contentEl) return;
            contentEl.innerHTML = `
                <div class="col-span-full text-center py-4 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner animate-spin text-blue-500 mr-1.5"></i> ${getText('loading_stop_eta')}
                </div>
            `;

            try {
                const list = await fetchAllStopETA(stopId);

                if (list.length === 0) {
                    contentEl.innerHTML = `<div class="col-span-full text-center py-3 text-slate-400 text-xs">${getText('no_other_routes')}</div>`;
                    return;
                }

                const grouped = {};
                list.forEach(item => {
                    if (!item || !item.eta || !item.route) return;
                    const mins = calculateMinutesLeft(item.eta);
                    if (mins < 0) return;

                    let dest = item.dest_tc || '';
                    if (currentLang === 'zh-Hans') dest = item.dest_sc || item.dest_tc || '';
                    if (currentLang === 'en') dest = item.dest_en || item.dest_tc || '';
                    if (!dest.trim()) dest = getText('terminal');

                    const rawCo = item.co ? item.co.toUpperCase() : currentCompany;
                    const normalizedCo = rawCo === 'NWFB' ? 'CTB' : rawCo;

                    const groupKey = `${item.route}_${dest}`;
                    if (!grouped[groupKey]) {
                        grouped[groupKey] = {
                            route: item.route,
                            dest: dest,
                            co: normalizedCo,
                            etas: []
                        };
                    }

                    if (!grouped[groupKey].etas.some(e => e.eta === item.eta)) {
                        grouped[groupKey].etas.push({
                            eta: item.eta,
                            mins: mins,
                            rmk: getRmk(item)
                        });
                    }
                });

                const groupArray = Object.values(grouped);
                if (groupArray.length === 0) {
                    contentEl.innerHTML = `<div class="col-span-full text-center py-3 text-slate-400 text-xs">${getText('no_other_routes')}</div>`;
                    return;
                }

                groupArray.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true }));

                contentEl.innerHTML = "";
                const minUnit = getText('min');

                groupArray.forEach(group => {
                    group.etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                    const validEtas = group.etas;

                    const etasHTML = validEtas.map((e) => {
                        const timeStr = formatTimeToHM(e.eta);
                        let timeColor = "text-blue-600 dark:text-blue-400 font-bold";
                        if (e.mins <= 1) timeColor = "text-emerald-600 dark:text-emerald-400 font-black";
                        else if (e.mins <= 3) timeColor = "text-amber-600 dark:text-amber-400 font-bold";

                        return `<span data-eta-time="${e.eta}" class="inline-flex items-center gap-0.5"><span class="eta-val ${timeColor}">${e.mins}</span><span class="text-[10px] ${timeColor}">${minUnit}</span> <span class="text-[10px] text-slate-400 font-mono">(${timeStr})</span></span>`;
                    }).join('<span class="text-slate-300 dark:text-slate-600 mx-1">|</span>');

                    const card = document.createElement('div');
                    card.className = "p-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 flex items-center justify-between gap-2 shadow-2xs";

                    card.innerHTML = `
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-xs font-black px-2 py-0.5 rounded bg-blue-600 text-white dark:bg-blue-500 shrink-0">${escapeHtml(group.route)}</span>
                                <span class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate"><span class="text-[10px] text-slate-400 font-normal mr-0.5">${getText('to')}</span>${escapeHtml(group.dest)}</span>
                            </div>
                            <div class="text-xs font-mono flex items-center flex-wrap gap-y-0.5">
                                ${etasHTML}
                            </div>
                        </div>
                        <button type="button" data-route="${escapeHtml(group.route)}" data-co="${escapeHtml(group.co)}" class="btn-switch-route text-[11px] font-bold px-2 py-1 rounded bg-slate-100 hover:bg-blue-600 hover:text-white dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-blue-600 transition shrink-0 flex items-center gap-1 cursor-pointer">
                            <span>${getText('switch_route')}</span> <i class="fa-solid fa-chevron-right text-[9px]"></i>
                        </button>
                    `;
                    contentEl.appendChild(card);
                });

            } catch (err) {
                console.error("Error loading drawer same-stop ETAs:", err);
                contentEl.innerHTML = `<div class="col-span-full text-center py-3 text-red-500 text-xs">${getText('stop_load_error')}</div>`;
            }
        }

                    card.innerHTML = `
                        <div class="flex items-center justify-between gap-2">

                                <div class="min-w-0">
                                    <div class="flex items-center gap-1">
                                        <span class="text-xs text-slate-400 font-medium">${getText('to')}</span>
                                        <span class="text-sm font-bold text-slate-800 dark:text-slate-100 truncate">${escapeHtml(group.dest)}</span>

                                <button type="button" data-route="${escapeHtml(group.route)}" data-co="${escapeHtml(group.co)}" class="btn-switch-route text-xs font-bold px-2.5 py-1 rounded-lg bg-white text-blue-600 hover:bg-blue-600 hover:text-white dark:bg-slate-800 dark:text-blue-300 dark:hover:bg-blue-600 dark:hover:text-white transition flex items-center gap-1 border border-slate-200 dark:border-slate-600 cursor-pointer shadow-2xs">
                                    <i class="fa-solid fa-arrow-right-to-bracket text-[10px]"></i> ${getText('switch_route')}
                                </button>

                        <div class="flex items-center flex-wrap gap-2 pt-2 border-t border-slate-200/60 dark:border-slate-600/50">

                    modalContent.appendChild(card);

            } catch (err) {
                if (requestId !== modalRequestId || stopModal.classList.contains('hidden')) return;

        function switchToRoute(routeNum, companyCode) {
            closeStopModal();
            let matchedCo = companyCode ? companyCode.toUpperCase() : currentCompany;
            if (matchedCo === "NWFB") matchedCo = "CTB";
            if (matchedCo === "KMB" || matchedCo === "LWB" || matchedCo === "CTB") {
                companySelect.value = matchedCo;
                currentCompany = matchedCo;
            }
            routeInput.value = routeNum;
            loadBusData();
        }

        async function loadBusData() {
            const requestId = ++fetchRequestId;
            currentRoute = routeInput.value.trim().toUpperCase();
            if (!currentRoute) {
                alert(getText('search_error'));
                return;
            }

            isFetching = true;
            activeRouteData = null;
            updateBannerStyle();
            renderNoticePanel();
            infoDirection.textContent = getText('loading');
            stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch animate-spin text-2xl text-blue-500 mb-2"></i><p class="text-xs font-medium">${getText('loading')}</p></div>`;

            try {
                let fetchedData = null;
                if (currentCompany === "KMB" || currentCompany === "LWB") {
                    fetchedData = await fetchKmbRouteStops(currentRoute);
                } else if (currentCompany === "CTB") {
                    fetchedData = await fetchCtbRouteStops(currentRoute);
                }

                if (requestId !== fetchRequestId) return;

                if (!fetchedData || (fetchedData.outbound.length === 0 && fetchedData.inbound.length === 0)) {
                    throw new Error(getText('search_error'));
                }

                activeRouteData = fetchedData;

                if ((activeRouteData[currentDirection] || []).length === 0) {
                    const alternateDir = currentDirection === "outbound" ? "inbound" : "outbound";
                    if ((activeRouteData[alternateDir] || []).length > 0) {
                        currentDirection = alternateDir;
                    }
                }

                detectLoopRoute();
                updateDirectionLabels();
                updateDirectionButtons();
                await renderTabsContent();
                resetAutoRefresh();
            } catch (err) {
                if (requestId !== fetchRequestId) return;
                stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-exclamation text-2xl text-amber-500 mb-1"></i><p>${escapeHtml(err.message)}</p></div>`;
                timetableContainer.innerHTML = `<div class="text-center py-12 text-slate-400">${getText('no_schedule')}</div>`;
                infoDirection.textContent = getText('not_found');
            } finally {
                if (requestId === fetchRequestId) {
                    isFetching = false;
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'eta') {
                tabBtnEta.className = "flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2 dark:bg-slate-800 dark:text-blue-400";
                tabBtnTimetable.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2 dark:text-slate-400 dark:hover:text-white";
                panelEta.classList.remove('hidden');
                panelTimetable.classList.add('hidden');
                renderEtaList();
                resetAutoRefresh();
            } else {
                tabBtnTimetable.className = "flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-sm flex justify-center items-center gap-2 dark:bg-slate-800 dark:text-blue-400";
                tabBtnEta.className = "flex-1 py-2.5 text-sm font-medium rounded-lg transition text-slate-600 hover:text-slate-900 flex justify-center items-center gap-2 dark:text-slate-400 dark:hover:text-white";
                panelTimetable.classList.remove('hidden');
                panelEta.classList.add('hidden');
                renderTimetable();
                stopAutoRefresh();
            }
        }

        async function renderTabsContent() {
            if (currentTab === "eta") {
                await renderEtaList();
            } else {
                renderTimetable();
            }
        }

        async function renderEtaList(isSilent = false) {
            if (!activeRouteData) return;
            const thisRenderId = ++renderRequestId;
            const requestId = fetchRequestId;

            const stops = activeRouteData[currentDirection] || [];
            if (stops.length === 0) {
                stopsContainer.innerHTML = `<div class="text-center py-12 text-slate-400">${getText('no_data')}</div>`;
                return;
            }

            const totalStops = stops.length;
            const dirToken = currentDirection === "outbound" ? "O" : "I";

            let routeEtaBatch = [];
            if (currentCompany === "KMB" || currentCompany === "LWB") {
                routeEtaBatch = await fetchKmbRouteETA(currentRoute);
            }

            const rawRenderData = await mapWithConcurrency(stops, 6, async (stopObj, index) => {
                if (!stopObj) return null;
                const stopId = stopObj.stop;
                const seq = Number(stopObj.seq || (index + 1));
                const namePromise = currentCompany === "CTB" ? getCtbStopName(stopId) : getKmbStopName(stopId);
                
                let etaPromise;
                if (currentCompany === "KMB" || currentCompany === "LWB") {
                    let filtered = [];
                    if (routeEtaBatch && routeEtaBatch.length > 0) {
                        filtered = routeEtaBatch.filter(item => 
                            item && 
                            (item.stop === stopId || (item.dir === dirToken && Number(item.seq) === seq)) && 
                            (item.service_type == 1 || item.service_type === undefined)
                        );
                    }
                    if (filtered.length === 0) {
                        etaPromise = fetchKmbStopETA(stopId, currentRoute, dirToken);
                    } else {
                        etaPromise = Promise.resolve(filtered);
                    }
                } else {
                    etaPromise = fetchCtbSingleStopETA(stopId, currentRoute).then(list => {
                        return list.filter(item => {
                            if (!item) return false;
                            const matchDir = !item.dir || 
                                             item.dir === dirToken || 
                                             (dirToken === "O" && (item.dir === "outbound" || item.dir === "O")) || 
                                             (dirToken === "I" && (item.dir === "inbound" || item.dir === "I"));
                            if (!matchDir) return false;
                            if (item.seq !== undefined && item.seq !== null && item.seq !== "") {
                                return parseInt(item.seq) === seq || item.stop === stopId;
                            }
                            return true;
                        });
                    });
                }

                try {
                    const [name, etaList] = await Promise.all([namePromise, etaPromise]);
                    return {
                        seq,
                        stopId,
                        name: name || getText('stop_load_error'),
                        etaList: etaList || [],
                        isSecondLast: index === totalStops - 2,
                        isEndTerminal: index === totalStops - 1
                    };
                } catch {
                    return {
                        seq,
                        stopId,
                        name: getText('stop_load_error'),
                        etaList: [],
                        isSecondLast: index === totalStops - 2,
                        isEndTerminal: index === totalStops - 1
                    };
                }
            });

            if (requestId !== fetchRequestId || thisRenderId !== renderRequestId) return;

            const renderData = rawRenderData.filter(Boolean);
            renderData.sort((a, b) => a.seq - b.seq);

            if (renderData.length > 0) {
                const destName = renderData[renderData.length - 1].name;
                infoDirection.textContent = isLoopRoute 
                    ? `${getText('loop')} (${destName} ${getText('loop_point')})`
                    : `${getText('to')} ${destName}`;
            }

            if (!isSilent) {
                stopsContainer.innerHTML = "";
            }

            const minUnit = getText('min');

            renderData.forEach(item => {
                try {
                    let row = isSilent ? document.getElementById(`stop-row-${item.seq}`) : null;
                    if (!row) {
                        row = document.createElement('div');
                        row.id = `stop-row-${item.seq}`;
                    }

                    if (item.name === getText('stop_load_error')) row.classList.add('error-row');
                    row.className = `grid grid-cols-12 px-4 py-3.5 items-center hover:bg-slate-50 transition dark:hover:bg-slate-700/50`;

                    let etaHTML = `<span class="text-xs text-slate-400 dark:text-slate-500">${getText('no_data')}</span>`;
                    if (item.etaList && item.etaList.length > 0) {
                        const validEtaList = item.etaList
                            .filter(etaObj => etaObj && calculateMinutesLeft(etaObj.eta) >= 0)
                            .sort((a, b) => new Date(a.eta) - new Date(b.eta))
                            .slice(0, 3);

                        if (validEtaList.length > 0) {
                            etaHTML = validEtaList.map((etaObj, index) => {
                                if (!etaObj.eta) return "";
                                const mins = calculateMinutesLeft(etaObj.eta);
                                const timeStr = formatTimeToHM(etaObj.eta);
                                const rmkStr = getRmk(etaObj);
                                const rmk = rmkStr ? ` <span class="text-[10px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded font-normal dark:bg-slate-700 dark:text-slate-400">${escapeHtml(rmkStr)}</span>` : '';

                                if (index === 0) {
                                    if (item.seq === 1) {
                                        if (mins <= 5) {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-amber-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`}<span class="ml-2 text-amber-600 font-medium">(${getText('departs_in')})</span></div></div>`;
                                        } else {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div class="flex items-center gap-2"><span class="eta-val text-xl font-black text-emerald-600">${mins}</span><span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span><span class="text-[10px] terminal-badge text-white px-1.5 py-0.5 rounded">${getText('terminal')}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `Est. depart at ${timeStr}` : `預計開出 ${timeStr}`}</div></div>`;
                                        }
                                    }
                                    else if (isLoopRoute && item.isEndTerminal) {
                                        if (mins <= 1) {
                                            return `<div class="mb-1"><div class="flex items-center gap-2"><span class="text-sm font-bold text-white px-2 py-1 rounded blink-warning arrived-loop-status"><i class="fas fa-redo mr-1"></i>${getText('back_to_start')}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `循環時間 ${timeStr}`}<span class="ml-2 text-purple-600 font-medium">(${getText('looping')})</span></div></div>`;
                                        } else if (mins <= 3) {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-amber-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`}<span class="ml-2 text-amber-600 font-medium">(${getText('back_shortly')})</span></div></div>`;
                                        } else {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-emerald-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`} <span class="ml-2 text-blue-600 font-medium">(${getText('loop_point')})</span></div></div>`;
                                        }
                                    }
                                    else if (item.isEndTerminal) {
                                        if (mins <= 1) {
                                            return `<div class="mb-1"><div class="flex items-center gap-2"><span class="text-sm font-bold text-white px-2 py-1 rounded blink-warning arrived-terminal-status"><i class="fas fa-flag-checkered mr-1"></i>${getText('arrive_terminal')}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `抵達時間 ${timeStr}`}<span class="ml-2 text-orange-600 font-medium">(${getText('service_ends')})</span></div></div>`;
                                        } else if (mins <= 3) {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-amber-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`}<span class="ml-2 text-amber-600 font-medium">(${getText('arr_terminal_shortly')})</span></div></div>`;
                                        } else {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-emerald-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`} <span class="ml-2 text-amber-600 font-medium">(${getText('end_terminal')})</span></div></div>`;
                                        }
                                    }
                                    else {
                                        if (mins <= 1) {
                                            return `<div class="mb-1"><div class="flex items-center gap-2"><span class="text-sm font-bold text-white px-2 py-1 rounded blink-warning arrived-status"><i class="fas fa-bus mr-1"></i>${getText('arrived')}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `到站時間 ${timeStr}`}<span class="ml-2 text-emerald-600 font-medium">(${getText('boarding_now')})</span></div></div>`;
                                        } else if (mins <= 3) {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-amber-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`}<span class="ml-2 text-amber-600 font-medium">(${getText('arr_shortly')})</span></div></div>`;
                                        } else {
                                            return `<div class="mb-1" data-eta-time="${etaObj.eta}" data-is-primary="true"><div><span class="eta-val text-xl font-black text-emerald-600">${mins}</span> <span class="text-xs text-slate-400 font-medium dark:text-slate-500">${minUnit}</span>${rmk}</div><div class="text-[11px] text-slate-400 font-mono tracking-wide mt-0.5 dark:text-slate-500"><i class="fa-regular fa-clock text-[10px] mr-0.5"></i>${currentLang === 'en' ? `at ${timeStr}` : `預計 ${timeStr}`}</div></div>`;
                                        }
                                    }
                                } else {
                                    const timeClass = mins <= 5 ? "text-amber-600" : "text-slate-600 dark:text-slate-400";
                                    return `<div data-eta-time="${etaObj.eta}" class="inline-flex flex-col items-end text-right"><span class="text-xs ${timeClass} font-bold"><span class="eta-val">${mins}</span>${minUnit}</span><span class="text-[10px] text-slate-400 font-mono dark:text-slate-500">${timeStr}</span></div>`;
                                }
                            }).join('<span class="text-slate-300 mx-2 text-xs self-center dark:text-slate-600">|</span>');
                        }
                    }

                    if (!isSilent) {
                        row.innerHTML = `
                            <div class="col-span-1 text-center text-xs font-mono font-bold text-slate-400 dark:text-slate-500">
                                <span class="inline-block w-5 h-5 rounded-full bg-slate-100 leading-5 dark:bg-slate-700">${item.seq}</span>
                            </div>
                            <div class="col-span-6 pr-2">
                                <div class="flex flex-wrap items-center gap-1.5">
                                    <p class="font-bold text-slate-800 text-sm md:text-base tracking-wide dark:text-slate-100">${escapeHtml(item.name)}</p>
                                    <button type="button" data-stop-id="${escapeHtml(item.stopId)}" data-stop-seq="${item.seq}" data-stop-name="${escapeHtml(item.name)}" class="btn-same-stop text-[10px] font-medium px-2 py-0.5 rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200/80 transition dark:bg-blue-900/30 dark:text-blue-300 dark:border-blue-800 dark:hover:bg-blue-900/50 flex items-center gap-1 cursor-pointer">
                                        <i class="fa-solid fa-layer-group text-[9px]"></i> <span>${getText('same_stop_routes')}</span>
                                    </button>
                                    <button type="button" data-stop-id="${escapeHtml(item.stopId)}" data-stop-name="${escapeHtml(item.name)}" class="btn-open-modal text-[10px] font-medium px-1.5 py-0.5 rounded-md text-slate-400 hover:text-blue-600 hover:bg-slate-100 transition dark:hover:bg-slate-700 cursor-pointer" title="彈出視窗顯示">
                                        <i class="fa-solid fa-expand text-[9px]"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-span-5 text-right flex justify-end items-center gap-1">
                                <div class="flex items-center justify-end flex-wrap eta-box">${etaHTML}</div>
                            </div>
                            <div id="same-stop-drawer-${item.seq}" class="col-span-12 hidden mt-2.5 pt-2.5 pb-2 px-3 bg-slate-50/90 dark:bg-slate-900/60 rounded-xl border border-slate-200/80 dark:border-slate-700/80 transition-all">
                                <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-200/60 dark:border-slate-700/60">
                                    <span class="text-xs font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                                        <i class="fa-solid fa-bus-simple text-blue-500"></i> ${escapeHtml(item.name)} - ${getText('same_stop_title')}
                                    </span>
                                    <div class="flex items-center gap-1.5">
                                        <button type="button" data-stop-id="${escapeHtml(item.stopId)}" data-stop-seq="${item.seq}" data-stop-name="${escapeHtml(item.name)}" class="btn-refresh-same-stop text-[10px] text-slate-500 hover:text-blue-600 dark:text-slate-400 px-1.5 py-0.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1 cursor-pointer">
                                            <i class="fa-solid fa-rotate-right"></i> ${getText('refresh_btn')}
                                        </button>
                                        <button type="button" data-stop-seq="${item.seq}" class="btn-close-drawer text-[10px] text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 px-1.5 py-0.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 transition cursor-pointer">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="same-stop-content-${item.seq}" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-left max-h-64 overflow-y-auto pr-1">
                                </div>
                            </div>
                        `;
                        stopsContainer.appendChild(row);
                    } else {
                        const etaBox = row.querySelector('.eta-box');
                        if (etaBox) etaBox.innerHTML = etaHTML;
                    }
                } catch (rowError) {
                    console.error("Error rendering row:", rowError);
                }
            });
        }

        function renderTimetable() {
            timetableContainer.innerHTML = "";
            const fallbackData = [
                { day: "weekdays", periods: [{ t: "06:00 - 07:00", f: "12 - 15 min" }, { t: "07:00 - 09:00", f: "6 - 10 min" }, { t: "09:00 - 17:00", f: "10 - 15 min" }, { t: "17:00 - 19:30", f: "7 - 12 min" }, { t: "19:30 - 23:30", f: "15 - 20 min" }] },
                { day: "weekends", periods: [{ t: "06:00 - 10:00", f: "15 - 20 min" }, { t: "10:00 - 21:00", f: "10 - 15 min" }, { t: "21:00 - 23:30", f: "15 - 20 min" }] }
            ];
            
            let routeTimetable = null;
            if (staticTimetables[currentCompany] && staticTimetables[currentCompany][currentRoute]) {
                routeTimetable = staticTimetables[currentCompany][currentRoute][currentDirection];
            }

            const displayData = routeTimetable || fallbackData;

            displayData.forEach(group => {
                const card = document.createElement('div');
                card.className = "border border-slate-100 rounded-xl overflow-hidden shadow-sm dark:border-slate-700";
                const dayKey = group.day;
                const dayText = getDayText(dayKey);
                
                let rowsHTML = "";
                group.periods.forEach(p => {
                    rowsHTML += `
                        <div class="grid grid-cols-2 px-4 py-2.5 text-sm border-b border-slate-50 last:border-none hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-700/50">
                            <div class="font-mono text-slate-600 flex items-center gap-2 dark:text-slate-400"><i class="fa-regular fa-clock text-xs text-slate-400 dark:text-slate-500"></i> ${escapeHtml(p.t)}</div>
                            <div class="text-right font-bold text-blue-600 dark:text-blue-400">${escapeHtml(p.f)}</div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 flex items-center gap-2 border-b border-slate-200 dark:bg-slate-700/50 dark:text-slate-300 dark:border-slate-700">
                        <i class="fa-solid fa-calendar-day text-blue-500"></i> ${escapeHtml(dayText)}
                    </div>
                    <div class="divide-y divide-slate-100 bg-white dark:divide-slate-700 dark:bg-slate-800">
                        ${rowsHTML}
                    </div>
                `;
                timetableContainer.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
